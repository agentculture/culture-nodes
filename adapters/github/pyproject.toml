[project]
name = "culture-nodes-github-bridge"
version = "0.1.0"
description = "Allowlisted GitHub messaging actor bridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
github-bridge = "github_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_bridge"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
