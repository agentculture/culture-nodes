name: Adapter — codex

# Dedicated to adapters/codex ONLY — a NEW workflow file, deliberately not
# folded into tests.yml, so this adapter's CI cannot collide with a sibling
# adapter's own dedicated workflow file at merge time. Mirrors tests.yml's
# job shapes (test / lint) scoped to this package.
#
# The pytest job needs no real `codex` CLI: the unit suites drive
# codex_cli/mapping/async_runner/server entirely through fakes (see
# adapters/codex/README.md "Tests"). test_integration_bridge.py shells out
# to a REAL, authenticated codex and skips (never fails) when one is not on
# PATH — which is always true on a GitHub-hosted runner, so it skips
# cleanly here rather than needing to be excluded.

on:
  pull_request:
    branches: [main]
    paths:
      - "adapters/codex/**"
      - ".github/workflows/adapter-codex.yml"
  push:
    branches: [main]
    paths:
      - "adapters/codex/**"
      - ".github/workflows/adapter-codex.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - name: uv sync
        working-directory: adapters/codex
        run: uv sync

      - name: pytest
        working-directory: adapters/codex
        run: uv run pytest -v

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      # adapters/colleague has no dedicated lint config or dev-toolchain of
      # its own; this job follows that same minimal footprint by reusing
      # the ROOT project's black/isort/flake8/bandit config and dev group
      # (uv sync at repo root) against adapters/codex's own source, exactly
      # the way tests.yml's own `lint` job runs the same tools against
      # culture_nodes.
      - run: uv sync

      # Issue #123. The four commands used to be inline here, and the
      # difference between them and adapter-claude-code.yml's four — repo root
      # versus adapter directory, so root config versus adapter config — is
      # invisible to anyone reading one file. They live in
      # scripts/lint-all.sh now, which carries both forms, so running that one
      # script locally covers this job exactly as CI runs it.
      - name: lint (adapters/codex) — scripts/lint-all.sh adapter-codex
        run: scripts/lint-all.sh adapter-codex
