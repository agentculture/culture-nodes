# The code-node workflow tests/load drives N times concurrently (task t18).
# One `code` node dispatched to a registered runner SERVICE parks as
# waiting_external, and its result is learned only by an authenticated status
# sample -- which is what makes "100 in-flight operations" a statement about
# rows in a table rather than about goroutines in a process.
#
# It is a copy of tests/fault/testdata/runner.workflow.yaml (itself a copy of
# internal/worker/testdata/code.workflow.yaml) rather than a shared fixture: a
# testdata file in one package is not reachable from another, and this repo
# duplicates fixtures for that reason elsewhere too (see
# tests/fault/main_test.go).
#
# One deliberate change from the fault copy: policy.timeout is 15m rather than
# 5m, so a load run that deliberately holds operations in flight for minutes
# cannot have its measurement ended early by the attempt's own deadline timer.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: worker-code-load
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: test

  contract:
    input:
      schema:
        type: object
    output:
      schema:
        type: object

  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 3
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    test:
      kind: code
      ownerRef: team/developer-experience
      uses: runner://headspace/docker@sha256:5555555555555555555555555555555555555555555555555555555555555555
      operation:
        image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        argv: [python3, -c, "raise SystemExit(0)"]
        network: none
        allowedOutputPaths: []
      contract:
        outcomes:
          passed:
            schema:
              type: object
          failed:
            schema:
              type: object
      ledger:
        observe: [evidence]
      acceptance:
        requires:
          - kind: process_exit
            equals: 0
      policy:
        timeout: 15m
        retry:
          maxAttempts: 1

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/test/output

    giveup:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/test/output

  edges:
    - from: test.passed
      to: finish
    - from: test.failed
      to: giveup
