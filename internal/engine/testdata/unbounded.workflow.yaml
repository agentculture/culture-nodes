# The same graph as loop.workflow.yaml with maxTransitions lowered to 4: a
# checker that never says `done` would loop forever, and this fixture exists
# to prove it does not. The engine — not the agent — stops the run, which is
# PRD §9.7's "no loop may rely solely on an agent deciding when to stop"
# stated as a test.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: engine-unbounded-slice
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: intake

  contract:
    input:
      schema:
        type: object
        required: [subject]
        properties:
          subject:
            type: string
    output:
      schema:
        type: object
        required: [summary]
        properties:
          summary:
            type: string
          give_up:
            type: boolean

  limits:
    maxDuration: 1h
    maxTransitions: 4
    maxVisitsPerNode: 8
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10
    requireProvenance: true

  nodes:
    intake:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/intake@sha256:111111
      input:
        from: /run/input
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  type: string
      ledger:
        read: [current_scope]
        propose: [announcement, claim]
      policy:
        timeout: 5m
        retry:
          maxAttempts: 1
          backoff: none

    work:
      kind: agent
      ownerRef: team/developer-experience
      uses: actor://company/worker@sha256:222222
      input:
        from: /nodes/intake/output
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [revision]
              properties:
                revision:
                  type: integer
      ledger:
        read: [ready_tasks]
        propose: [claim, result]
      policy:
        timeout: 5m
        retry:
          maxAttempts: 3
          backoff: none

    check:
      kind: agent
      ownerRef: team/quality-platform
      uses: actor://company/checker@sha256:333333
      input:
        from: /nodes/work/output
      contract:
        outcomes:
          done:
            schema:
              type: object
              required: [summary, give_up]
              properties:
                summary:
                  type: string
                give_up:
                  type: boolean
          changes_required:
            schema:
              type: object
              required: [give_up]
              properties:
                give_up:
                  type: boolean
                summary:
                  type: string
      ledger:
        read: [verification_queue]
        propose: [claim, result, question]
      policy:
        timeout: 5m
        retry:
          maxAttempts: 1
          backoff: none

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/check/output

  edges:
    - from: intake.completed
      to: work

    - from: work.completed
      to: check

    # Guarded, and sorts first among check.changes_required's edges: a checker
    # that has given up ends the run instead of looping forever.
    - from: check.changes_required
      to: finish
      when: output.give_up

    - from: check.changes_required
      to: work

    - from: check.done
      to: finish
