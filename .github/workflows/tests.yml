name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Promote SONAR_TOKEN to job env so the SonarCloud step can gate on
    # `env.SONAR_TOKEN != ''` — `secrets.*` isn't allowed in `if:`. This
    # makes the step a no-op on fork PRs (where the secret isn't injected)
    # and on any repo that hasn't configured the token yet.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Sonar needs full git history for accurate "new code" blame attribution.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync

      - run: uv run pytest -n auto --cov=culture_nodes --cov-report=xml:coverage.xml --cov-report=term -v

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  # The Go control plane had no CI at all until this job (issue #115). It was
  # built and tested only on whichever machine an operator happened to be
  # sitting at — and no agent host in the fleet has a Go toolchain, so "run
  # the tests somewhere else" was not available even in principle. Every
  # `go test ./...` result in this repository's history came from one laptop.
  #
  # The suite passes today: the tree was green on build, vet and test when
  # this job was added, so a red check here is a regression rather than a
  # backlog of pre-existing failures being surfaced for the first time.
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Without a reachable Postgres this job would be green and hollow.
    # pgtest.RequireStore calls t.Skip when none is available, and `go test`
    # prints "ok" for a package whose every test skipped — measured: with the
    # database unreachable, `go test ./internal/queue/postgres/` reports ok
    # while `-v` shows 5 SKIPs. A CI job cannot tell those apart, so the
    # database is supplied here rather than hoped for.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nodes
          POSTGRES_PASSWORD: nodes-ci-only
          POSTGRES_DB: nodes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodes -d nodes"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Read the version from go.mod rather than pinning it twice; a
          # toolchain bump then changes one file, not two that can disagree.
          go-version-file: go.mod
          cache: true

      - run: go build ./...

      - run: go vet ./...

      # Not -race: several suites drive real subprocesses and a Postgres, and
      # the race detector's slowdown pushes them past their own timeouts. The
      # trade is deliberate — a fast job that runs on every PR beats a
      # thorough one that gets disabled.
      - name: go test
        env:
          NODES_TEST_DATABASE_URL: postgres://nodes:nodes-ci-only@localhost:5432/nodes?sslmode=disable
        run: go test ./...

      # The service above is only useful if the tests actually used it. A run
      # where every Postgres-backed test skipped is a false green, and this is
      # the cheapest way to notice: assert that at least one package that
      # needs the database ran a test rather than skipping it.
      - name: the database-backed tests actually ran
        env:
          NODES_TEST_DATABASE_URL: postgres://nodes:nodes-ci-only@localhost:5432/nodes?sslmode=disable
        run: |
          out=$(go test -count=1 -v ./internal/queue/postgres/ 2>&1)
          echo "$out" | tail -20
          if echo "$out" | grep -q "no PostgreSQL available"; then
            echo "::error::Postgres-backed tests SKIPPED — this job would have been green without testing anything"
            exit 1
          fi
          echo "$out" | grep -q -- "--- PASS" || {
            echo "::error::no test in internal/queue/postgres reported PASS"; exit 1; }

      - name: inbound authentication dump carries no presentable credential
        env:
          NODES_TEST_DATABASE_URL: postgres://nodes:nodes-ci-only@localhost:5432/nodes?sslmode=disable
        run: scripts/check-inbound-auth-dump.py

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync

      - name: Vendored skills unchanged in merge range
        env:
          RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check-vendored-skill-diff.py "$RANGE_BASE" "$GITHUB_SHA"

      - name: Zero-dependency CLI works in a bare environment
        run: scripts/check-zero-runtime-deps.sh

      - name: black --check
        run: uv run black --check culture_nodes tests

      - name: isort --check
        run: uv run isort --check-only culture_nodes tests

      - name: flake8
        run: uv run flake8 culture_nodes tests

      - name: bandit
        run: uv run bandit -c pyproject.toml -r culture_nodes

      - name: markdownlint-cli2
        run: |
          npm install -g markdownlint-cli2@0.21.0
          markdownlint-cli2 "**/*.md" "#node_modules" "#.local" "#.claude/skills" "#.teken"

      - name: afi rubric gate
        run: uv run teken cli doctor . --strict

      - name: open-issue triage is complete and current
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/triage-report.py --check

  version-check:
    # Only run on PR events. On push to main after a merged PR, the comparison
    # would always fail (PR_VERSION == MAIN_VERSION because HEAD and origin/main
    # point at the same commit). Restricting the trigger avoids that.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - run: git fetch origin main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check version bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # AgentCulture rule: every PR bumps the version — even docs/config/CI.
          # See CLAUDE.md and the version-bump skill for rationale.
          PR_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          MAIN_VERSION=$(git show origin/main:pyproject.toml 2>/dev/null | python3 -c "import sys,tomllib; print(tomllib.loads(sys.stdin.read())['project']['version'])" 2>/dev/null || echo "")

          if [ -z "$MAIN_VERSION" ]; then
            echo "No pyproject.toml on main yet — skipping version check (initial scaffold)."
            exit 0
          fi

          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            MARKER="<!-- version-check -->"
            BODY="⚠️ **Version not bumped** — \`pyproject.toml\` still has \`$PR_VERSION\` (same as main). Bump before merging to avoid a failed PyPI publish.

          $MARKER"

            EXISTING=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
              --jq '.[] | select(.body | contains("<!-- version-check -->")) | .id' | head -1)

            if [ -n "$EXISTING" ]; then
              gh api repos/${{ github.repository }}/issues/comments/$EXISTING \
                -X PATCH -f body="$BODY" > /dev/null
            else
              gh pr comment ${{ github.event.pull_request.number }} --body "$BODY" || true
            fi

            echo "::error::Version $PR_VERSION matches main. Bump before merging."
            exit 1
          else
            echo "Version bumped: $MAIN_VERSION -> $PR_VERSION"
          fi
