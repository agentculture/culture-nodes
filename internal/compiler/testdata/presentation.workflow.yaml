apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: presentation
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: start

  contract:
    input:
      schemaRef: ./contracts/in.schema.json
    output:
      schemaRef: ./contracts/out.schema.json

  presentation:
    layout: dagre
    theme: agentculture

  nodes:
    start:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/start@sha256:aaaaaa
      contract:
        outcomes:
          completed:
            schemaRef: ./contracts/start.schema.json
      input:
        from: /run/input
      presentation:
        icon: sparkles
        position:
          x: 10
          y: 20

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/start/output

  edges:
    - from: start.completed
      to: finish
