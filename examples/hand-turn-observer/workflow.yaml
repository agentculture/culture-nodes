# Hand-turn observer (issue #319, decision c25; plan loop-closure-claude-codex
# task t16, spec claims c8/h17).
#
# The human-guided observation loop, as a graph: an AGENT reads what happened
# around one work item -- its runs and attempt windows, the handover refs the
# loop pushed, the PR's events and the issue/PR comments -- and PROPOSES
# `hand_turn` ledger records against a `hand_turn_definition` record the human
# confirmed; the human then confirms or rejects the batch through the ordinary
# review surface and iterates the definition from what the observer got wrong.
# Nothing here promotes anything: every record the observer writes is
# origin=agent authority=proposed (internal/ledger/authority.go, unchanged by
# this record kind), and `hand_turns_by_stage` on GET /v1alpha1/actors/{id}/
# stats counts the CONFIRMED subset only. That confirmed count is the number a
# delivery summary cites (docs/operations/hand-turn-ledger.md).
#
# ---------------------------------------------------------------------------
# Deployment configuration -- WHAT THIS GRAPH NEEDS FROM OUTSIDE THE FILE
# ---------------------------------------------------------------------------
#
#   RUNNER REGISTRY (the id in `uses:`, resolved against this deployment's
#   runner-services registry):
#     runner://headspace/docker   the runner boundary the observe node
#                                 dispatches through, exactly as
#                                 examples/placement-proof registers it.
#
#   HAND_TURN_OBSERVER_SOURCE_URL / HAND_TURN_OBSERVER_SOURCE_SHA256
#                                 where observer.py is fetched from and the
#                                 digest the bootstrap refuses to run
#                                 without -- the examples/merge-gate
#                                 discipline (a code node has no file mount
#                                 yet, issue #50).
#   HAND_TURN_DEFINITION_URL / HAND_TURN_DEFINITION_SHA256
#                                 the confirmed definition's `data`, fetched
#                                 the same way (definition.json here is the
#                                 first one; the ledger record is the
#                                 authority, this is its published copy).
#   HAND_TURN_DEFINITION_REF      the ledger id of that confirmed
#                                 hand_turn_definition record, carried onto
#                                 every proposal as `definition_ref`.
#   NODES_API_URL                 the control plane the runs are read from
#                                 and the proposals are posted to.
#   NODES_HAND_TURN_TOKEN         the observer actor's OWN bearer
#                                 (internal/api/actorbearer.go): it opens
#                                 POST /v1alpha1/hand-turns and nothing else,
#                                 so this node can propose and cannot review.
#   NODES_OBSERVER_ACTOR_ID       the registered agent actor the records are
#                                 attributed to (kind agent -> proposed).
#
#   Per-run values arrive as the run input and reach the process as
#   NODES_INPUT_JSON: `work_item` (required), and the pre-fetched
#   `pr_events` / `issue_comments` / `handover_refs` arrays the operator
#   lane collects with `gh api` (README.md) -- this node holds no GitHub
#   credential and should not. `runs` is read live from NODES_API_URL.
#
# ---------------------------------------------------------------------------
# WHAT DOES NOT WORK YET -- read before believing the graph
# ---------------------------------------------------------------------------
#
#  1. The confirmation is a REVIEW, not this graph's approval node. The
#     `confirm-batch` node below parks the run on a person and carries the
#     proposals in its input, but the ledger act that confirms them is
#     `nodes review create --records ... && nodes review commit --confirm
#     ...` (or the web review surface) on the WORK ITEM'S run, where the
#     hand_turn records live. The approval here is the reminder and the
#     accounting of who looked; a review record naming each turn is what
#     stats count. Folding the two into one act is the follow-up.
#  2. PR events and comments are pre-fetched, not read by the node. The
#     rules that need them (branch deletes, replies, the ssh reset note) are
#     only as complete as the operator's `gh api` pull.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: hand-turn-observer
  version: 0.1.0
  ownerRef: team/platform-ai

spec:
  entry: observe

  contract:
    input:
      schema:
        type: object
        required: [work_item]
        properties:
          work_item:
            type: string
            minLength: 1
            description: The work-item key (e.g. SCRUM-9) whose runs, refs and PR history are observed.
          pr_events:
            type: array
            description: Pre-fetched PR events (commits, branch_created, branch_deleted) with author, branch/sha, at.
          issue_comments:
            type: array
            description: Pre-fetched issue/PR comments with author, body, url, at, thread_fixed_by_loop.
          handover_refs:
            type: array
            description: The loop's handover refs for this item (ref, commit, run_id).
    output:
      schema:
        type: object

  limits:
    maxDuration: 192h
    maxTransitions: 6
    maxVisitsPerNode: 1
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 200

  nodes:
    observe:
      kind: code
      ownerRef: team/platform-ai
      uses: runner://headspace/docker@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
      operation:
        image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        # `full`: the bootstrap fetches the observer and the definition from
        # the granted origins, reads runs from the control plane, and posts
        # the proposals back to it (#50: an egress allowlist is not yet
        # expressible; the posture is documented, not chosen).
        network: full
        argv:
          - python3
          - -c
          - |
            import hashlib, os, subprocess, sys, tempfile, urllib.request
            def fetch(url_var, sha_var, name):
                body = urllib.request.urlopen(os.environ[url_var], timeout=60).read()
                got = hashlib.sha256(body).hexdigest()
                if got != os.environ[sha_var]:
                    sys.exit("hand-turn-observer: %s digest %s, granted %s; refusing to run unverified content" % (name, got, os.environ[sha_var]))
                path = os.path.join(tempfile.mkdtemp(), name)
                open(path, "wb").write(body)
                return path
            observer = fetch("HAND_TURN_OBSERVER_SOURCE_URL", "HAND_TURN_OBSERVER_SOURCE_SHA256", "observer.py")
            definition = fetch("HAND_TURN_DEFINITION_URL", "HAND_TURN_DEFINITION_SHA256", "definition.json")
            sys.exit(subprocess.run([sys.executable, observer, "--definition", definition, "--fetch-runs", "--post"]).returncode)
        environmentRefs:
          - HAND_TURN_OBSERVER_SOURCE_URL
          - HAND_TURN_OBSERVER_SOURCE_SHA256
          - HAND_TURN_DEFINITION_URL
          - HAND_TURN_DEFINITION_SHA256
          - HAND_TURN_DEFINITION_REF
          - NODES_API_URL
          - NODES_HAND_TURN_TOKEN
          - NODES_OBSERVER_ACTOR_ID
        allowedOutputPaths: []
      contract:
        outcomes:
          passed:
            schema:
              type: object
              properties:
                proposed:
                  type: integer
                record_ids:
                  type: array
          failed:
            schema:
              type: object
      ledger:
        observe: [evidence]
      acceptance:
        requires:
          - kind: process_exit
            equals: 0
      policy:
        timeout: 10m
        retry:
          maxAttempts: 1

    # The person looks at the batch. See "what does not work yet" (1): the
    # ledger act is the review on the work item's run; this node is where the
    # graph waits for it and records who looked.
    confirm-batch:
      kind: approval
      ownerRef: team/platform-ai
      approverRef: group/platform-maintainers
      decisionSchemaRef: schema://hand-turn-observer/batch-reviewed/v1
      deadline: 168h
      input:
        bindings:
          proposals: /nodes/observe/output

    reviewed:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/observe/output

    declined:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/observe/output

    observer-failed:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/observe/output

  edges:
    - from: observe.passed
      to: confirm-batch
    - from: observe.failed
      to: observer-failed
    - from: confirm-batch.approved
      to: reviewed
    - from: confirm-batch.rejected
      to: declined
