# Task t17 (issue #37): acceptance.enforce = observe, EXPLICITLY. Identical
# to code.workflow.yaml (whose omitted enforce means the same default) except
# the policy is spelled out — so the test proves the explicit spelling also
# leaves routing exactly as it was: a failing check records a derived reject
# verdict and the node's own `failed` domain edge is still followed.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: worker-code-enforce-observe
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: test

  contract:
    input:
      schema:
        type: object
    output:
      schema:
        type: object

  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 3
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    test:
      kind: code
      ownerRef: team/developer-experience
      uses: runner://headspace/docker@sha256:5555555555555555555555555555555555555555555555555555555555555555
      operation:
        image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        argv: [python3, -c, "raise SystemExit(1)"]
        network: none
        allowedOutputPaths: []
      contract:
        outcomes:
          passed:
            schema:
              type: object
          failed:
            schema:
              type: object
      ledger:
        observe: [evidence]
      acceptance:
        enforce: observe
        requires:
          - kind: process_exit
            equals: 0
      policy:
        timeout: 5m
        retry:
          maxAttempts: 1

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/test/output

    giveup:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/test/output

  edges:
    - from: test.passed
      to: finish
    - from: test.failed
      to: giveup
