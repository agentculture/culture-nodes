apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: warn-policy
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: start

  contract:
    input:
      schemaRef: ./contracts/in.schema.json
    output:
      schemaRef: ./contracts/out.schema.json

  nodes:
    start:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/start@sha256:aaaaaa
      contract:
        outcomes:
          completed:
            schemaRef: ./contracts/start.schema.json
      input:
        from: /run/input

    build:
      kind: code
      ownerRef: team/developer-experience
      uses: runner://headspace/docker
      operation:
        image: registry.example/python-test:latest
        argv: [python, -m, pytest, -q]
        requiresShell: true
      contract:
        outcomes:
          passed:
            schemaRef: ./contracts/test-result.schema.json

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/build/output

  edges:
    - from: start.completed
      to: build
    - from: build.passed
      to: finish
