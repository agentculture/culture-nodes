# Culture Nodes — production profile, machine "thor" (plan t19).
#
# thor hosts the shared authoritative Postgres (frame decision q4), MinIO,
# and the full control plane; orin (compose.orin.yml) joins as the second
# worker against the same database. Two machines on one DB imitate the
# k8s multi-pod topology (spec assumption c7).
#
# The code-runner boundary note from deploy/compose/docker-compose.yml
# holds unchanged here: no service mounts a Docker socket. The runner
# service (cmd/nodes-runner) is NOT a compose service — it runs as a host
# process under a systemd user unit (nodes-runner.service), because the
# code-execution boundary needs the host's Docker and headspace toolchain;
# see README.md and deviation d2 in the plan.
#
# Secrets come from ~/.culture-nodes/prod.env, installed by
# install-secrets.sh over ssh stdin — never committed, never in argv.

services:
  postgres:
    profiles: ["bundled-postgres"]
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nodes}
      # Disabled profiles are still interpolated. External mode therefore
      # must not require the unused bundled password; install-secrets.sh
      # supplies it whenever bundled-postgres is enabled.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-nodes}
    ports:
      # Bound on all interfaces deliberately: orin's worker connects over
      # the LAN. The trust boundary is the LAN + password auth; see
      # README.md "Network trust".
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nodes} -d ${POSTGRES_DB:-nodes}"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nodesroot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?install secrets first (install-secrets.sh)}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  migrate:
    image: culture-nodes:prod
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        # What this image is being built from (task t32, issue #104). The
        # build context carries no .git, so the Dockerfile cannot discover
        # it; deploy.sh exports NODES_BUILD_REVISION as the resolved commit
        # it shipped, and the binary serves it on GET /v1alpha1/version.
        REVISION: ${NODES_BUILD_REVISION:-}
    command: ["migrate"]
    environment:
      NODES_DATABASE_URL: ${NODES_DATABASE_URL:?set the bundled or external PostgreSQL URL in prod.env}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"

  api:
    image: culture-nodes:prod
    command: ["serve"]
    environment:
      NODES_DATABASE_URL: ${NODES_DATABASE_URL:?set the bundled or external PostgreSQL URL in prod.env}
      NODES_LISTEN: ":8080"
      NODES_HUMAN_DECISION_TOKEN_SECRET: ${NODES_HUMAN_DECISION_TOKEN_SECRET:?install secrets first}
      NODES_CALLBACK_TOKEN_SECRET: ${NODES_CALLBACK_TOKEN_SECRET:?install secrets first}
      NODES_ARTIFACT_S3_ENDPOINT: minio:9000
      NODES_ARTIFACT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-nodesroot}
      NODES_ARTIFACT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      NODES_ARTIFACT_S3_BUCKET: ${NODES_ARTIFACT_S3_BUCKET:-nodes-artifacts}
      NODES_ARTIFACT_S3_USE_TLS: "false"
      # Bearer for external actor endpoints whose rows name this env var
      # (metadata.auth_token_env) — needed here too (task t4, issue #19):
      # POST .../cancel propagates a run cancellation to the actor directly
      # from the api service, the same credential the worker service
      # authenticates dispatch with.
      NODES_ACTOR_CLAUDE_TOKEN: ${NODES_ACTOR_CLAUDE_TOKEN:-}
      NODES_ACTOR_CODEX_THOR_TOKEN: ${NODES_ACTOR_CODEX_THOR_TOKEN:-}
      NODES_ACTOR_CODEX_ORIN_TOKEN: ${NODES_ACTOR_CODEX_ORIN_TOKEN:-}
      # The notify actor bridge (issue #68). Every actor token must be
      # named here explicitly: the env-file reaches compose, not the
      # container, so an unlisted token is simply absent at dispatch.
      NODES_ACTOR_NOTIFY_TOKEN: ${NODES_ACTOR_NOTIFY_TOKEN:-}
      # The three bearer secrets the attempts-evidence-humans-loops batch
      # added (t13 registration, t10 event delivery, t19+t15 ad-hoc lane).
      # Optional on purpose: closed-by-default means an unset secret leaves
      # that route refusing 401, never mounted-authless.
      NODES_ACTOR_REGISTRATION_TOKEN_SECRET: ${NODES_ACTOR_REGISTRATION_TOKEN_SECRET:-}
      NODES_EVENT_TOKEN_SECRET: ${NODES_EVENT_TOKEN_SECRET:-}
      NODES_ADHOC_RUN_TOKEN_SECRET: ${NODES_ADHOC_RUN_TOKEN_SECRET:-}
      # Task t13 / issue #5. Empty by default, and that IS the gate:
      # internal/telemetry.New returns NoOp() when this is unset — no
      # exporter, no goroutine, no dial. Set it in prod.env to
      # http://otel-collector:4317 to use the bundled collector below
      # (which also needs `--profile telemetry`), or to any other
      # OTLP/gRPC endpoint to use any other collector. Which collector
      # answers is a value, never a code or image change.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "18080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        required: false
      minio:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: culture-nodes:prod
    command: ["scheduler"]
    environment:
      NODES_DATABASE_URL: ${NODES_DATABASE_URL:?set the bundled or external PostgreSQL URL in prod.env}
      NODES_SCHEDULER_ID: thor-scheduler-1
      # See the api service's note: unset means telemetry off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  worker:
    image: culture-nodes:prod
    command: ["worker"]
    environment:
      NODES_DATABASE_URL: ${NODES_DATABASE_URL:?set the bundled or external PostgreSQL URL in prod.env}
      # Set by deploy.sh after the API's first boot mints the namespace id.
      NODES_NAMESPACE_ID: ${NODES_NAMESPACE_ID:-default}
      NODES_WORKER_ID: thor-worker-1
      NODES_CALLBACK_BASE_URL: ${NODES_CALLBACK_BASE_URL:-http://thor:18080}
      NODES_CALLBACK_TOKEN_SECRET: ${NODES_CALLBACK_TOKEN_SECRET:?install secrets first}
      NODES_ARTIFACT_S3_ENDPOINT: minio:9000
      NODES_ARTIFACT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-nodesroot}
      NODES_ARTIFACT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      NODES_ARTIFACT_S3_BUCKET: ${NODES_ARTIFACT_S3_BUCKET:-nodes-artifacts}
      NODES_ARTIFACT_S3_USE_TLS: "false"
      # Runner-service placement: present only when the operator installed a
      # registry file (see deploy.sh); an absent file keeps the in-process
      # CodeRunner path only.
      # See compose.orin.yml for why this is interpolated rather than
      # hardcoded: a partial tuple is refused, and a hardcoded name makes the
      # legitimate "no code nodes here" state unreachable. thor keeps its
      # code-runner capability because it has the other two, which is exactly
      # the condition install-secrets.sh checks before writing this key.
      NODES_CODE_RUNNER_NAME: ${NODES_CODE_RUNNER_NAME:-}
      NODES_CODE_RUNNER_REVISION: ${NODES_CODE_RUNNER_REVISION:-}
      NODES_CODE_RUNNER_ACTOR_ID: ${NODES_CODE_RUNNER_ACTOR_ID:-}
      # Bearer for external actor endpoints whose rows name this env var
      # (metadata.auth_token_env) — the credential never enters the DB.
      NODES_ACTOR_CLAUDE_TOKEN: ${NODES_ACTOR_CLAUDE_TOKEN:-}
      NODES_ACTOR_CODEX_THOR_TOKEN: ${NODES_ACTOR_CODEX_THOR_TOKEN:-}
      NODES_ACTOR_CODEX_ORIN_TOKEN: ${NODES_ACTOR_CODEX_ORIN_TOKEN:-}
      # The notify actor bridge (issue #68). Every actor token must be
      # named here explicitly: the env-file reaches compose, not the
      # container, so an unlisted token is simply absent at dispatch.
      NODES_ACTOR_NOTIFY_TOKEN: ${NODES_ACTOR_NOTIFY_TOKEN:-}
      NODES_RUNNER_SERVICES_FILE: ${NODES_RUNNER_SERVICES_FILE:-}
      # See the api service's note: unset means telemetry off. This is the
      # seam #5 cares most about — worker.dispatch — and it is instrumented
      # on BOTH machines, so compose.orin.yml carries the same variable.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ~/.culture-nodes/runners:/etc/nodes-runners:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        required: false
      minio:
        condition: service_healthy
    restart: unless-stopped

  # Discord/webhook notifier daemon (economy-discord-graphs task t14): a
  # separate process from api/worker/scheduler by design, so the control
  # plane gains zero Discord code and zero Discord egress by construction
  # (see internal/notifier/doc.go). Same image as the control plane — the
  # Dockerfile's build stage compiles both `nodes` and `nodes-notifier`;
  # this service just selects the second binary via an entrypoint
  # override, the smallest change that avoids a second image (see the
  # Dockerfile's own header comment for the full reasoning).
  notifier:
    image: culture-nodes:prod
    entrypoint: ["/nodes-notifier"]
    environment:
      # Container-network address: notifier and api are sibling services on
      # the same compose network, unlike NODES_CALLBACK_BASE_URL below,
      # which is a URL actor bridges on the LAN call back to and so must be
      # the host-reachable address.
      NODES_NOTIFIER_API_BASE: http://api:8080
      NODES_NOTIFIER_CURSOR_FILE: /var/lib/nodes-notifier/cursor.json
      NODES_NOTIFIER_DASHBOARD_BASE: ${NODES_NOTIFIER_DASHBOARD_BASE:-http://thor:18080}
      # internal/notify.ResolveWebhook reads exactly these two names, in
      # this priority order (CULTURE_NODES_WEBHOOK_URL first) — see
      # cmd/nodes-notifier/main.go's own usage text. Neither has a flag on
      # purpose: the URL embeds a bearer token, and a secret on a command
      # line is visible in every process listing. Both default to empty —
      # install-secrets.sh installs whichever one the operator supplied
      # into thor's prod.env; absent either, the daemon still runs and
      # simply journals every lifecycle event as delivery-disabled rather
      # than failing (fail-open, per internal/notify/doc.go).
      CULTURE_NODES_WEBHOOK_URL: ${CULTURE_NODES_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      # A NAMED volume, not a bind mount: the durable cursor file is this
      # daemon's whole exactly-once-across-restarts guarantee (see
      # internal/notifier/cursor.go's doc comment) — it must survive a
      # container recreate the same way pgdata/miniodata do, so it gets
      # the same volume treatment as those two stateful services rather
      # than living inside the otherwise-stateless control-plane image.
      - notifiercursor:/var/lib/nodes-notifier
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # Scheduled logical backups (plan t20, extended off-host by t14/#30). Every
  # BACKUP_INTERVAL_SECONDS a full pg_dump lands in ~/.culture-nodes/backups
  # on the host (bind mount) AND, when BACKUP_S3_BUCKET is set, is copied to
  # object storage. The restore runbook is deploy/prod/RESTORE.md.
  #
  # Two retentions, deliberately different, because they answer different
  # questions:
  #   - local:  the newest 7 dumps, rotated below. Fast to restore from,
  #             worthless if the host is what failed.
  #   - remote: every dump pushed to s3://$BACKUP_S3_BUCKET/backups/, expired
  #             by the bucket's own lifecycle rule rather than by this loop.
  #             A backup process that can delete its own off-host copies is
  #             one bug away from deleting the thing it exists to protect.
  #
  # The S3 copy is opt-in and fails soft: an upload error is logged and the
  # loop continues, because a broken off-host copy must not stop the local
  # dump that is still working. `backup <ts> s3 FAILED` in the log is the
  # signal to investigate.
  backup:
    profiles: ["backup"]
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$${BACKUP_S3_BUCKET:-}" ] && ! command -v aws >/dev/null 2>&1; then
          apk add --no-cache aws-cli >/dev/null 2>&1 || \
            echo "backup: BACKUP_S3_BUCKET is set but aws-cli could not be installed; local dumps only"
        fi
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          if pg_dump "$${NODES_DATABASE_URL}" -Fc -f "/backups/nodes-$$ts.dump"; then
            ln -sf "nodes-$$ts.dump" /backups/latest.dump
            echo "backup $$ts ok"
            if [ -n "$${BACKUP_S3_BUCKET:-}" ] && command -v aws >/dev/null 2>&1; then
              if aws s3 cp "/backups/nodes-$$ts.dump" \
                   "s3://$${BACKUP_S3_BUCKET}/backups/nodes-$$ts.dump"; then
                echo "backup $$ts s3 ok"
              else
                echo "backup $$ts s3 FAILED — local dump kept, investigate"
              fi
            fi
          fi
          ls -1t /backups/nodes-*.dump 2>/dev/null | tail -n +8 | xargs -r rm -f
          sleep $${BACKUP_INTERVAL_SECONDS:-21600}
        done
    environment:
      NODES_DATABASE_URL: ${NODES_DATABASE_URL:?set the bundled or external PostgreSQL URL in prod.env}
      # Off-host backups are opt-in: unset means local-only, which is what
      # every deployment without an AWS account gets.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ~/.culture-nodes/backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # The OTLP collector (task t13, issue #5), behind `--profile telemetry`.
  #
  # Off unless asked for, twice over: the profile keeps `docker compose up`
  # from starting it, and OTEL_EXPORTER_OTLP_ENDPOINT being empty keeps the
  # control plane from building an exporter even if it is running. Turning
  # telemetry on is therefore a deliberate two-step, and turning it off is
  # removing one line from prod.env.
  #
  # Config: deploy/otel-collector.yaml, the SAME file the local profile
  # mounts (see its header for what this collector is and why the export
  # goes to stdout — `docker compose logs otel-collector` is the query
  # surface). Traces land in the container's log stream, so nothing here
  # holds state and no volume is needed for them.
  otel-collector:
    profiles: ["telemetry"]
    image: otel/opentelemetry-collector-contrib:latest@sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5
    volumes:
      - ../otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      # Bound on all interfaces for the same reason Postgres above is:
      # orin's worker is the second instrumented process in this
      # deployment, and its dispatches are half the spans a trace taken
      # across the pair contains. The trust boundary is the LAN — see
      # README.md "Network trust". A deployment that keeps orin's worker
      # unexported instead simply leaves this variable unset there.
      - "4317:4317"
    restart: unless-stopped

volumes:
  pgdata: {}
  miniodata: {}
  notifiercursor: {}
