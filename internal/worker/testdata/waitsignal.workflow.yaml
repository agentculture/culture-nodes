# A wait node on until.signal (task t10, issue #39, spec decision c35):
# the dispatch parks the run on a durable signal subscription — no lease,
# no timer — and an authenticated POST /v1alpha1/events delivery of the
# named event is what resumes it, the run completing through its normal
# edges with the resuming event folded into the wait node's output.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: worker-wait-signal
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: pause

  contract:
    input:
      schema:
        type: object
    output:
      schema: {}

  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 4
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    pause:
      kind: wait
      ownerRef: team/platform-ai
      until:
        signal: green-light

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /run/input

  edges:
    - from: pause.completed
      to: finish
