# SonarCloud project identity. Matches the project key registered on
# SonarCloud and used by the cicd skill's Sonar status queries
# (`agentculture_culture-nodes`).
sonar.projectKey=agentculture_culture-nodes
sonar.organization=agentculture

# Source layout — package lives at the top level (no src/ wrapper).
sonar.sources=culture_nodes
sonar.tests=tests

# Coverage report produced in CI by `uv run pytest --cov-report=xml:coverage.xml`
# (see .github/workflows/tests.yml). Path is relative to the repo root.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

# Don't analyze noise.
sonar.exclusions=**/__pycache__/**,**/.venv/**,uv.lock,.claude/skills/**

# Block CI on a failing quality gate. The scanner polls SonarCloud and exits
# non-zero on a red gate (coverage regression, new bugs/vulnerabilities). Only
# takes effect when the SonarCloud Scan step runs — that step is guarded by
# `if: env.SONAR_TOKEN != ''` in .github/workflows/tests.yml, so token-less
# repos and fork PRs (no injected secret) skip the scan and stay green.
sonar.qualitygate.wait=true

# --- Rule exclusions, argued rather than assumed -------------------------
#
# python:S3516 "Refactor this method to not always return the same value"
# fires on every CLI command handler, because returning a constant 0 IS this
# CLI's contract, not an oversight:
#
#   * `culture_nodes/cli/_errors.py` defines the exit-code policy — 0 success,
#     1 user error, 2 environment error.
#   * `cli/__init__.py`'s `_dispatch()` catches CliError and returns
#     `err.code`. A handler signals failure by RAISING, never by returning a
#     different int, so its return value can only ever express success.
#   * It is repo-wide, not a quirk of one module: every command handler under
#     _commands/ has the same shape.
#
# Satisfying the rule would mean inventing return values the dispatcher
# ignores, or moving failure signalling out of exceptions — breaking the
# contract to please a linter. Excluded at the rule+path level rather than
# per-issue, because a per-issue dismissal has to be repeated on every future
# PR that touches a command module.
#
# Scoped to _commands/ deliberately: elsewhere in the package, a function that
# always returns the same value probably IS a smell worth hearing about.
#
# Found via a live pr-upkeep run (issue #71): the fix lane refused these three
# on its own reasoning and left the code alone. This records the decision it
# reached so the finding stops recurring.
sonar.issue.ignore.multicriteria=cliExit
sonar.issue.ignore.multicriteria.cliExit.ruleKey=python:S3516
sonar.issue.ignore.multicriteria.cliExit.resourceKey=culture_nodes/cli/_commands/**/*.py
