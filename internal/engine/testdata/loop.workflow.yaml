# A four-node vertical slice with a real loop: intake -> work -> check, where
# check.changes_required routes back to work and check.done routes to the end
# node. It is the smallest workflow that exercises everything the engine must
# get right — a domain outcome that loops (PRD §3.4), first-match-wins edge
# selection with a CEL guard, a retry policy, ledger propose permissions, and
# an end node whose output binding produces the run result.
#
# Edge order matters and is the compiler's, not this file's: normalization
# sorts by source node, outcome, target, then guard text. The two edges out of
# check.changes_required therefore evaluate `-> finish` (guarded) before
# `-> work` (unguarded), which is what makes the guard able to win.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: engine-loop-slice
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: intake

  contract:
    input:
      schema:
        type: object
        required: [subject]
        properties:
          subject:
            type: string
    output:
      schema:
        type: object
        required: [summary]
        properties:
          summary:
            type: string
          give_up:
            type: boolean

  limits:
    maxDuration: 1h
    maxTransitions: 32
    maxVisitsPerNode: 8
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10
    requireProvenance: true

  nodes:
    intake:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/intake@sha256:111111
      input:
        from: /run/input
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  type: string
      ledger:
        read: [current_scope]
        propose: [announcement, claim]
      policy:
        timeout: 5m
        retry:
          maxAttempts: 1
          backoff: none

    work:
      kind: agent
      ownerRef: team/developer-experience
      uses: actor://company/worker@sha256:222222
      input:
        from: /nodes/intake/output
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [revision]
              properties:
                revision:
                  type: integer
      ledger:
        read: [ready_tasks]
        propose: [claim, result]
      policy:
        timeout: 5m
        retry:
          maxAttempts: 3
          backoff: none

    check:
      kind: agent
      ownerRef: team/quality-platform
      uses: actor://company/checker@sha256:333333
      input:
        from: /nodes/work/output
      contract:
        outcomes:
          done:
            schema:
              type: object
              required: [summary, give_up]
              properties:
                summary:
                  type: string
                give_up:
                  type: boolean
          changes_required:
            schema:
              type: object
              required: [give_up]
              properties:
                give_up:
                  type: boolean
                summary:
                  type: string
      ledger:
        read: [verification_queue]
        propose: [claim, result, question]
      policy:
        timeout: 5m
        retry:
          maxAttempts: 1
          backoff: none

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/check/output

  edges:
    - from: intake.completed
      to: work

    - from: work.completed
      to: check

    # Guarded, and sorts first among check.changes_required's edges: a checker
    # that has given up ends the run instead of looping forever.
    - from: check.changes_required
      to: finish
      when: output.give_up

    - from: check.changes_required
      to: work

    - from: check.done
      to: finish
