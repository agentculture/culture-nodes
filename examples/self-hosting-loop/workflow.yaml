# The self-hosting loop (plan t23): culture-nodes drives its own development.
#
# A variant of examples/delivery-loop shaped for the claude-code actor
# bridge's contract-v1 input ({instruction, repo, success_outcome}) and its
# fixed output ({summary, changed_files, artifacts_path}). Two deliberate
# differences from the reference workflow, both bridge-honest:
#
#   1. Agent nodes bind instruction/repo from the run input per role — the
#      bridge refuses an invocation that names no allowlisted repo.
#   2. The human approval sits on the HAPPY path (verify.passed -> ship-review):
#      the claude bridge maps success to one declared outcome, so branch
#      selection between ship and rework belongs to the human reviewing the
#      real diff — approved ships, rejected loops back to build.
#
# Deployment configuration (task t16) — what this graph needs from outside
# it, and where each value comes from:
#
#   RUN INPUT (the run's input document):
#     repo                 the working directory on whichever host each
#                          agent actor is registered on. The claude-code
#                          bridge refuses an invocation naming a repo
#                          outside its OWN allowlist, so this value is
#                          agreed between the run and the actor -- never
#                          something the engine decides.
#     intake_instruction, plan_instruction, build_instruction,
#     verify_instruction   the words each node's actor is given, per run.
#
#   ACTOR / RUNNER REGISTRY (an id in `uses:`, resolved by
#   internal/worker/registry.go against this deployment's actors table):
#     actor://company/intake       the intake node.
#     actor://company/planner      the planning node.
#     actor://company/developer    the build node.
#     actor://company/verifier     the verification node.
#     runner://headspace/docker    the runner boundary for the code node.
#
#   The `ship-review` approval node places on no actor: the engine parks its
#   token and a person resumes it through the decision endpoint.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: self-hosting-loop
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: intake

  contract:
    input:
      schema:
        type: object
        required: [repo, intake_instruction, plan_instruction, build_instruction, verify_instruction]
    output:
      schema:
        type: object

  limits:
    maxDuration: 2h
    maxTransitions: 40
    maxVisitsPerNode: 3
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 100

  nodes:
    intake:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/intake@sha256:1111111111111111111111111111111111111111111111111111111111111111
      input:
        bindings:
          instruction: /run/input/intake_instruction
          repo: /run/input/repo
      contract:
        input:
          schema:
            type: object
            required: [instruction, repo]
        outcomes:
          completed:
            schema:
              type: object
              required: [summary]
              properties:
                summary:
                  type: string
      ledger:
        propose: [claim]
      policy:
        timeout: 10m
        retry:
          maxAttempts: 2
          backoff: exponential

    plan:
      kind: agent
      ownerRef: team/architecture
      uses: actor://company/planner@sha256:2222222222222222222222222222222222222222222222222222222222222222
      input:
        bindings:
          instruction: /run/input/plan_instruction
          repo: /run/input/repo
          scope: /nodes/intake/output
      contract:
        input:
          schema:
            type: object
            required: [instruction, repo]
        outcomes:
          completed:
            schema:
              type: object
              required: [summary]
      ledger:
        propose: [claim]
      policy:
        timeout: 10m
        retry:
          maxAttempts: 2
          backoff: exponential

    build:
      kind: agent
      ownerRef: team/developer-experience
      uses: actor://company/developer@sha256:3333333333333333333333333333333333333333333333333333333333333333
      input:
        bindings:
          instruction: /run/input/build_instruction
          repo: /run/input/repo
          plan: /nodes/plan/output
          priorReview: /ledger/projections/verification_queue
      contract:
        input:
          schema:
            type: object
            required: [instruction, repo]
        outcomes:
          completed:
            schema:
              type: object
              required: [summary]
      ledger:
        read: [active_tasks]
        propose: [claim]
      policy:
        timeout: 20m
        retry:
          maxAttempts: 2
          backoff: exponential

    test:
      kind: code
      ownerRef: team/developer-experience
      uses: runner://headspace/docker@sha256:5555555555555555555555555555555555555555555555555555555555555555
      operation:
        image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        argv: [python3, -c, "import sys; print('self-hosting-loop test gate'); sys.exit(0)"]
        network: none
        allowedOutputPaths: []
      contract:
        outcomes:
          passed:
            schema:
              type: object
              required: [operation_id, state]
              properties:
                state:
                  type: string
          failed:
            schema:
              type: object
              required: [operation_id, state]
              properties:
                state:
                  type: string
      ledger:
        observe: [evidence]
      acceptance:
        requires:
          - kind: process_exit
            equals: 0
      policy:
        timeout: 15m
        retry:
          maxAttempts: 1

    verify:
      kind: agent
      ownerRef: team/quality
      uses: actor://company/verifier@sha256:4444444444444444444444444444444444444444444444444444444444444444
      input:
        bindings:
          instruction: /run/input/verify_instruction
          repo: /run/input/repo
          success_outcome: /run/input/verify_success_outcome
          changeSet: /nodes/build/output
          testEvidence: /ledger/projections/evidence
      contract:
        input:
          schema:
            type: object
            required: [instruction, repo]
        outcomes:
          passed:
            schema:
              type: object
              required: [summary]
      ledger:
        propose: [claim]
      policy:
        timeout: 10m
        retry:
          maxAttempts: 2
          backoff: exponential

    # The human gate on the happy path: the operator reviews the real diff
    # the developer produced and the verifier's summary, then either ships
    # (approved -> finish) or sends it back (rejected -> build).
    ship-review:
      kind: approval
      ownerRef: team/platform-ai
      decisionSchemaRef: ./contracts/ship-decision.schema.json
      approverRef: group/platform-ai-approvers
      deadline: 24h
      input:
        from: /nodes/verify/output

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/verify/output

  edges:
    - from: intake.completed
      to: plan
    - from: plan.completed
      to: build
    - from: build.completed
      to: test
    - from: test.passed
      to: verify
    - from: test.failed
      to: build
    - from: verify.passed
      to: ship-review
    - from: ship-review.approved
      to: finish
    # The approval vocabulary is fixed (approved/rejected/expired/...):
    # `rejected` is this workflow's "changes required" — it loops to build,
    # bounded by maxVisitsPerNode, rather than ending the run.
    - from: ship-review.rejected
      to: build
