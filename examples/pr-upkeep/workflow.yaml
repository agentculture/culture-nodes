# The PR-upkeep loop (plan task t21, spec claims c15/c26, honesty h21):
# culture-nodes sweeps its OWN quality debt — unresolved SonarCloud issues,
# open Qodo findings on open PRs, and failed CI check runs on those PRs'
# head commits (issue #61) — and works the list one item at a time through
# a human-gated fix/review cycle. The flow holds zero merge
# credentials: `approved` on the human gate MEANS the human already merged
# the PR themselves (see README.md, "the human-merges rule").
#
# The cycle: sweep -> triage -> fix -> review, then review's two verdicts
# diverge: `approve` goes straight to the merge assignment
# (human-merges-pr), `changes_required` goes to a genuine decision
# (ask-pr-question -> notify-decision-pending -> human-answers-review)
# because the flow cannot itself judge whether the reviewer's findings hold
# up. `human-answers-review.merged` and `.answered` both loop back into the
# cycle; `.dropped` ends the run. An empty sweep returns straight to
# `backoff` (task t9's durable wait) and re-sweeps; a broken sweep uses the
# SAME wait node before retrying. Every human interaction in this graph is
# now a real-world artifact the tracker observes (merge, reply, or PR
# closure) — see the "Idle vs blocked" note below.
#
# Idle vs blocked (issue #71, the operator's design decision on #71):
# `human-prepares-next-item` used to conflate two different states behind
# one generic "resume/done" park — "nothing to do right now" (idle) and "I
# need a person to judge something" (blocked) — which is why an idle loop
# and a blocked loop looked identical and neither could be woken by a newly
# arrived PR (issue #72 was the deploy-split prerequisite that made this
# observable in production). The fix removes the node outright:
#
#  * IDLE stops being a human task. `triage.empty` now returns to `sweep`
#    via `backoff` — the SAME 30-minute durable wait `sweep_broken` already
#    used — instead of parking on a person. Nobody is "assigned" an idle
#    repository, and `sweep` is now both the loop's entry AND its resting
#    place. This is issue #71's Option C, deliberately re-scoped: it is no
#    longer a stopgap sitting beside a human park, it IS the idle path.
#  * BLOCKED gets a real decision, wired from `review.changes_required`
#    (the one point in this graph where the flow has a specific question it
#    cannot answer itself): `ask-pr-question` posts the review's findings as
#    a PR comment (the question belongs where the review conversation
#    already lives), `notify-decision-pending` announces to Discord that a
#    decision is pending (adapters/notify, issue #68 — the notification
#    says a decision is waiting, the PR holds the substance), and
#    `human-answers-review` parks on an `observe: {kind: github_pr_reply}`
#    declaration — exactly the shape `human-merges-pr` already uses for
#    `github_pr_merged`, generalized in adapters/human-inbox's tracker
#    (issue #71's tracker.py changes; see that adapter's README for the
#    rate-budget arithmetic and the "which reply counts" rule). A PR that
#    gets merged or closed while the question is pending is ALSO an
#    observable — `human-answers-review.merged` / `.dropped` — so a question
#    posted to a PR that is later merged or closed does not wait forever.
#
# The fix -> review handoff (issue #74, task t13):
# `fix` and `review` are deliberately DIFFERENT actors on DIFFERENT machines
# — company/developer on spark, company/codex-thor on thor. A filesystem path
# is not portable across that boundary, and this graph used to hand one over
# anyway: run 01KZZSGSWH11J7R7P4V2HPTZZQ fixed and committed b01608c on spark,
# then died at `review` with `auth_or_policy` HTTP 403 from thor's codex
# bridge, which had correctly refused a spark path that is outside its
# allowlist and does not exist on thor at all. The graph asked for something
# incoherent, and the error named authorization when the cause was topology.
#
# What travels now is a HANDLE, not a location — and since spec decision q9
# (task t6) there are TWO KINDS of handle, with the rule declared once in
# schemas/workflow/handoff.schema.json and embedded verbatim wherever a
# contract carries one:
#
#   * a runner's CHANGES travel as `git_ref` — `git+<https|ssh>://<remote>#
#     refs/culture-nodes/<run-id>/<node-run-id>` plus the `commit` it pins.
#     A remote plus a ref name plus a sha carries no host and no path, which
#     is the property #74 actually required and the property a filesystem
#     path failed; and a diff is naturally a git object already, so making
#     it one costs nothing.
#   * CONTEXT AND DATA that is not naturally a git object travels as
#     `artifact` — an `artifact://<namespace>/<id>` reference which by
#     construction "never carries or implies a filesystem path"
#     (internal/artifacts/doc.go) and resolves through the store from any
#     host. The sweep's prioritised item list is JSON, not a git object, so
#     it is on this side of the rule (`sweepReport.artifacts`).
#
# This supersedes the note that used to sit here, which said a git ref was
# impossible because the spark bridge host could not push. That was true when
# it was written and is no longer: task t1 provisioned `GITHUB_TOKEN_WORKER`
# into the bridge units, and issue #91 measured that a codex session under
# `--sandbox workspace-write` can write `.git` when the dispatch widens
# `writable_roots` (deviation d6). #74's own recommendation — "option 1, with
# 2 for anything not naturally a git object" — is what the graph now says.
# `review` binds the handle (`handoff: /nodes/fix/output/handoff`) and
# requires it whichever kind it is; its own `review_repo` remains only the
# working directory the codex bridge allowlists on thor, never the work
# under review.
#
# WHAT IS NOT WIRED YET, stated plainly so nobody reads this graph as more
# finished than it is. Both carriers are half-built, and in the same half:
# a producer can create the handle, and no consumer can yet follow it.
#
#   * `artifact` — task t5 mounted the PUBLISH side
#     (POST /v1alpha1/attempts/{attemptID}/artifacts, internal/api/
#     artifacts.go, attempt-token scoped). There is still no fetch route on
#     the control plane's HTTP surface, and /nodes/<id>/artifacts is not a
#     bindable surface (refused by internal/compiler/contract.go and
#     internal/worker/bindings.go).
#   * `git_ref` — the bridge-side producer exists and is deterministic:
#     `preserve.handover_ref` in all three code adapters mints
#     refs/culture-nodes/<run-id>/<node-run-id> out of the SAME
#     write-tree/commit-tree/update-ref plumbing preserve-on-failure uses.
#     It deliberately does NOT push: AGENTS.md lets an agent create a
#     handover ref and forbids it to push or to commit onto a branch, so the
#     handle it reports carries `publication: pending` and the ref is
#     unreachable from any branch until the operator or the control plane
#     moves it. Nothing moves it yet, and no node fetches one yet.
#
# So a fix host that has done the work but cannot get it to the next machine
# still has exactly one honest answer, and it is a domain outcome:
# `handoff_unavailable`, naming which publish capability is missing
# (`artifact_publish` or `git_ref_publish`). That remains a far better answer
# than reviewing thor's own checkout and calling it a review of spark's work.
#
# Authoring decisions worth stating outright:
#
#  1. `triage` routes on /nodes/sweep/output's `exit_code`. A code node's
#     persisted output is runner metadata (operation id, state, exit code,
#     artifact refs — internal/runners/dispatch.go's CodeNodeOutput), not
#     the script's stdout, so the sweep script encodes its one routable
#     domain fact in the exit code: 0 = work found, 10 = clean empty sweep
#     (sweep.py's EXIT_EMPTY), anything else = the sweep itself broke.
#     Both of sweep's outcomes feed triage — `failed` here is a DOMAIN
#     answer (delivery-loop's own pattern), and triage tells the benign
#     empty sweep apart from a genuine breakage by the sentinel exit code.
#
#  2. `review` binds /nodes/fix/evidence AND /ledger/projections/evidence —
#     the node-run-scoped evidence surface (task t7) next to the run-wide
#     projection (task t6). The reviewer sees exactly the fix node's own
#     evidence records and the run's full evidence trail, alongside the
#     fix node's self-reported output. It runs on company/codex-thor, a
#     DIFFERENT backend than the fix actor (independent-review's
#     "diversity is the value" pattern), and stays READ-ONLY: issue #18
#     keeps codex sessions analysis-only, so the run-input contract below
#     pins `review_sandbox` to the literal "read-only".
#
#  3. `ask-pr-question` reuses the FIX actor (`company/developer`), not a
#     new identity: it is the only actor in this flow with an established
#     GitHub write credential (it already opens/updates PRs), and the
#     review actor stays read-only per issue #18. `human-answers-review`
#     declares THREE outcomes because a decision node genuinely has three
#     ways to stop waiting: `answered` (a qualifying reply — loops back to
#     `fix` for another pass, mirroring the old changes_required->fix
#     edge), `merged` (the human just merged the PR instead of replying —
#     the strongest possible "yes", loops back to `sweep` like
#     `human-merges-pr.merged` does), and `dropped` (the PR closed unmerged,
#     auto-observed, OR a manual override — ends the run, mirroring the old
#     rejected->finish edge). `answered`/`merged`/`dropped` are all AUTO
#     outcomes except `dropped`'s manual lane, which — like
#     `human-merges-pr` — always remains available (README's "override
#     lanes stay intact").
#
#  4. Acceptance blocks use `enforce: observe` (this pass of issue #37):
#     every check verdict lands as a derived record without touching
#     routing. sweep's process_exit check pre-announces "found work" (exit
#     0) as its success criterion — an empty sweep records an honest
#     failed-check verdict that routing deliberately treats as the benign
#     `failed` domain outcome.
#
#  5. The sweep operation FETCHES its extractor at dispatch time from the
#     URL the deployment grants (see Deployment configuration below), and
#     verifies its sha256 before executing it. The script is stdlib-only, so
#     any python:3.12 base works and the image needs nothing baked in.
#     `network: egress-allowlist` is the declared intent, scoping it to
#     sonarcloud.io + api.github.com + the granted Jira host, plus the source
#     host.
#
# Deployment configuration (task t16) — everything below this graph needs
# from the world outside it, and where each value comes from. Loading this
# example into another deployment means supplying these; it never means
# editing the graph.
#
#   RUN INPUT (the run's input document; examples/pr-upkeep/driver.sh builds
#   one, and spec.contract.input below declares every property):
#     repo, review_repo   per-host working directories. `repo` is where the
#                         fix actor works, `review_repo` is the review
#                         actor's own allowlisted checkout — two hosts, two
#                         paths, and neither is the work under review (that
#                         crosses as `handoff`, issue #74).
#     *_instruction, notify_*, review_sandbox
#                         the words each actor is given, authored per run.
#
#   ACTOR / RUNNER REGISTRY (an id in `uses:`, resolved by
#   internal/worker/registry.go against this deployment's actors table with
#   the @sha256 revision suffix stripped — register the SAME id against your
#   own endpoint; the id names a role, and where the machine names in the
#   prose below appear they record where THIS deployment ran it, not a
#   requirement on yours):
#     actor://company/developer        the fix lane, and the one identity
#                                      here with a GitHub write credential.
#     actor://company/codex-thor       the review lane — deliberately a
#                                      different backend AND host than the
#                                      fix lane, which is the whole point of
#                                      the independent-review pattern.
#     actor://company/human-ops        the kind=human inbox bridge.
#     actor://company/notify-discord   the notify adapter (issue #68).
#     runner://headspace/docker        the code-node runner boundary.
#
#   GRANTED ENVIRONMENT VALUES (named here, supplied by the worker process
#   that dispatches the operation; the runner boundary refuses the operation
#   BY NAME when one is unset — internal/runners/headspace/bridge.go):
#     PR_UPKEEP_SWEEP_SOURCE_URL      where the sweep script is fetched from.
#     PR_UPKEEP_SWEEP_SOURCE_SHA256   the sha256 the fetched bytes must have.
#     PR_UPKEEP_REPOSITORIES          the closed ordered repo/component set,
#                                     current cycle index, and optional Jira
#                                     site/project for each entry.
#     JIRA_ACCOUNT_EMAIL              Jira Cloud Basic-auth account value.
#     JIRA_API_TOKEN                  its separately issued API token.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: pr-upkeep
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: sweep

  contract:
    input:
      schema:
        type: object
        required: [repo, review_repo, fix_instruction, review_instruction, review_sandbox, ask_instruction, notify_title, notify_description, await_reply_instruction, merge_instruction]
        additionalProperties: false
        properties:
          # The one repo this flow works on (claim c26): the fix/review
          # bridges refuse an invocation naming a non-allowlisted repo, and
          # the sweep script hard-codes its own component key besides.
          repo:
            type: string
            minLength: 1
          # The review actor lives on a different host with its own
          # allowlisted checkout (found live: cycle 4's review got 403
          # handing thor's codex bridge a spark path). Same repository,
          # per-host path.
          review_repo:
            type: string
            minLength: 1
          fix_instruction:
            type: string
            minLength: 1
          review_instruction:
            type: string
            minLength: 1
          # Issue #18: codex sessions are analysis-only. Pinning the value
          # at the contract level makes a writable review run unpublishable
          # rather than merely unadvised.
          review_sandbox:
            type: string
            const: read-only
          # What ask-pr-question tells the fix actor to post as a PR
          # comment when review comes back changes_required (issue #71: the
          # question belongs in the review thread, not a second inbox).
          ask_instruction:
            type: string
            minLength: 1
          # notify-decision-pending's Discord message is deliberately
          # STATIC text, not per-PR detail: "the notification says a
          # decision is waiting, the PR holds the substance" (the operator's
          # design decision on issue #71) — the reader follows the PR link
          # in the ask-pr-question comment for the actual question.
          notify_title:
            type: string
            minLength: 1
          notify_description:
            type: string
            minLength: 1
          # human-answers-review's park instruction — what it is durably
          # waiting for (a PR reply, or the PR's own terminal state).
          await_reply_instruction:
            type: string
            minLength: 1
          merge_instruction:
            type: string
            minLength: 1
    output:
      schema:
        type: object

  # Bounded for a few loop iterations (PRD §9.7): sweep is re-entered by
  # `human-merges-pr.merged` and `human-answers-review.merged` (next item),
  # and by `backoff` after EITHER an empty sweep (issue #71: idle is no
  # longer a human task) or a broken one, so it gets the deepest headroom;
  # fix is re-entered by `human-answers-review.answered`. maxDuration is
  # human-timescale because the flow parks on people at both
  # human-merges-pr and human-answers-review.
  limits:
    maxDuration: 168h
    maxTransitions: 64
    maxVisitsPerNode: 6
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 200

  nodes:
    # The sweep. Read-only against its deployment-granted finding surfaces; its
    # prioritised work-item list rides in the result-payload/stdout
    # artifacts (refs in /nodes/sweep/output.artifacts) and its measured
    # facts (exit code, duration) land as runner-observed evidence —
    # `ledger.observe: [evidence]` is the code-node-only declaration that
    # lets the runner append them with observed authority (PRD §10.4).
    sweep:
      kind: code
      ownerRef: team/platform-ai
      uses: runner://headspace/docker@sha256:5555555555555555555555555555555555555555555555555555555555555555
      operation:
        image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        # The image carries no repo checkout, so the sweep script is fetched
        # and exec'd — the only code-shipping mechanism a bare operation
        # supports today (found live: python3 exits 2 on the missing /opt
        # path; run 01KZXAJ7KAH7WX495TDNM4MEZR). A file-mount/artifact-input
        # mechanism for code nodes is follow-up material alongside issue #50.
        #
        # WHOSE script runs is a deployment's decision, not this file's (task
        # t16). This argv used to name a raw.githubusercontent URL pinned to
        # one org, one commit and one path, which meant a third party who
        # loaded this example got a graph that silently fetched and executed
        # OUR bytes — a supply-chain property, not a portability wart. The
        # origin is now a granted environment value, and the bootstrap below
        # verifies what comes back against a second granted value before it
        # executes anything: same reason the `image:` above is pinned by
        # digest rather than by tag.
        #
        # Two distinct refusals, deliberately at two different depths. A name
        # the RUNNER's own environment does not carry never reaches this
        # script at all: the boundary refuses the operation as
        # rejected_input, naming the missing value
        # (internal/runners/headspace/bridge.go's resolveEnv). A value that
        # is present but empty, or bytes whose digest does not match, is
        # caught here and exits nonzero — `sweep_broken`, which routes to the
        # backoff wait like any other broken sweep. The 0 / 10 / other
        # exit-code contract is untouched either way.
        environmentRefs:
          - PR_UPKEEP_SWEEP_SOURCE_URL
          - PR_UPKEEP_SWEEP_SOURCE_SHA256
          - PR_UPKEEP_REPOSITORIES
          - JIRA_ACCOUNT_EMAIL
          - JIRA_API_TOKEN
        argv:
          - python3
          - -c
          - |
            import hashlib, os, sys, urllib.request
            names = ("PR_UPKEEP_SWEEP_SOURCE_URL", "PR_UPKEEP_SWEEP_SOURCE_SHA256")
            url, want = (os.environ.get(name, "").strip() for name in names)
            missing = [n for n, v in zip(names, (url, want)) if not v]
            if missing:
                sys.exit("pr-upkeep sweep: %s unset. The deployment grants the sweep "
                         "script's source and its sha256 -- see this workflow's "
                         "Deployment configuration block." % ", ".join(missing))
            source = urllib.request.urlopen(url, timeout=30).read()
            got = hashlib.sha256(source).hexdigest()
            if got != want.lower():
                sys.exit("pr-upkeep sweep: %s serves sha256:%s, not the configured "
                         "sha256:%s. Refusing to execute it." % (url, got, want.lower()))
            exec(compile(source.decode(), "sweep.py", "exec"))
        # DECLARED intent: network: egress-allowlist (sonarcloud.io,
        # api.github.com, and the deployment-granted Jira site). Headspace-cli
        # 0.11.0 supports only disabled/
        # enabled network posture, so the runner boundary honestly rejects
        # egress-allowlist as rejected_input (issue #50). `full` is the
        # working posture until headspace ships allowlist support; restore
        # network: egress-allowlist and add a runner conformance fixture then.
        network: full
        allowedOutputPaths: []
      contract:
        outcomes:
          passed:
            schema:
              type: object
              required: [operation_id, state]
              properties:
                state:
                  type: string
                exit_code:
                  type: integer
          failed:
            schema:
              type: object
              required: [operation_id, state]
              properties:
                state:
                  type: string
                exit_code:
                  type: integer
      ledger:
        observe: [evidence]
      acceptance:
        enforce: observe
        requires:
          - kind: process_exit
            equals: 0
      policy:
        timeout: 10m
        retry:
          maxAttempts: 2
          backoff: exponential

    # The split. A decision node's `output` variable is its RESOLVED INPUT
    # (internal/worker/decision.go's stated convention) — here the sweep's
    # output document — and first match wins, so the ports read top-down:
    # work found, clean empty, everything else broken.
    triage:
      kind: decision
      ownerRef: team/platform-ai
      input:
        from: /nodes/sweep/output
      select:
        - outcome: items
          when: "output.state == 'completed' && output.exit_code == 0"
        - outcome: empty
          when: "output.state == 'completed' && output.exit_code == 10"
        - outcome: sweep_broken
          when: "true"

    # The fix. The spark claude-code bridge actor — the same
    # company/developer identity delivery-loop, self-hosting-loop and
    # independent-review build on. It takes the TOP item of the sweep's
    # prioritised list (the list is the priority; the sweep report's
    # artifact refs ride in sweepReport.artifacts), works ONLY that item,
    # and opens or updates a PR — it never merges one. decision_history
    # carries the human gate's changes_required notes back into the loop's
    # later passes.
    #
    # It also PUBLISHES its work as a portable handle (issue #74): the review
    # actor is on another machine, so `repo` below — spark's checkout — is
    # where this node works and nothing the next node can read. See the
    # `completed`/`handoff_unavailable` contracts and this file's header for
    # what crosses the boundary and what happens when it cannot.
    fix:
      kind: agent
      ownerRef: team/developer-experience
      uses: actor://company/developer@sha256:3333333333333333333333333333333333333333333333333333333333333333
      input:
        bindings:
          instruction: /run/input/fix_instruction
          repo: /run/input/repo
          sweepReport: /nodes/sweep/output
          sweepEvidence: /nodes/sweep/evidence
          decisions: /ledger/projections/decision_history
      contract:
        input:
          schema:
            type: object
            required: [instruction, repo]
        outcomes:
          # A completed fix MUST carry a portable handle (issue #74). `repo`
          # above is where this actor WORKS; it is meaningless on any other
          # host, so it can never be what the review lane reads. `handoff` is
          # the thing that crosses, and since spec decision q9 it may be
          # either carrier: a `git_ref` for this lane's CHANGES, or an
          # `artifact` reference for anything that is not naturally a git
          # object. Neither may be a filesystem path.
          #
          # It is REQUIRED rather than optional on purpose. The engine
          # validates a completion against this schema
          # (internal/engine/complete.go's checkOutput), so a fix session that
          # produced no handle cannot report `completed` at all — it is
          # contract_rejected at the FIX node, where the cause is, instead of
          # sailing on to a review node that will fail somewhere else. A
          # session that genuinely cannot produce one says so by name, through
          # the `handoff_unavailable` outcome below.
          completed:
            schema:
              type: object
              required: [summary, handoff]
              properties:
                summary:
                  type: string
                # DECLARED ONCE, EMBEDDED HERE: every constraint below is
                # schemas/workflow/handoff.schema.json's, copied verbatim
                # because a node contract is a self-contained document the
                # engine validates against — it cannot $ref a control-plane
                # schema. tests/lint/crosshosthandoff_test.go compares the two
                # keyword-by-keyword, so a copy that drifts fails the build
                # instead of quietly becoming a second, weaker rule. Read the
                # rationale for each refusal there; do not edit one copy.
                handoff:
                  type: object
                  required: [kind, ref]
                  additionalProperties: false
                  properties:
                    kind:
                      type: string
                      enum: [artifact, git_ref]
                    ref:
                      type: string
                      minLength: 1
                    commit:
                      type: string
                      pattern: '^[0-9a-f]{40}$'
                    publication:
                      type: string
                      enum: [pending, published]
                    media_type:
                      type: string
                  allOf:
                    - if:
                        required: [kind]
                        properties:
                          kind:
                            const: artifact
                      then:
                        properties:
                          ref:
                            pattern: '^artifact://[^/]+/.+$'
                    - if:
                        required: [kind]
                        properties:
                          kind:
                            const: git_ref
                      then:
                        required: [commit, publication]
                        properties:
                          ref:
                            pattern: '^git\+(https|ssh)://[^\s#]+#refs/culture-nodes/[^\s]+$'
          # The honest failure (issue #74, task t13's criterion 3). A fix host
          # that cannot publish its work as an artifact has ONE correct answer,
          # and it is a domain outcome, not a technical error and emphatically
          # not somebody else's 403.
          #
          # The history this exists to prevent: run 01KZZSGSWH11J7R7P4V2HPTZZQ
          # fixed and committed b01608c on spark, then died at `review` with
          # `auth_or_policy` HTTP 403 from thor's codex bridge. The bridge was
          # correct — it was handed a spark path outside its allowlist that
          # does not exist on thor — but the error named AUTHORIZATION when the
          # cause was TOPOLOGY, which is the single worst place for a reader to
          # start debugging.
          #
          # `missing_capability` is a CLOSED enum so the answer is a name a
          # dashboard can group by, not a sentence someone has to interpret.
          # Two carriers means two publish capabilities, and a host can be
          # missing either one independently:
          #   artifact_publish   — the host has no way to put bytes in the
          #                        artifact store (no ingest endpoint reachable
          #                        from it, no credential, store unconfigured).
          #   git_ref_publish    — the host made a handover commit but nothing
          #                        can make its ref reachable from another
          #                        machine: no remote configured, or the only
          #                        remote is a local path, which is the same
          #                        unportable thing the handle exists to
          #                        refuse. The agent-may-not-push policy alone
          #                        is NOT this outcome — that case is a
          #                        `publication: pending` handle, which is a
          #                        completion, not a failure.
          #   workspace_export   — the host could not produce the bundle at all
          #                        (git plumbing failed, nothing to export).
          #                        `.git` read-only under a sandbox that was
          #                        not widened lands here (issue #91, d6).
          #   handoff_too_large  — the work exceeds what this lane may move.
          handoff_unavailable:
            schema:
              type: object
              required: [summary, missing_capability, detail]
              properties:
                summary:
                  type: string
                missing_capability:
                  type: string
                  enum:
                    - artifact_publish
                    - git_ref_publish
                    - workspace_export
                    - handoff_too_large
                detail:
                  type: string
      ledger:
        read: [decision_history]
        propose: [claim, result]
      acceptance:
        enforce: observe
        requires:
          # Pre-announced criterion: a fix that changed nothing fixed
          # nothing. Evaluable only when a runner measured the workspace
          # comparison; unmeasured stays honestly unevaluated (issue #37).
          - kind: workspace_diff
            complete: true
      policy:
        timeout: 45m
        retry:
          maxAttempts: 2
          backoff: exponential

    # The independent review. A different model family and bridge than
    # `fix` (ask-colleague's "the diversity is the value", authored as a
    # node exactly like examples/independent-review). Read-only per issue
    # #18 — the run-input contract pins the sandbox. Its bindings are the
    # evidence surfaces this build made real: the fix node's OWN evidence
    # records (/nodes/fix/evidence, task t7) beside the run-wide evidence
    # projection (task t6), and the fix node's self-reported output —
    # labelled as a completion claim, not verified fact (PRD §10.4).
    # BOTH verdicts reach a human: `approve` becomes an active merge
    # assignment (human-merges-pr), `changes_required` becomes a genuine
    # decision (ask-pr-question -> notify-decision-pending ->
    # human-answers-review, issue #71) — every loop-back through the
    # billable fix actor passes a person first, either way.
    #
    # It reads the work under review through the fix lane's `handoff` handle
    # (issue #74), never through a path: this node runs on thor and the fix
    # lane runs on spark, and the only reason it is reachable at all is that
    # `fix.completed` could not have been reported without producing one.
    review:
      kind: agent
      ownerRef: team/quality
      uses: actor://company/codex-thor@sha256:1111111111111111111111111111111111111111111111111111111111111a
      input:
        bindings:
          instruction: /run/input/review_instruction
          # WHERE this session runs — the review host's OWN allowlisted
          # checkout, which the codex bridge requires and resolves against its
          # allowlist. It is a working directory, NOT the work under review:
          # that checkout knows nothing about what the fix lane just did on a
          # different machine (issue #74).
          repo: /run/input/review_repo
          sandbox: /run/input/review_sandbox
          # WHAT is under review — the fix lane's portable handle. This is the
          # binding that replaced "hand the other host your path", and it is
          # the only one of review's inputs that carries the fix lane's actual
          # work across the machine boundary.
          handoff: /nodes/fix/output/handoff
          fixReport: /nodes/fix/output
          fixEvidence: /nodes/fix/evidence
          runEvidence: /ledger/projections/evidence
      contract:
        input:
          schema:
            type: object
            # `handoff` is required for the same reason `fix.completed`
            # requires it: an optional handle is one a dispatch can proceed
            # without, and a review that proceeds without it reviews its own
            # host's checkout — the wrong tree, silently, which is worse than
            # the 403 it replaced.
            required: [instruction, repo, sandbox, handoff]
            properties:
              # The RECEIVING half of the same rule, and it is asserted here
              # rather than assumed: the producing contract is the fix node's,
              # and a review dispatch that trusted it would be trusting a
              # different document. Same constraints, same single declaration
              # in schemas/workflow/handoff.schema.json — so a path smuggled
              # into this binding by any route is refused at the review node's
              # own boundary too, before a session is spent on it.
              handoff:
                type: object
                required: [kind, ref]
                additionalProperties: false
                properties:
                  kind:
                    type: string
                    enum: [artifact, git_ref]
                  ref:
                    type: string
                    minLength: 1
                  commit:
                    type: string
                    pattern: '^[0-9a-f]{40}$'
                  publication:
                    type: string
                    enum: [pending, published]
                  media_type:
                    type: string
                allOf:
                  - if:
                      required: [kind]
                      properties:
                        kind:
                          const: artifact
                    then:
                      properties:
                        ref:
                          pattern: '^artifact://[^/]+/.+$'
                  - if:
                      required: [kind]
                      properties:
                        kind:
                          const: git_ref
                    then:
                      required: [commit, publication]
                      properties:
                        ref:
                          pattern: '^git\+(https|ssh)://[^\s#]+#refs/culture-nodes/[^\s]+$'
        outcomes:
          approve:
            schema:
              type: object
              required: [verdict, findings]
              properties:
                verdict:
                  type: string
                  enum: [approve]
                findings:
                  type: array
                  items:
                    type: object
                    required: [severity, note]
                    properties:
                      severity:
                        type: string
                        enum: [info, minor, major, blocking]
                      note:
                        type: string
          changes_required:
            schema:
              type: object
              required: [verdict, findings]
              properties:
                verdict:
                  type: string
                  enum: [changes_required]
                findings:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [severity, note]
                    properties:
                      severity:
                        type: string
                        enum: [info, minor, major, blocking]
                      note:
                        type: string
      ledger:
        propose: [claim]
      policy:
        timeout: 20m
        retry:
          maxAttempts: 2
          backoff: exponential

    # The merge task (user decision, cycle 6 refinement): a PR that is
    # through review with no pending fixes becomes an ACTIVE assignment on
    # the kind=human actor — "merge this PR" lands in the person's inbox as
    # work, not as a passive gate. merged = the person merged it themselves
    # and submitted; dropped = they decided not to merge (ends the run).
    # The flow still holds zero merge credentials (README's human-merges
    # rule) — the submission REPORTS the merge, it never performs it.
    human-merges-pr:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/human-ops@sha256:8888888888888888888888888888888888888888888888888888888888888888
      input:
        bindings:
          instruction: /run/input/merge_instruction
          fixReport: /nodes/fix/output
          reviewVerdict: /nodes/review/output
          # WHICH pull request, per cycle: the one the fix node just opened
          # or updated. The tracker reads `pr` from the observe block when it
          # is there and from the task's own input otherwise, the same
          # fallback it has always applied to `repo`.
          pr: /nodes/fix/output/pr_number
          # WHAT this node is waiting for, declared in the graph text (issue
          # #73's typed literal binding). A literal is a constant fixed at
          # publish time, which is exactly right for the observation KIND and
          # exactly wrong for the PR number above — so the two are declared
          # separately rather than smuggling a pointer inside a literal,
          # which would be the template language PRD §11.2 forbids.
          observe:
            literal:
              kind: github_pr_merged
      contract:
        input:
          schema:
            type: object
            required: [instruction]
            properties:
              instruction:
                type: string
              pr:
                type: integer
              observe:
                type: object
                required: [kind]
                properties:
                  kind:
                    type: string
                    const: github_pr_merged
        outcomes:
          merged:
            schema:
              type: object
              properties:
                note:
                  type: string
          dropped:
            schema:
              type: object
              properties:
                note:
                  type: string
      ledger:
        propose: [claim]
      policy:
        timeout: 168h
        retry:
          maxAttempts: 1

    # The question, posted where the review conversation already lives
    # (issue #71, replacing human-prepares-next-item's generic park for the
    # "blocked on a judgement" case). Reuses the FIX actor
    # (company/developer): it is the only actor in this flow with an
    # established GitHub write credential (it already opens/updates this
    # exact PR), so posting a comment on it needs no new identity. The
    # review actor stays read-only per issue #18 and could not do this.
    ask-pr-question:
      kind: agent
      ownerRef: team/developer-experience
      uses: actor://company/developer@sha256:3333333333333333333333333333333333333333333333333333333333333333
      input:
        bindings:
          instruction: /run/input/ask_instruction
          repo: /run/input/repo
          pr: /nodes/fix/output/pr_number
          reviewVerdict: /nodes/review/output
      contract:
        input:
          schema:
            type: object
            required: [instruction, repo]
        outcomes:
          posted:
            schema:
              type: object
              properties:
                comment_url:
                  type: string
      ledger:
        propose: [claim, result]
      policy:
        timeout: 10m
        retry:
          maxAttempts: 2
          backoff: exponential

    # The announcement (issue #68's adapters/notify, declared step with a
    # ledger record). Deliberately says only that a decision is PENDING —
    # "the notification says a decision is waiting, the PR holds the
    # substance" (the operator's design decision on issue #71) — so
    # notify_title/notify_description are static per-run text, not a
    # per-PR composition the binding surface cannot build (bindings resolve
    # JSON pointers, not templated strings). require_delivery is left
    # unbound (defaults false): a dead or unconfigured webhook must not
    # stall this flow — the PARK on human-answers-review is the real gate,
    # not the notification.
    notify-decision-pending:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/notify-discord@sha256:7777777777777777777777777777777777777777777777777777777777777777
      input:
        bindings:
          title: /run/input/notify_title
          description: /run/input/notify_description
      contract:
        input:
          schema:
            type: object
            required: [title, description]
        outcomes:
          sent:
            schema:
              type: object
              properties:
                delivered:
                  type: boolean
                status_code:
                  type: [integer, "null"]
      ledger:
        propose: [claim]
      policy:
        timeout: 30s
        retry:
          maxAttempts: 1

    # The wait. An agent-kind node on the SAME kind=human actor
    # human-merges-pr uses (company/human-ops, task t12's bridge), parked on
    # `observe: {kind: github_pr_reply}` — the tracker's NEW observation
    # kind (issue #71's adapters/human-inbox/src/human_inbox_bridge/
    # tracker.py changes). Three outcomes because there are three genuine
    # ways to stop waiting, all auto-observed except dropped's manual lane:
    #   * answered — a qualifying PR reply landed; loops back to `fix` for
    #     another pass (mirrors the old human-approves-pr.changes_required
    #     edge).
    #   * merged   — the human merged the PR instead of replying, the
    #     strongest possible answer; loops back to `sweep`, same as
    #     human-merges-pr.merged.
    #   * dropped  — the PR closed unmerged while the question sat unread
    #     (auto-observed, so a question on a dead PR does not wait forever),
    #     or a manual override; ends the run (mirrors the old
    #     human-approves-pr.rejected edge).
    # The long timeout matches human-merges-pr's human-timescale deadline.
    human-answers-review:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/human-ops@sha256:8888888888888888888888888888888888888888888888888888888888888888
      input:
        bindings:
          instruction: /run/input/await_reply_instruction
          reviewVerdict: /nodes/review/output
          questionPosted: /nodes/ask-pr-question/output
          # Same split as human-merges-pr above, same reason (#73): which PR
          # is per-cycle data, what is being watched is a declaration.
          pr: /nodes/fix/output/pr_number
          observe:
            literal:
              kind: github_pr_reply
      contract:
        input:
          schema:
            type: object
            required: [instruction]
            properties:
              instruction:
                type: string
              pr:
                type: integer
              observe:
                type: object
                required: [kind]
                properties:
                  kind:
                    type: string
                    const: github_pr_reply
        outcomes:
          answered:
            schema:
              type: object
              properties:
                note:
                  type: string
          merged:
            schema:
              type: object
              properties:
                note:
                  type: string
          dropped:
            schema:
              type: object
              properties:
                note:
                  type: string
      ledger:
        propose: [claim]
      policy:
        timeout: 168h
        retry:
          maxAttempts: 1

    # The idle/broken wait (task t9's durable wait timer), now doing double
    # duty (issue #71): a genuinely BROKEN sweep waits before retrying so
    # transient API weather does not burn a maxVisitsPerNode slot every few
    # seconds, and an EMPTY sweep (idle — nothing to do) waits here too
    # instead of parking on a person. The park is durable — no lease held
    # while waiting, either way.
    backoff:
      kind: wait
      ownerRef: team/platform-ai
      until:
        duration: 30m

    finish:
      kind: end
      ownerRef: team/platform-ai
      # Every path to finish passes sweep (the entry), so the last sweep
      # report is the one output every terminal run can honestly carry.
      output:
        from: /nodes/sweep/output

    # Where `fix.handoff_unavailable` ends (issue #74). A missing HOST
    # capability is not something any other node in this graph can resolve:
    # no amount of reviewing, asking or waiting gives the fix host an artifact
    # store or a remote its ref could reach. So the run ends, and it ends
    # carrying the FIX node's output
    # rather than `finish`'s sweep report — that output is where
    # `missing_capability` lives, and a terminal run whose output does not
    # name why it stopped is the same illegible failure this whole change is
    # about.
    #
    # It is a separate `end` node rather than a route into `finish` for
    # exactly that reason: `finish` outputs the sweep report, which would
    # bury the one fact that matters here.
    #
    # No notification node sits in front of it deliberately: the notify actor
    # takes static per-run text (see notify-decision-pending), so it could
    # announce that something stopped but not WHICH capability is missing —
    # and adding two more run-input fields to say less than the run output
    # already says is not a trade worth making. An operator reads the named
    # outcome on the run.
    handoff-blocked:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/fix/output

  edges:
    # Both sweep outcomes are domain answers headed for triage: `passed`
    # is exit 0 (work found), `failed` is any nonzero exit — the sentinel
    # empty sweep and genuine breakage alike, told apart by exit_code.
    - from: sweep.passed
      to: triage
    - from: sweep.failed
      to: triage

    - from: triage.items
      to: fix
    # issue #71: idle is no longer a human task. An empty sweep returns to
    # `backoff` — the SAME wait node a broken sweep uses — and re-sweeps
    # in 30m, exactly like sweep_broken below. Nobody is "assigned" an idle
    # repository, and this is what makes `sweep` both the loop's start and
    # its resting place.
    - from: triage.empty
      to: backoff
    - from: triage.sweep_broken
      to: backoff

    - from: backoff.completed
      to: sweep

    - from: fix.completed
      to: review
    # The honest failure never reaches review (issue #74). Routing a fix that
    # produced no portable handle into the review node is precisely what
    # turned a topology problem into an HTTP 403 on another machine; the run
    # stops here instead, naming the capability that is missing.
    - from: fix.handoff_unavailable
      to: handoff-blocked

    # A clean review verdict becomes an ACTIVE merge assignment on the
    # human actor (user decision: "waiting for merge" is work in a
    # person's inbox, not a passive gate); changes_required goes to a
    # genuine decision (issue #71) instead of a second inbox — the question
    # posts to the PR that review just examined.
    - from: review.approve
      to: human-merges-pr
    - from: review.changes_required
      to: ask-pr-question
    - from: human-merges-pr.merged
      to: sweep
    - from: human-merges-pr.dropped
      to: finish

    - from: ask-pr-question.posted
      to: notify-decision-pending
    - from: notify-decision-pending.sent
      to: human-answers-review

    # answered = a qualifying PR reply landed -> back to fix for another
    # pass, notes carried in the ledger's decision history.
    - from: human-answers-review.answered
      to: fix
    # merged = the human merged the PR instead of replying, the strongest
    # possible answer -> sweep the next item, same as human-merges-pr.
    - from: human-answers-review.merged
      to: sweep
    # dropped = the PR closed unmerged (auto-observed, so a pending
    # question never waits on a dead PR) or a manual override -> end the
    # run with the sweep report.
    - from: human-answers-review.dropped
      to: finish
