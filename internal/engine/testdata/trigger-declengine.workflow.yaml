# Task t38 (#328): the trigger-subject fixture triggered by `timer`, a
# registered declaration trigger kind, so ONE delivered event is offered to
# both engines and a test can compare them under each switch mode.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: engine-trigger-declengine
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: work

  contract:
    input:
      schema:
        type: object
    output:
      schema:
        type: object

  triggers:
    - onEvent: timer

  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 4
    maxParallelTokens: 1

  nodes:
    work:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/worker@sha256:111111
      input:
        from: /run/input
      contract:
        outcomes:
          completed:
            schema:
              type: object
      policy:
        timeout: 1m
        retry:
          maxAttempts: 1
          backoff: none

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/work/output

  edges:
    - from: work.completed
      to: finish
