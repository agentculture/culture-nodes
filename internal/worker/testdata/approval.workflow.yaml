# A three-node slice exercising an approval node: intake -> review -> finish,
# where review is `kind: approval`. It exists for the worker package's own
# proof (task t8, deviation d1) that dispatching an approval node never
# reaches the worker at all: the engine parks it as a human_tasks row
# (internal/engine/humantask.go, task t6), so no work_items row is ever
# created and the worker's claim loop has nothing to see. It is the same
# shape as internal/engine/testdata/approval.workflow.yaml, copied rather
# than shared (a _test.go-adjacent testdata file is not importable across
# packages), with intake's `uses` pointed at this package's own harness
# registry entry instead of the engine suite's.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: worker-approval-slice
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: intake

  contract:
    input:
      schema:
        type: object
        required: [subject]
        properties:
          subject:
            type: string
    output:
      schema:
        type: object

  limits:
    maxDuration: 1h
    maxTransitions: 32
    maxVisitsPerNode: 8
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10
    requireProvenance: true

  nodes:
    intake:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/analyzer@sha256:aaaaaa
      input:
        from: /run/input
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  type: string
      ledger:
        propose: [announcement, claim]
      policy:
        timeout: 5m
        retry:
          maxAttempts: 1
          backoff: none

    review:
      kind: approval
      ownerRef: team/platform-ai
      decisionSchemaRef: ./contracts/review-decision.schema.json
      approverRef: group/platform-ai-approvers
      deadline: 2h
      input:
        from: /nodes/intake/output

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/intake/output

  edges:
    - from: intake.completed
      to: review

    - from: review.approved
      to: finish

    - from: review.rejected
      to: finish
