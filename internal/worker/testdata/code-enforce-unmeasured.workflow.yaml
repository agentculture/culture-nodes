# Task t17 (issue #37): an enforce policy on a check the runner did not
# measure. The node pre-announces `workspace_diff complete: true` under
# route_technical, but the runner's Result honestly reports the changed-paths
# observation unmeasured — so the check stays UNEVALUATED, no verdict is
# fabricated to enforce on, and routing proceeds as if observe: the exit-0
# `passed` edge is followed and the derived record says why enforcement did
# not apply. This is the honest floor: an unevaluated check is enforced by
# nobody.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: worker-code-enforce-unmeasured
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: test

  contract:
    input:
      schema:
        type: object
    output:
      schema:
        type: object

  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 3
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    test:
      kind: code
      ownerRef: team/developer-experience
      uses: runner://headspace/docker@sha256:5555555555555555555555555555555555555555555555555555555555555555
      operation:
        image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        argv: [python3, -c, "raise SystemExit(0)"]
        network: none
        allowedOutputPaths: []
      contract:
        outcomes:
          passed:
            schema:
              type: object
          failed:
            schema:
              type: object
      ledger:
        observe: [evidence]
      acceptance:
        enforce: route_technical
        requires:
          - kind: workspace_diff
            complete: true
      policy:
        timeout: 5m
        retry:
          maxAttempts: 1

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/test/output

    giveup:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/test/output

  edges:
    - from: test.passed
      to: finish
    - from: test.failed
      to: giveup
