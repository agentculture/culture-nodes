# Culture Nodes — production profile, machine "orin" (plan t19).
#
# orin runs ONLY a worker (plus the host-process runner service, see
# nodes-runner.service): it joins thor's authoritative Postgres over the
# LAN as the second production worker — two machines, one DB, imitating
# the k8s multi-pod topology (spec assumption c7). No local Postgres, no
# MinIO, no API: the control plane lives on thor.
#
# Secrets from ~/.culture-nodes/prod.env via install-secrets.sh, and
# NODES_NAMESPACE_ID is written by deploy.sh once thor's API has minted it.

services:
  worker:
    image: culture-nodes:prod
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        # What this image is being built from (task t32, issue #104). The
        # build context carries no .git, so the Dockerfile cannot discover
        # it; deploy.sh exports NODES_BUILD_REVISION as the resolved commit
        # it shipped, and the binary serves it on GET /v1alpha1/version.
        REVISION: ${NODES_BUILD_REVISION:-}
    command: ["worker"]
    environment:
      NODES_DATABASE_URL: ${NODES_DATABASE_URL:?set the external PostgreSQL URL in prod.env}
      NODES_NAMESPACE_ID: ${NODES_NAMESPACE_ID:?deploy.sh writes this after thor's first boot}
      NODES_WORKER_ID: orin-worker-1
      NODES_CALLBACK_BASE_URL: ${NODES_CALLBACK_BASE_URL:-http://thor:18080}
      NODES_CALLBACK_TOKEN_SECRET: ${NODES_CALLBACK_TOKEN_SECRET:?install secrets first}
      NODES_ARTIFACT_S3_ENDPOINT: ${THOR_HOST:-thor}:9000
      NODES_ARTIFACT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-nodesroot}
      NODES_ARTIFACT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      NODES_ARTIFACT_S3_BUCKET: ${NODES_ARTIFACT_S3_BUCKET:-nodes-artifacts}
      NODES_ARTIFACT_S3_USE_TLS: "false"
      # All THREE come from prod.env, and the empty default is load-bearing.
      # cmd/nodes/worker.go refuses a PARTIAL tuple: setting one and leaving
      # the others empty is a misattribution risk, while setting none says
      # something legitimate — this deployment runs no code nodes. Hardcoding
      # the name here made that second state unreachable, so orin's worker
      # CrashLoopBackOff'd the moment it was brought to a revision carrying
      # the check, having run 46 hours without the tuple. install-secrets.sh
      # delivers the name only to a host that already has the other two.
      NODES_CODE_RUNNER_NAME: ${NODES_CODE_RUNNER_NAME:-}
      NODES_CODE_RUNNER_REVISION: ${NODES_CODE_RUNNER_REVISION:-}
      NODES_CODE_RUNNER_ACTOR_ID: ${NODES_CODE_RUNNER_ACTOR_ID:-}
      # Bearer for external actor endpoints whose rows name this env var
      # (metadata.auth_token_env) — the credential never enters the DB.
      NODES_ACTOR_CLAUDE_TOKEN: ${NODES_ACTOR_CLAUDE_TOKEN:-}
      NODES_ACTOR_CODEX_THOR_TOKEN: ${NODES_ACTOR_CODEX_THOR_TOKEN:-}
      NODES_ACTOR_CODEX_ORIN_TOKEN: ${NODES_ACTOR_CODEX_ORIN_TOKEN:-}
      NODES_RUNNER_SERVICES_FILE: ${NODES_RUNNER_SERVICES_FILE:-}
      # Task t13 / issue #5. orin runs no collector of its own: it points
      # at thor's, over the same LAN its Postgres connection already
      # crosses (set OTEL_EXPORTER_OTLP_ENDPOINT=http://thor:4317 in
      # prod.env, which the extra_hosts entry below already resolves).
      # Empty by default — unset means internal/telemetry.New returns
      # NoOp() and this worker exports nothing, exactly as before.
      #
      # This worker is the reason the variable belongs here at all: a trace
      # taken while both machines work one Postgres is missing half its
      # worker.dispatch spans if only thor exports.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ~/.culture-nodes/runners:/etc/nodes-runners:ro
    extra_hosts:
      # Containers do not inherit the host's /etc/hosts; deploy.sh resolves
      # thor's address from orin (getent hosts thor) and writes THOR_IP.
      - "thor:${THOR_IP:?deploy.sh resolves and writes this}"
    restart: unless-stopped
