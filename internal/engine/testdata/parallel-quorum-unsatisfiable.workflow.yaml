# An UNSATISFIABLE quorum (parallel-tokens design §4.3): the join declares a
# quorum of 3, which the compiler accepts — it can only check quorum >= 1
# statically, because cardinality is discovered at runtime — but the guarded
# `slow` edge trims the fan-out to 2 when the run input does not ask for it.
# A barrier that can never fire must resolve LOUDLY: the engine fails the run
# with a diagnostic naming the shortfall rather than parking forever. The
# static analysis that would refuse this at publish time is open item O2.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: engine-parallel-quorum-unsatisfiable
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: fan

  contract:
    input:
      schema:
        type: object
        properties:
          slow:
            type: boolean
    output:
      schema:
        type: object

  limits:
    maxDuration: 1h
    maxTransitions: 32
    maxVisitsPerNode: 8
    maxParallelTokens: 4

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    fan:
      kind: parallel
      ownerRef: team/platform-ai

    lint:
      kind: agent
      ownerRef: team/quality-platform
      uses: actor://company/linter@sha256:111111
      input:
        from: /run/input
      contract:
        outcomes:
          clean:
            schema:
              type: object

    test:
      kind: agent
      ownerRef: team/quality-platform
      uses: actor://company/tester@sha256:222222
      input:
        from: /run/input
      contract:
        outcomes:
          passed:
            schema:
              type: object

    slow:
      kind: agent
      ownerRef: team/quality-platform
      uses: actor://company/slowpoke@sha256:333333
      input:
        from: /run/input
      contract:
        outcomes:
          done:
            schema:
              type: object

    gather:
      kind: join
      ownerRef: team/platform-ai
      join:
        policy: quorum
        quorum: 3

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/gather/output

  edges:
    - from: fan.split
      to: lint

    - from: fan.split
      to: slow
      when: has(input.slow) && input.slow

    - from: fan.split
      to: test

    - from: lint.clean
      to: gather

    - from: test.passed
      to: gather

    - from: slow.done
      to: gather

    - from: gather.joined
      to: finish
