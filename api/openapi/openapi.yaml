openapi: 3.1.0

info:
  title: nodes.culture.dev/v1alpha1
  version: 0.1.0
  summary: Culture Nodes control-plane API
  description: >-
    The Culture Nodes control-plane API (docs/initial-design/culture-nodes-prd-spec.md
    §12.1, §15.1): workflow publication, run orchestration, the append-only work
    ledger, and review transactions. group: nodes.culture.dev/v1alpha1.

    Phase 1 runs authless by design (spec decision c45): this API carries no
    authentication or authorization of its own and is meant to run behind a
    private network. Every operation is reachable by anyone who can reach the
    listener. Do not expose this API on a public network without a fronting
    proxy that adds authentication.

    Every error response, on every operation, uses the Error schema below —
    the same {code, message, remediation} shape internal/clifmt.CliError
    renders for the CLI — with the HTTP status line carrying the specific
    condition.
  license:
    name: Apache-2.0

servers:
  - url: /
    description: The API is served relative to whatever host and port `nodes serve` binds.

tags:
  - name: workflows
    description: Compile, publish, and read immutable workflow versions (PRD §11).
  - name: runs
    description: Create and inspect workflow runs — the Run-view payload (PRD §8.6, §8.7).
  - name: node-runs
    description: >-
      Cross-run node run listings — the "jobs timeline" (self-hosted
      phase-2 cycle, task t11), distinct from the tokens/node_runs nested
      under one run's Run-view payload above.
  - name: events
    description: >-
      Server-Sent Events streams of committed run events (PRD §15.1): one
      per-run, one cross-run (task t17) fan-in feeding the live-mesh view.
  - name: ledger
    description: The append-only work ledger and its projections (PRD §10).
  - name: reviews
    description: Human review transactions over ledger records (PRD §10.8).
  - name: grades
    description: >-
      Opinion records — a 1-5 rating plus rationale — evaluating a completed
      run/attempt against an actor (issue #28 item 1; PRD §10.4 extended).
      Follows the same producer/authority matrix every other ledger record
      does; never observed or derived, and never self-graded.
  - name: human-tasks
    description: >-
      The paused-on-a-human side of an approval node (PRD §9.9): list and
      inspect human_tasks rows, and commit the decision that resumes the run.
      Unlike every other operation in this API, the decision endpoint is not
      authless — see its own description.
  - name: actors
    description: >-
      Registered actor identities and their aggregate stats (task t15).
      Read-only — registering an actor stays
      deploy/prod/register-actor.sh (issue #8).
  - name: artifacts
    description: >-
      Attempt-authenticated publication of opaque artifact bytes. This
      surface intentionally exposes no read or delete operation.
  - name: preflights
    description: >-
      The clarify-then-commit gate (task t14, issue #67): the briefing an
      actor is handed before its first billable turn, and the second,
      separate action that commits the dispatch. Per-actor and default-off —
      an actor whose registration enables no gate is never briefed and never
      waits.
  - name: plan-imports
    description: >-
      Import an external plan (task t22, issue #45): the generic
      decompose-pipeline surface — devague's `plan show --json` and
      `.devague/deliveries/*.json` are instance one, a non-code document
      (task t24) is instance two. Carries real per-task status and
      dependency edges (never a wave approximation) and every deviation's
      origin (the issue's "system knows" llm vs "user reports" user split).
      Durable, but deliberately not the work ledger — see
      migrations/0024_plan_imports.sql.
  - name: operations
    description: Liveness and readiness probes.

paths:
  /v1alpha1/namespaces:
    get:
      operationId: listNamespaces
      summary: List namespaces available to workers in this installation.
      responses:
        '200':
          description: Namespace rows ordered by creation time.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Namespace'
  /v1alpha1/workflow-generations:
    post:
      operationId: createWorkflowGeneration
      tags: [workflows]
      summary: Dispatch a registered fleet agent to propose workflow source.
      description: >-
        Creates a normal bounded workflow run whose generation node is an
        agent and whose next node is human approval. This operation never
        publishes. The initial authority status is always proposed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowGeneration'
      responses:
        '202':
          description: The fleet generation run was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowGeneration'
        '400':
          description: The description or actor reference is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The pinned base workflow does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/workflow-generations/{id}:
    get:
      operationId: getWorkflowGeneration
      tags: [workflows]
      summary: Read a generated proposal, compiler diagnostics, and edit diff.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current generation state. Exhaustion is a domain status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowGeneration'
        '404':
          description: No such generation run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/workflows/validate:
    post:
      operationId: validateWorkflow
      tags: [workflows]
      summary: Compile a workflow definition and report diagnostics.
      description: >-
        Runs the PRD §11.4 validation levels over the submitted source and
        returns every diagnostic. This never persists anything — a document
        with error diagnostics is a documented domain outcome (`valid: false`
        with an empty digest), not an HTTP error, matching the `nodes
        validate` CLI verb (PRD §3.4: a domain outcome is not a technical
        failure).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowSource'
      responses:
        '200':
          description: The document was compiled. `valid` reports whether it has any error diagnostic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowValidation'
        '400':
          description: The request itself is malformed (missing source, unknown format).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/workflows:
    post:
      operationId: publishWorkflow
      tags: [workflows]
      summary: Publish a workflow definition as an immutable version.
      description: >-
        Compiles the submitted source and, if it compiles cleanly, stores it
        as an immutable workflow version addressed by its content digest
        (PRD §11.3). Publishing the same content twice is idempotent: the
        existing version is returned with `200 OK` rather than a conflict,
        because a digest is a statement about content, not about who asked
        first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowSource'
      responses:
        '200':
          description: This content digest was already published; the existing version is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersion'
        '201':
          description: A new immutable workflow version was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersion'
        '400':
          description: The request is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            The document does not compile. Call
            `POST /v1alpha1/workflows/validate` first for the full diagnostic
            list; this response's `message` summarizes the error count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: List published workflow versions.
      parameters:
        - name: workflow_key
          in: query
          description: Filter to versions of one workflow key.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: A page of workflow versions, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionList'

  /v1alpha1/workflows/{digest}:
    get:
      operationId: getWorkflow
      tags: [workflows]
      summary: Fetch one immutable workflow version by content digest.
      parameters:
        - $ref: '#/components/parameters/Digest'
      responses:
        '200':
          description: The workflow version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersion'
        '404':
          description: No workflow version has this digest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/adhoc-runs:
    post:
      operationId: createAdhocRun
      tags: [runs]
      summary: Create a first-class ad-hoc run from a bare instruction.
      security:
        - adhocRunBearerAuth: []
      description: >-
        Renders the canonical one-node workflow (a single agent `task` node
        into a `finish` end node — the nodes-operator skill's assign
        template shape), publishes it through the same idempotent
        by-digest path as POST /v1alpha1/workflows (an identical render
        always resolves to the same immutable version), and creates a
        normal run pinned to that digest, all in one call (task t19,
        issue #36). The instruction, repo, sandbox, and success outcome
        ride as run input, so the run is indistinguishable from one
        created against a hand-published digest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdhocRunRequest'
      responses:
        '201':
          description: The run was created and is now running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          description: A required field is missing or a field is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The rendered canonical workflow does not compile (a server-side template fault).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/runs:
    post:
      operationId: createRun
      tags: [runs]
      summary: Create a run of a published workflow.
      description: >-
        Pins the run to the given workflow digest's immutable normalized IR
        (PRD §20.1) and creates the entry token and node run in one
        transaction (PRD §12.5). The run is claimable the moment this
        returns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '201':
          description: The run was created and is now running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          description: The input does not satisfy the workflow's input contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No workflow version has the given digest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listRuns
      tags: [runs]
      summary: List runs, optionally filtered by state and/or an updated_at window.
      description: >-
        Newest first by `sort` (task t11). `updated_since`/`updated_until`
        filter on `updated_at`, using `runs_namespace_updated_at_idx`
        (migrations/0010) when `sort` is (or defaults to) `updated_at`.
      parameters:
        - name: state
          in: query
          description: Filter to runs currently in this state.
          schema:
            $ref: '#/components/schemas/RunState'
        - name: updated_since
          in: query
          description: >-
            Only runs updated at or after this instant (RFC3339). When set
            and `sort` is omitted, `sort` defaults to `updated_at` rather
            than the endpoint's own default of `created_at`.
          schema:
            type: string
            format: date-time
        - name: updated_until
          in: query
          description: >-
            Only runs updated at or before this instant (RFC3339). When set
            and `sort` is omitted, `sort` defaults to `updated_at` rather
            than the endpoint's own default of `created_at`.
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          description: >-
            Sort column: `created_at` (the endpoint's own default) or
            `updated_at`. Always descending — newest first, like every list
            in this API. Defaults to `updated_at` instead when either
            `updated_since` or `updated_until` is set and `sort` itself is
            omitted.
          schema:
            type: string
            enum: [created_at, updated_at]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: A page of runs, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '400':
          description: state, updated_since, updated_until, or sort is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/node-runs:
    get:
      operationId: listNodeRuns
      tags: [node-runs]
      summary: List node runs across every run, newest first by updated_at.
      description: >-
        The cross-run "jobs timeline" listing (task t11): every node run in
        this namespace, not scoped to one run — unlike the `node_runs`
        nested in GET /v1alpha1/runs/{id}'s Run-view payload — newest-first
        by `updated_at`, using `node_runs_namespace_updated_at_idx`
        (migrations/0010) for the namespace scope, the
        `updated_since`/`updated_until` range, and the sort in one index
        walk.


        Pagination is a keyset cursor (`cursor`/`next_cursor`), not OFFSET:
        `updated_at` changes on every node run's state transition — including
        rows outside the caller's current page — so an OFFSET-based page
        would silently skip or repeat rows as items elsewhere in the
        namespace move past the offset boundary between two requests. A
        cursor anchored to `(updated_at, id)` of the last row already served
        has no such failure mode and reuses the same index walk a first page
        already does. Pass `next_cursor` from a response back as `cursor` to
        fetch the next page; its absence means there is no further page.
      parameters:
        - name: updated_since
          in: query
          description: Only node runs updated at or after this instant (RFC3339).
          schema:
            type: string
            format: date-time
        - name: updated_until
          in: query
          description: Only node runs updated at or before this instant (RFC3339).
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: >-
            Opaque keyset cursor from a previous response's `next_cursor`.
            Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: A page of node runs, newest first by updated_at.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRunList'
        '400':
          description: updated_since, updated_until, or cursor is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/attempts/{attemptID}/artifacts:
    post:
      operationId: putAttemptArtifact
      tags: [artifacts]
      summary: Publish opaque artifact bytes for one pending attempt.
      description: >-
        Requires the callback bearer token issued for exactly the attempt
        named in the path. Namespace, run, and attempt associations are
        derived from that attempt's durable PendingInvocation; the body is
        opaque content and cannot supply authority-bearing fields. Returns
        an artifact:// ref and metadata measured by the artifact store.

        No GET or DELETE operation is mounted. Possession of an artifact://
        ref is not authorization, and filesystem paths are never resolved.
      security:
        - attemptCallbackBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AttemptID'
        - name: Artifact-Name
          in: header
          required: true
          description: A descriptive, non-authoritative artifact name.
          schema:
            type: string
      requestBody:
        required: true
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: The artifact was stored and associated with the durable invocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactWriteResult'
        '400':
          description: Content-Type or Artifact-Name is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The token is missing, expired, invalid, or belongs to a different attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No durable pending invocation has the path's attempt id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: >-
            The body exceeds the publication limit (api.MaxArtifactBytes,
            64 MiB). Authentication is not a size limit: publish large output
            to object storage and record a reference, or split it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/actors:
    get:
      operationId: listActors
      tags: [actors]
      summary: List every registered actor row in this namespace.
      description: >-
        Read-only (task t15): every `actors` table row, every revision — an
        actor_key's identity is append-only, so a capability or endpoint
        change is a new row, never an update to an existing one. Registering
        an actor is the authenticated POST on this same path (task t13).
      responses:
        '200':
          description: Every registered actor row, ordered by actor_key then revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorList'
    post:
      operationId: registerActor
      tags: [actors]
      summary: Register an actor — append the next revision row for actor_key.
      description: >-
        Task t13: the authenticated registration lane that replaces the
        raw-SQL-only deploy/prod/register-actor.sh path (issue #8).
        Registration is append-only, following that script's INSERT
        semantics: a first registration of an actor_key lands revision 1,
        and re-registering an existing actor_key inserts the next revision
        row — never an update to any existing row (actor identity, like
        ledger records, only ever appends).

        Like the human-task decision endpoint — and unlike the rest of this
        authless-by-phase-1-design API (spec decision c45) — this operation
        requires a bearer token (`Authorization: Bearer <token>`) matching
        the server's configured registration secret
        (`NODES_ACTOR_REGISTRATION_TOKEN_SECRET`, deliberately its own
        secret, not the decision secret): a registration row is what grants
        an endpoint the standing to be dispatched real work. An
        unauthenticated or wrongly authenticated request is refused with 401
        before the body is even read.
      security:
        - actorRegistrationBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterActorRequest'
      responses:
        '201':
          description: The newly appended actor revision row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '400':
          description: The request is malformed, a required field is missing, or `namespace` names a namespace other than this server's own.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No bearer token was presented, it does not match the configured registration secret, or no secret is configured at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/actors/{id}:
    get:
      operationId: getActor
      tags: [actors]
      summary: Fetch one actor row by id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The actor row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '404':
          description: No actor with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/actors/{id}/resume:
    post:
      operationId: resumeActor
      tags: [actors]
      summary: Clear a capacity pause early, making the actor dispatchable again.
      description: >-
        Task t9: the reversibility half of the capacity circuit breaker.
        When a dispatch to an actor fails with the `capacity_exhausted`
        §13.5 class, the worker marks that actor unavailable until a
        deadline and defers — never fails — work addressed to it. This
        operation ends that pause early, so an operator who knows better
        (the quota reset, the bridge was misreporting, the limit did not
        apply to this project) can overrule the automatic classification
        without touching the database.

        The pause is keyed by `actor_key`, not by this row's id, so
        resuming any revision of an identity resumes the identity —
        provider capacity belongs to the identity, not to one append-only
        registration revision.

        Clearing an actor that is not currently paused is 200 with the
        actor's current state, not an error: the caller's intent ("this
        actor should be dispatchable") is already satisfied, and two
        operators racing to clear one pause should both succeed.

        Work items already deferred become claimable again within the
        worker's deferral horizon (at most a few minutes), not
        instantaneously: a deferral pushes `work_items.available_at`
        forward, and the horizon is bounded precisely so an early clear
        cannot go unnoticed for the whole pause.

        Like actor registration on this same noun — and unlike the rest of
        this authless-by-phase-1-design API (spec decision c45) — it
        requires the actor-registration bearer token, deliberately the SAME
        secret (`NODES_ACTOR_REGISTRATION_TOKEN_SECRET`): registration is
        what grants an endpoint the standing to be dispatched real work,
        and clearing a pause restores exactly that standing.
      security:
        - actorRegistrationBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeActorRequest'
      responses:
        '200':
          description: The actor row, with its availability block reflecting the cleared pause.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '401':
          description: No bearer token was presented, it does not match the configured registration secret, or no secret is configured at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No actor with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/actors/{id}/stats:
    get:
      operationId: getActorStats
      tags: [actors]
      summary: Per-actor aggregate stats, sliced by run category.
      description: >-
        Task t15's aggregate: node-run participation by (status, outcome),
        ledger records this actor originated by authority, attempts-per-
        completion ("retry burn"), attempt duration percentiles (p50/p90/
        p99, seconds), §13.2 usage/cost (task t2's rollup, never summed
        across differing currencies), and grade.schema.json aggregates
        (task t14) evaluating this actor, with proposed and confirmed
        grades reported as separate counts/means, never blended. Every
        number is sliced by `runs.category` (task t3), with `""` as the
        explicit uncategorized bucket, plus `total` — computed as its own
        query scope, not summed client-side from `categories`, since a
        percentile is not additive across subgroups. Where a scope has no
        data, the payload says so structurally (an absent list, a null
        `duration_percentiles`, a null `attempts_per_completion`, a null
        `mean_rating`) — never a fabricated zero standing in for a
        measurement that was never taken.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The actor's aggregate stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorStats'
        '404':
          description: No actor with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/schedules:
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Declare a cadence that emits an event with no human action.
      description: >-
        Task t33 (issue #107): a schedule is an emitter with a clock. On
        each declared occurrence it appends its declared payload to
        `signal_events` as a fact, and every published workflow whose
        `spec.triggers` matches that fact creates a run — the same path a
        POST /v1alpha1/events delivery takes, so there is exactly one route
        from "something happened" to "a run exists".


        A schedule is deployment configuration, not part of a workflow: a
        workflow version is immutable and content-addressed, so a cadence
        declared inside one could not be disabled without republishing
        (which would change what the graph IS in order to change how often
        it runs). It also discovers nothing and holds no credential — what
        it emits is what an operator wrote down.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201':
          description: The declared schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          description: A declaration this control plane could not honour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A schedule with that name already exists in this namespace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: Every declared schedule, enabled or not.
      description: >-
        Disabled schedules are included deliberately: a schedule that is
        not running is precisely what an operator asking "why has nothing
        happened since Tuesday" is looking for.
      responses:
        '200':
          description: The namespace's schedules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleList'

  /v1alpha1/schedules/{id}:
    get:
      operationId: getSchedule
      tags: [schedules]
      summary: One schedule, with its cursor and history.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '404':
          description: No such schedule in this namespace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: patchSchedule
      tags: [schedules]
      summary: Enable or disable a schedule.
      description: >-
        `enabled` is the only patchable field. Changing the cadence or the
        payload of a live schedule would leave already-fired runs pointing
        at a declaration that no longer exists anywhere, so those are a
        delete and a create.


        Disabling does NOT move `next_fire_at`. A schedule disabled at
        09:00 and re-enabled at 17:00 is overdue on re-enable, and its
        declared `catch_up` policy decides whether that overdue occurrence
        fires — the same question, with the same answer, as a control plane
        that was down for those eight hours.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchScheduleRequest'
      responses:
        '200':
          description: The updated schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          description: No patchable field was supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such schedule in this namespace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Remove a schedule.
      description: >-
        The `signal_events` facts it appended and the runs those started
        are untouched: they are history, and history does not stop being
        true because the thing that produced it was retired.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Deleted.
        '404':
          description: No such schedule in this namespace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/dispatch-rates:
    get:
      operationId: listDispatchRates
      tags: [actors]
      summary: The declared dispatch rates and what each has consumed.
      description: >-
        Task t10 (issue #48 item 2): the pacing control's read surface. A
        worker holds itself to a declared session rate — globally and per
        actor — against durable state every worker shares (migration 0022's
        `dispatch_rate_state`), because workers scale horizontally and an
        in-process limiter would enforce one rate per process rather than
        one rate.


        This endpoint answers "why is this run sitting still" from the
        operator's side: the rate being enforced, how much of the CURRENT
        session window it has consumed, how much the rest of that window can
        still absorb, and when the next dispatch may go. Per deferral, the
        run's own event stream answers it too
        (`dev.culture.nodes.dispatch.paced`).


        A scope with no recorded state is absent rather than rendered as a
        zeroed row: this surface reports what the workers have actually
        enforced, not what an environment somewhere claims to have
        configured. Read-only by design — a rate is the operator's own
        declaration, and it is changed by changing the workers'
        configuration (`NODES_DISPATCH_RATE_*`), not by an API that would
        then disagree with it.
      responses:
        '200':
          description: Every rate scope with recorded state in this namespace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchRateList'

  /v1alpha1/preflights:
    get:
      operationId: listPreflights
      tags: [preflights]
      summary: Dispatch preflights waiting to be acknowledged.
      description: >-
        Task t14 (issue #67): the clarify-then-commit gate's read surface. An
        actor whose registration enables the gate
        (`metadata.preflight_gate`) is briefed BEFORE its first billable
        turn: the worker composes the operating facts its task depends on —
        the host capabilities that actor's own bridge advertised, plus the
        task declaration — appends them as a `derived` ledger record, and
        defers the dispatch until the briefing is acknowledged.


        This endpoint answers "is anything waiting on me". The issue also
        goes onto the run's event stream
        (`dev.culture.nodes.dispatch.preflight_issued`), but a bridge that
        was not watching at that instant would otherwise never learn, so the
        pending set is queryable. Only PENDING preflights are listed —
        unconsumed, unanswered and unexpired; one preflight's own history
        stays readable at its detail route.
      parameters:
        - name: actor_key
          in: query
          required: false
          schema:
            type: string
          description: Narrow to one actor identity (e.g. `company/codex-thor`).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: The preflights waiting on an acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightList'

  /v1alpha1/preflights/{id}:
    get:
      operationId: getPreflight
      tags: [preflights]
      summary: One dispatch preflight, with the briefing it hands over.
      description: >-
        The row plus `document` — the briefing itself, read back from its
        `dispatch_preflight` ledger record. An actor cannot acknowledge what
        it cannot read, so the document is always part of the detail
        response: the host capabilities as its bridge advertised them, the
        task declaration, the expected terminal shape, and the refusal
        stating what does not proceed until it is acknowledged.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The preflight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preflight'
        '404':
          description: No preflight with that id in this namespace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/preflights/{id}/acknowledge:
    post:
      operationId: acknowledgePreflight
      tags: [preflights]
      summary: Acknowledge a briefing, committing the gated dispatch.
      description: >-
        The second, separate action of clarify-then-commit. It appends the
        acknowledging actor's `proposed` `dispatch_acknowledgement` record —
        naming the briefing by id AND by content digest — and marks the row,
        after which exactly ONE dispatch may ride it.


        The properties are the ones
        `deploy/prod/install-secrets.sh`'s destructive-confirmation protocol
        established and this generalizes from danger to understanding: it is
        SINGLE-USE (the next dispatch of that node needs its own briefing)
        and WINDOWED (an acknowledgement made too long ago authorizes
        nothing). Both refusals are 409s naming the state.


        What it writes is a CLAIM, not evidence: an actor saying it
        understood is a completion-claim-shaped statement, and nothing on
        this path promotes it (PRD §10.4). `actor_id` names the actor the
        acknowledgement is recorded FOR; the record's `origin` names the
        producer that wrote it, so an operator acknowledging on a bridge's
        behalf stays distinguishable afterwards.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgePreflightRequest'
      responses:
        '200':
          description: The acknowledged preflight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preflight'
        '400':
          description: actor_id is missing, or the verdict is not an acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such preflight, or no such actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            The briefing was already answered, already spent, or its window
            has closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/plan-imports:
    post:
      operationId: importPlan
      tags: [plan-imports]
      summary: Import an external plan's faithful view, with its deviations.
      description: >-
        Task t22 (issue #45): decodes `plan_show` (the exact object
        `devague plan show --json` prints — or an equivalent document from a
        different source system, since this surface is domain-agnostic) and
        the optional `deviations` (the exact object
        `.devague/deliveries/<slug>.json` holds on disk), and persists a new
        immutable snapshot: the plan plus every task's REAL per-task status
        and dependency edges, plus every deviation carrying its origin.


        Nothing here is the append-only work ledger (`internal/ledger`) —
        see `migrations/0024_plan_imports.sql` for why. Every import is its
        own row; re-importing the same `plan_show.slug` creates a new,
        independent snapshot rather than overwriting the previous one.


        A malformed `plan_show` or `deviations` document — a missing slug, a
        task with no id, a dependency edge naming a task this plan does not
        have, a dependency cycle, an unrecognised origin/status, a
        `deviations.plan_slug` that does not match `plan_show.slug` — is
        refused with 400 in the documented Error shape, naming what is
        wrong; nothing is ever partially imported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanImportRequest'
      responses:
        '201':
          description: The imported plan snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanImport'
        '400':
          description: plan_show or deviations is missing or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listPlanImports
      tags: [plan-imports]
      summary: List a plan's import snapshots by slug, most recent first.
      description: >-
        Task t23 (issue #45): every `plan_imports` row for the given `slug`,
        newest `imported_at` first — how a dashboard finds "the current
        state" of a plan (`items[0]`) without this endpoint guessing at a
        supersedes relationship the schema deliberately does not model (see
        `migrations/0024_plan_imports.sql`). `slug` is required; unlike
        `GET /v1alpha1/workflows`, there is no cross-slug "every imported
        plan" listing. Each item is the lightweight summary shape (no
        `tasks`/`deviations` — those are read one snapshot at a time via
        `GET /v1alpha1/plan-imports/{id}`, since an empty array here would
        misread as "zero tasks" rather than "not fetched on this path").
      parameters:
        - name: slug
          in: query
          required: true
          description: The source plan's own slug (devague's `plan_show.slug`).
          schema:
            type: string
      responses:
        '200':
          description: Every import snapshot with this slug, most recent first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanImportSummaryList'
        '400':
          description: slug is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/plan-imports/{id}:
    get:
      operationId: getPlanImport
      tags: [plan-imports]
      summary: Fetch one imported plan snapshot, with its tasks and deviations.
      parameters:
        - $ref: '#/components/parameters/PlanImportID'
      responses:
        '200':
          description: The imported plan snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanImport'
        '404':
          description: No plan import with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Fetch the Run-view payload — run, tokens, node runs, and attempts.
      description: >-
        The data behind the PRD §8.6 Run view and §8.7 first visual slice's
        node-detail panel: everything needed to render a run's current graph
        position and history without a second round trip per node.
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: The run view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunView'
        '404':
          description: No run has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: patchRun
      tags: [runs]
      summary: Retag a run's category. name/description are immutable.
      description: >-
        The only field this accepts is `category` (frame decision q4):
        `name` and `description` are set once, at creation (POST
        /v1alpha1/runs), and cannot be changed afterward — a request body
        carrying either key is refused with a structured 400 rather than
        silently ignored.
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRunRequest'
      responses:
        '200':
          description: The run, with its category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          description: >-
            The request body carried `name` or `description`, omitted
            `category`, or `category` was not a string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No run has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/runs/{id}/cancel:
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Cancel a run.
      description: >-
        Consumes every active token, marks every non-terminal node run and
        ready work item cancelled, and moves the run to `cancelled` — under
        the same per-run advisory lock the engine's own completion
        transaction takes (PRD §12.5), so a cancel cannot interleave with a
        concurrent attempt completion. A node run a worker already holds a
        lease on finishes that lease's fenced completion path (it will find
        the node run terminal and no-op); cancellation does not reach into
        an in-flight attempt.
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: The run is now cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          description: No run has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The run has already reached a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/runs/{id}/events:
    get:
      operationId: streamRunEvents
      tags: [events]
      summary: Server-Sent Events stream of a run's committed events.
      description: >-
        Streams only committed events (PRD §15.1 CloudEvents-compatible
        envelopes), polling the events table every 500ms for rows newer than
        the resume point. Resume by per-run sequence: send `Last-Event-ID`
        (a previously received `id:` field) to resume after a disconnect, or
        the `from` query parameter for a client that cannot set headers
        before its first connection. Each frame is
        `id: <sequence>\nevent: <type>\ndata: <envelope JSON>\n\n`. The
        stream ends (the connection closes normally) once a terminal run
        event (`run.completed`, `run.failed`, `run.cancelled`, or
        `run.bounded`) has been sent, since no further event will ever be
        appended for this run.
      parameters:
        - $ref: '#/components/parameters/RunID'
        - name: Last-Event-ID
          in: header
          description: Resume after this per-run sequence number.
          schema:
            type: string
        - name: from
          in: query
          description: Resume after this per-run sequence number, when a Last-Event-ID header cannot be set.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A `text/event-stream` of committed events.
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          description: No run has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Server-Sent Events stream of committed events across runs.
      description: >-
        The cross-run companion to GET /v1alpha1/runs/{id}/events (task
        t17): one SSE connection carrying committed events for every run in
        the namespace, instead of one connection per run — the data source
        for a live-mesh/board view that must not open one stream per
        displayed run.

        Scope: by default, only events belonging to an ACTIVE (non-terminal)
        run, plus run-lifecycle events (run.created, run.completed,
        run.failed, run.cancelled, run.bounded) for any run — so a
        consumer sees runs appear and finish without being handed a
        completed run's full internal history it never asked to watch. Pass
        `runs` to override this default entirely and receive only events for
        the listed run ids, active or not.

        Containment (risk r1): this handler polls at twice the per-run
        stream's interval, and each poll reads a bounded window of raw rows
        (ordered by the events table's own id) before applying the
        active-run/lifecycle filter — so one poll's cost never grows with
        how much of the namespace's history is currently terminal. See
        internal/api/events.go's handleStreamEvents for the full design
        note, including the documented catch-up behavior under a filtered
        backlog.

        Resume by the events table's own id (a ULID, NOT the per-run
        `sequence` a single run's stream resumes on — there is no one
        sequence spanning multiple runs): send `Last-Event-ID` (a
        previously received `id:` field) to resume after a disconnect, or
        the `from` query parameter for a client that cannot set headers
        before its first connection. Each frame is
        `id: <ulid>\nevent: <type>\ndata: <envelope JSON>\n\n`. Ordering
        promise: events are delivered in the order this control-plane
        process committed them (ULID generation order within one process,
        internal/store/ulid.go) — not a claim of a causally-ordered,
        cross-process global sequence.
      parameters:
        - name: runs
          in: query
          description: >-
            Comma-separated run ids. When present, overrides the default
            active-runs+lifecycle scope: the stream reports only events for
            exactly these run ids, active or not.
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          description: Resume after this event id (a ULID).
          schema:
            type: string
        - name: from
          in: query
          description: Resume after this event id (a ULID), when a Last-Event-ID header cannot be set.
          schema:
            type: string
      responses:
        '200':
          description: A `text/event-stream` of committed events across runs.
          content:
            text/event-stream:
              schema:
                type: string
    post:
      operationId: deliverEvent
      tags: [events]
      summary: Deliver a named signal event, resuming matching until.signal waits.
      description: >-
        The inbound half of the events surface (task t10, issue #39, spec
        decision c35): appends the event to the append-only signal_events
        fact table and, in the same transaction, resumes every node run
        whose pending until.signal subscription matches the name (and
        run_id, when the event is run-scoped). Resumed runs complete
        through their normal edges — delivery makes the parked work item
        claimable again and a worker commits the completion through the
        ordinary engine transaction; delivery itself never completes
        anything.

        An event with no waiting subscription is still appended — a fact,
        not an error; `resumed` is simply empty. A subscription created
        AFTER the event does not retroactively fire (documented limitation,
        issue #43): subscription-then-event resumes,
        event-then-subscription stays parked.

        Requires a bearer token matching the server's configured event
        secret (`NODES_EVENT_TOKEN_SECRET`) — its own secret, separate
        from the decision and registration secrets, since emitting a named
        event can resume any signal-parked run in the namespace.
      security:
        - eventBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverEventRequest'
      responses:
        '201':
          description: The event was appended (and any matching waits resumed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDeliveryResult'
        '400':
          description: The request is malformed or names no event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No bearer token was presented, it does not match the configured secret, or no secret is configured at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: run_id was set but no run has that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/runs/{id}/ledger:
    get:
      operationId: listLedgerRecords
      tags: [ledger]
      summary: List a run's ledger records.
      description: The PRD §8.6 Ledger view's raw feed — every record, live and superseded, in append order.
      parameters:
        - $ref: '#/components/parameters/RunID'
      responses:
        '200':
          description: The run's ledger records and current ledger version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerRecords'
        '404':
          description: No run has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/runs/{id}/ledger/projections/{name}:
    get:
      operationId: getLedgerProjection
      tags: [ledger]
      summary: Compute one of the PRD §10.9 standard projections over a run's ledger.
      parameters:
        - $ref: '#/components/parameters/RunID'
        - name: name
          in: path
          required: true
          description: >-
            One of: current_scope, confirmed_claims,
            open_assumptions_and_questions, ready_tasks, active_tasks,
            verification_queue, decision_history, evidence_for_subject,
            delivery_summary.
          schema:
            type: string
        - name: subject
          in: query
          description: Required by, and used only by, evidence_for_subject — the reference to project evidence for.
          schema:
            type: string
        - name: format
          in: query
          description: >-
            json (the default) or markdown. markdown renders the identical
            projection through the deterministic Markdown reflection PRD
            §10.9 describes — a second rendering of the same read, never a
            separately maintained copy, and never authoritative.
          schema:
            type: string
            enum: [json, markdown]
      responses:
        '200':
          description: The projection, self-describing digest included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projection'
            text/markdown:
              schema:
                type: string
        '400':
          description: name is not a recognized projection, or format is not json or markdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No run has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/runs/{id}/reviews:
    post:
      operationId: createReview
      tags: [reviews]
      summary: Create a review request over a batch of ledger records.
      description: >-
        Records the ledger version and content-digest frame checksum the
        reviewer is looking at (PRD §10.8), so a later commit against a
        ledger that has since moved is refused rather than silently applied.

        `reviewer_actor_id` is required: a review nobody is accountable for
        is not a review, and refusing it here — rather than two calls later
        at commit time — tells the caller which field is missing while they
        can still supply it. The named actor must be registered with kind
        `human`; commitReview resolves it against the registry and refuses
        anything else (PRD §10.4, rule `reviewer_must_be_human`), which is
        what stops an agent deciding its own claim by naming itself.

        Requires the decision bearer token
        (`NODES_HUMAN_DECISION_TOKEN_SECRET`).
      security:
        - decisionBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: The review request was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRequest'
        '400':
          description: The request is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No bearer token was presented, it does not match the configured secret, or no secret is configured at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No run has this id, or a named record does not belong to it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The request names a ledger version that is not the run's current one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/reviews/{id}/commit:
    post:
      operationId: commitReview
      tags: [reviews]
      summary: Commit a review's decisions.
      description: >-
        Applies confirm/reject decisions for every record the review named,
        all in one transaction, or none (PRD §10.8). Refused — with nothing
        written — when the caller's expected ledger version no longer
        matches: the ledger moved, a reviewed record was superseded, or the
        reviewed frame no longer checksums to what was requested.

        Each decision is appended as its own immutable `review` record:
        human origin naming the reviewer, `confirmed` or `rejected`
        authority, `subject_ref` naming the record decided, and the stated
        `rationale` in its payload. The reviewed records are NOT rewritten —
        a confirmed claim still reads `authority: proposed` forever, with the
        decision attached to it (see GET /v1alpha1/pending-decisions for
        "which claims are still undecided", which is that join, not an
        authority filter).

        `rationale` is required: a confirmation with no stated reason cannot
        be told apart from an unread one. A reviewer the registry does not
        record as a human is refused with 400 (PRD §10.4).

        Requires the decision bearer token
        (`NODES_HUMAN_DECISION_TOKEN_SECRET`).
      security:
        - decisionBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The review request id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitReviewRequest'
      responses:
        '200':
          description: The review was committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCommitResult'
        '400':
          description: >-
            The decision set does not exactly cover the records under
            review, no rationale was stated, or the reviewer is not a
            registered human.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No bearer token was presented, it does not match the configured secret, or no secret is configured at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No review request has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            The review is stale (the ledger moved, the expected version does
            not match, a target was superseded, or the frame checksum no
            longer matches) or was already committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/pending-decisions:
    get:
      operationId: listPendingDecisions
      tags: [reviews]
      summary: Every proposed ledger record still awaiting a human decision.
      description: >-
        Answers "what is awaiting my decision", per run and across runs,
        without a hand-maintained manifest of run ids.

        A record is pending when it carries `proposed` authority and no
        `review` record names it as its subject — whatever the verdict would
        have been, since a rejection answers the question as completely as a
        confirmation does. It is NOT simply `authority = proposed`: records
        are immutable, so committing a confirmation appends a review record
        rather than changing the claim, and a decided claim reads `proposed`
        forever. A record a later record supersedes is excluded too — the
        correction that replaced it is what should be decided now.

        Results are grouped by run and each group carries that run's current
        `ledger_version`, which is exactly what POST
        /v1alpha1/runs/{id}/reviews needs to open a review over them.

        An unrecognised query parameter is refused with 400 rather than
        ignored: a filter silently dropped answers a different question than
        the one asked while still looking authoritative.
      parameters:
        - name: run_id
          in: query
          required: false
          description: Only records belonging to this run.
          schema:
            type: string
        - name: record_type
          in: query
          required: false
          description: Only records of this ledger record type (e.g. `claim`).
          schema:
            type: string
        - name: actor_id
          in: query
          required: false
          description: Only records whose origin actor is this actor.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return (default 200, max 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: The pending records, grouped by run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingDecisionList'
        '400':
          description: An unrecognised query parameter was supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/runs/{id}/grades:
    post:
      operationId: createGrade
      tags: [grades]
      summary: Grade a run against an actor (a 1-5 rating plus rationale).
      description: >-
        Appends a grade ledger record (schemas/ledger/grade.schema.json,
        issue #28 item 1) evaluating `evaluated_actor_id`'s work on this run
        — optionally narrowed to one node run (`node_run_ref`) or attempt
        (`attempt_ref`). The grading actor named in `grading_actor_id` is
        looked up in the actor registry, and its registered `kind` decides
        both the record's origin and the authority it is written with: a
        human actor's grade is the human's own opinion, not a claim someone
        else must ratify, so it lands `confirmed` outside a review
        transaction; an agent actor's grade lands `proposed`, exactly like
        any other agent-origin record, and reaches `confirmed` only by later
        going through the ordinary review surface (POST
        /v1alpha1/runs/{id}/reviews + POST /v1alpha1/reviews/{id}/commit).
        No actor may grade its own work — a request where `grading_actor_id`
        equals `evaluated_actor_id` is refused (PRD §10.4's self-promotion
        rule, extended to opinion records). A malformed request, a rating
        outside 1-5, or the authority matrix's refusal all render as 400 in
        the documented Error shape, never a 500.
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGradeRequest'
      responses:
        '201':
          description: The grade was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerRecord'
        '400':
          description: >-
            The request is malformed, the grade payload fails
            schemas/ledger/grade.schema.json (e.g. rating outside 1-5, an
            empty rationale), or the ledger authority matrix refused it (e.g.
            a self-grade, or a grading actor kind with no supported grading
            origin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No run has this id, or grading_actor_id/evaluated_actor_id is not a registered actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/runs/{id}/suite-verdicts:
    post:
      operationId: createSuiteVerdict
      tags: [ledger]
      summary: Record what a test suite did to this run's handed-over commit.
      description: >-
        The merge gate's mechanical half (task t11, issue #101). A test suite
        is a DETERMINISTIC VALIDATOR — a commit plus a command produces a
        number — so PRD §10.4 admits its finding as a `derived` record, with
        the validator named in `validator_actor_id` as its origin. That is
        the whole point of the endpoint: an operator reading a green tick and
        deciding to merge leaves nothing behind that names the suite, the
        exit code, or the commit, and is not evidence of anything.


        Three refusals are load-bearing. `exit_code` is REQUIRED and is never
        defaulted, because an omitted exit code silently meaning 0 would turn
        every malformed request into a pass. `commit_sha` must be a full
        40-character lowercase hex commit id — not `HEAD`, not a branch name,
        not an abbreviation — because a verdict that does not name what it
        tested cannot be checked later. And when the control plane has
        already MEASURED this run's handover (an observed evidence record
        from a `git_ref_fetch`), a verdict naming a different commit is
        refused outright rather than recorded with a caveat.


        `validator_actor_id` must be a registered actor and must not be one
        registered as `human`: a person who ran a suite and reported the
        result is making a claim about it, which is the mirror of the
        reviewer-must-be-human rule the review surface enforces. The route is
        gated by the same bearer secret as the review surface — whoever can
        record a suite verdict can decide a merge.
      parameters:
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSuiteVerdictRequest'
      responses:
        '201':
          description: >-
            The verdict was recorded as a derived, validator-origin review
            record. Its `subject_ref` and `provenance_refs` name the run's
            handover evidence record when the control plane had measured one,
            and are empty when it had not.


            A REJECTING verdict is also ROUTED (task t32, issue #102): the
            control plane derives where the failure goes next — a bounded
            repair attempt on a lane whose advertised capability surface shows
            it can run the suite that failed, or a human — and appends that
            decision as a second derived record, returned as `routing`. The
            bound is stated in the record: two repair attempts per run, over a
            24-hour window measured from the run's first gate rejection, and a
            human node at either ceiling.


            The routing is a DECISION, not an execution: nothing is
            dispatched, and the record says so in its own payload. Unattended
            repair is deliberately not enabled — see the record's
            `dispatch_note`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuiteVerdictResult'
        '400':
          description: >-
            The request is malformed, `exit_code` is absent, `commit_sha` is
            not a full 40-hex commit id, `ref` is outside
            `refs/culture-nodes/`, the named validator is registered as a
            human, or the verdict names a commit other than the one this
            run's handover was measured at.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The decision bearer token is missing, malformed, or not valid for this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No run has this id, or validator_actor_id is not a registered actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/human-tasks:
    get:
      operationId: listHumanTasks
      tags: [human-tasks]
      summary: List human tasks, newest first.
      parameters:
        - name: status
          in: query
          description: Filter to "pending" or "decided". Omitted returns every status.
          schema:
            type: string
            enum: [pending, decided]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: The matching human tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanTaskList'

  /v1alpha1/human-tasks/{id}:
    get:
      operationId: getHumanTask
      tags: [human-tasks]
      summary: Get one human task.
      parameters:
        - $ref: '#/components/parameters/HumanTaskID'
      responses:
        '200':
          description: The human task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanTask'
        '404':
          description: No human task has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/human-tasks/{id}/decision:
    post:
      operationId: decideHumanTask
      tags: [human-tasks]
      summary: Commit a decision on a paused human task, resuming the run.
      description: >-
        Validates outcome against the task's own allowed_outcomes (PRD §9.9),
        records the decision as a human-authority review through the same
        atomic, ledger-version-guarded review transaction PRD §10.8's review
        commit uses, transitions the waiting_human node run, and routes the
        edge the outcome selects — all in one transaction, or none of it. A
        task decides exactly once: a second decision on an already-decided
        task is refused with 409 rather than resuming the run again.

        Unlike every other operation in this API — authless by phase-1
        design, spec decision c45 — this one requires a bearer token
        (`Authorization: Bearer <token>`) matching the server's configured
        decision secret (`NODES_HUMAN_DECISION_TOKEN_SECRET`): a decision
        here writes human authority into the run's ledger on whoever's
        behalf presents the token. An unauthenticated or wrongly
        authenticated request is refused with 401 before the body is even
        read.
      security:
        - decisionBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/HumanTaskID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideHumanTaskRequest'
      responses:
        '200':
          description: The decision was committed and the run resumed (or ended, if the routed edge reached an end node).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanTaskDecisionResult'
        '400':
          description: The request is malformed, or outcome is not one of the task's allowed_outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No bearer token was presented, it does not match the configured secret, or no secret is configured at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No human task has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The task is already decided, or expected_ledger_version no longer matches the run's current ledger version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1alpha1/version:
    get:
      operationId: version
      tags: [operations]
      summary: Which revision of the control plane is running.
      description: >-
        Task t32, issue #104. Before this, "what revision is deployed" was
        answered by probing feature routes one at a time and inferring from
        the status code — a `POST` at an artifact route answering `405`
        instead of `401` is how it was established that a whole merged batch
        was not running in production, fifteen hours after it merged.


        A live test can read this to ASSERT which code it tested rather than
        assume it, which is why the route is unauthenticated exactly as
        `healthz` and `readyz` are: a live test that had to hold a decision
        secret just to learn what it was testing is one nobody runs.


        `revision` is a full 40-character lowercase hex commit id or it is
        ABSENT. `HEAD`, a branch name and an abbreviation are all refused —
        each means something different tomorrow, and this value exists to be
        compared later. A build that was never stamped reports no revision and
        says so in `staleness` rather than returning an empty string a reader
        has to interpret.
      responses:
        '200':
          description: What this binary was built as.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'

  /v1alpha1/healthz:
    get:
      operationId: healthz
      tags: [operations]
      summary: Liveness probe.
      description: Always `200` once the process is serving requests. Does not touch the database.
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /v1alpha1/readyz:
    get:
      operationId: readyz
      tags: [operations]
      summary: Readiness probe — pings the database.
      responses:
        '200':
          description: The process is ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The database is not reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    RunID:
      name: id
      in: path
      required: true
      description: The run id.
      schema:
        type: string
    Digest:
      name: digest
      in: path
      required: true
      description: The workflow version's content digest.
      schema:
        type: string
    PlanImportID:
      name: id
      in: path
      required: true
      description: The plan import snapshot's id.
      schema:
        type: string
    HumanTaskID:
      name: id
      in: path
      required: true
      description: The human task id.
      schema:
        type: string
    AttemptID:
      name: attemptID
      in: path
      required: true
      description: The protocol attempt id signed into the callback token.
      schema:
        type: string

  securitySchemes:
    decisionBearerAuth:
      type: http
      scheme: bearer
      description: >-
        The shared secret configured as NODES_HUMAN_DECISION_TOKEN_SECRET.
        Used by the three operations that record a human decision — POST
        /v1alpha1/human-tasks/{id}/decision and the two review operations
        (POST /v1alpha1/runs/{id}/reviews, POST
        /v1alpha1/reviews/{id}/commit) — because all three write
        human-authority records into the ledger on whoever presents the
        token. Every other operation in this API is authless by phase-1
        design (spec decision c45).
    actorRegistrationBearerAuth:
      type: http
      scheme: bearer
      description: >-
        The shared secret configured as
        NODES_ACTOR_REGISTRATION_TOKEN_SECRET. Used only by POST
        /v1alpha1/actors (task t13) — deliberately its own secret, not the
        decision secret, so an operator can grant registration standing
        without also granting the power to decide human tasks.
    eventBearerAuth:
      type: http
      scheme: bearer
      description: >-
        The shared secret configured as NODES_EVENT_TOKEN_SECRET. Used only
        by POST /v1alpha1/events (task t10) — its own secret again, so an
        external system granted the standing to emit signal events (which
        can resume any signal-parked run) holds neither decision nor
        registration power.
    adhocRunBearerAuth:
      type: http
      scheme: bearer
      description: >-
        The shared secret configured as NODES_ADHOC_RUN_TOKEN_SECRET. Used
        only by POST /v1alpha1/adhoc-runs (task t19, gated by the t15
        auth-hardening pass, spec c27) — its own secret, so the power to
        start ad-hoc (often billable) work is granted independently of
        decision, registration, and event standing.
    attemptCallbackBearerAuth:
      type: http
      scheme: bearer
      description: >-
        The short-lived callback token minted for exactly one attempt. The
        route verifies it against the attempt id in the path before loading
        durable invocation authority or reading the request body.

  schemas:
    Namespace:
      type: object
      required: [id, slug, display_name, created_at]
      properties:
        id:
          type: string
        slug:
          type: string
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
    CreateWorkflowGeneration:
      type: object
      required: [description, actor_ref]
      additionalProperties: false
      properties:
        description: {type: string, minLength: 1}
        actor_ref: {type: string, minLength: 1}
        base_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'

    WorkflowGeneration:
      type: object
      required: [run_id, status, valid, diagnostics]
      properties:
        run_id: {type: string}
        status:
          type: string
          enum: [proposed, confirmed, rejected, exhausted]
        base_digest: {type: string}
        format: {type: string, enum: [yaml, json]}
        source: {type: string}
        diff: {type: string}
        valid: {type: boolean}
        digest: {type: string}
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'

    ArtifactWriteResult:
      type: object
      required: [ref, name, media_type, size_bytes, digest, backend, created_at]
      properties:
        ref:
          type: string
          pattern: '^artifact://[^/]+/[^/]+$'
        name:
          type: string
        media_type:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        backend:
          type: string
          enum: [postgres, s3]
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      description: >-
        The stable error shape, every non-2xx response, every operation.
        Mirrors internal/clifmt.CliError's JSON encoding exactly: `code`
        follows the same exit-code-style bucket (1 = domain/user error such
        as not-found or conflict, 2 = environment error such as a database
        outage), and the HTTP status line carries the specific condition.
      required: [code, message, remediation]
      properties:
        code:
          type: integer
          enum: [1, 2]
        message:
          type: string
        remediation:
          type: string

    Diagnostic:
      type: object
      required: [level, path, code, message, hint]
      properties:
        level:
          type: string
          enum: [error, warning]
        path:
          type: string
          description: A JSON Pointer into the submitted document.
        code:
          type: string
        message:
          type: string
        hint:
          type: string

    WorkflowSource:
      type: object
      required: [source]
      properties:
        format:
          type: string
          enum: [yaml, json]
          default: yaml
        source:
          type: string
          description: The workflow document, in the given format.

    WorkflowValidation:
      type: object
      required: [valid, digest, diagnostics]
      properties:
        valid:
          type: boolean
        digest:
          type: string
          description: The content digest of the normalized IR. Empty when the document has error diagnostics.
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'

    WorkflowVersion:
      type: object
      required:
        - id
        - workflow_key
        - version
        - source_format
        - source
        - normalized_ir
        - digest
        - created_at
      properties:
        id:
          type: string
        workflow_key:
          type: string
        version:
          type: integer
        source_format:
          type: string
          enum: [yaml, json]
        source:
          type: string
        normalized_ir:
          description: The normalized IR, as a JSON value.
        digest:
          type: string
        created_at:
          type: string
          format: date-time

    WorkflowVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowVersion'

    RunState:
      type: string
      enum: [created, running, waiting, completed, failed, cancelled]

    CreateRunRequest:
      type: object
      required: [workflow_digest]
      properties:
        workflow_digest:
          type: string
        input:
          description: The run input. Validated against the workflow's input contract.
        name:
          type: string
          description: >-
            Optional operator-given display name (task t3, migrations/0013).
            Additive: omitting it (every pre-t3 client) behaves exactly as
            before. Set at creation only — there is no way to change it
            afterward; see PatchRunRequest.
        description:
          type: string
          description: >-
            Optional operator-given free-text description (task t3). Set at
            creation only, like `name` — immutable afterward.
        category:
          type: string
          description: >-
            Optional flat tag (task t3), e.g. `review`, `audit`, `explore`,
            `implement`, `docs` — a cheap-to-change label, not a fixed
            taxonomy, so per-actor aggregates (issue #28) can slice by it.
            Unlike `name`/`description`, `category` alone is retaggable
            after creation via PATCH /v1alpha1/runs/{id} (frame decision
            q4).

    AdhocRunRequest:
      type: object
      required: [instruction, actor_ref, repo]
      properties:
        instruction:
          type: string
          description: What the actor is being asked to do. Rides as run input, never workflow content.
        actor_ref:
          type: string
          description: >-
            The agent actor to dispatch to, as a component reference, e.g.
            `actor://company/codex-thor@sha256:...`.
        repo:
          type: string
          description: The checkout path the actor works in. Rides as run input.
        sandbox:
          type: string
          description: Sandbox mode for the session (default `read-only`). Rides as run input.
        success_outcome:
          type: string
          description: >-
            The domain outcome name the task node declares (default
            `completed`); must match the workflow schema's outcomeName
            pattern `^[a-z][a-z0-9_]*$`.
        timeout:
          type: string
          description: >-
            The task node's attempt timeout as a Go-style duration literal
            (default `15m`). Workflow content: a different timeout renders
            to a different digest.

    PatchRunRequest:
      type: object
      required: [category]
      description: >-
        The only body PATCH /v1alpha1/runs/{id} accepts. `name` and
        `description` are immutable once a run is created (frame decision
        q4) — a request body carrying either key is refused with a
        structured 400, not silently ignored.
      properties:
        category:
          type: string
          description: >-
            The run's new category tag. An empty string clears it. See
            CreateRunRequest.category for what this field means.

    Run:
      type: object
      required: [id, workflow_digest, state, created_at, updated_at]
      properties:
        id:
          type: string
        workflow_digest:
          type: string
        state:
          $ref: '#/components/schemas/RunState'
        input:
          description: The run input, as submitted.
        output:
          description: The run's result. Present only once the run has completed.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        usage:
          allOf:
            - $ref: '#/components/schemas/Usage'
          description: >-
            The run-wide §13.2 usage/cost rollup (task t2), summed over
            every attempt of every node run in this run. Always present on
            GET /v1alpha1/runs/{id} (getRun), POST /v1alpha1/runs
            (createRun), PATCH /v1alpha1/runs/{id} (patchRun), and POST
            /v1alpha1/runs/{id}/cancel (cancelRun) — even a freshly created
            run with zero attempts carries a present-but-empty rollup,
            never an absent field. NOT computed (and therefore absent) on
            GET /v1alpha1/runs (listRuns), which would otherwise need one
            extra query per listed row.
        name:
          type: string
          description: >-
            Operator-given display name (task t3). Absent when the run was
            created without one — see `display_hint` for a derived
            fallback. Immutable after creation.
        description:
          type: string
          description: Operator-given free-text description (task t3). Immutable after creation.
        category:
          type: string
          description: >-
            The run's flat category tag (task t3), if any. Retaggable via
            PATCH /v1alpha1/runs/{id} (frame decision q4).
        display_hint:
          type: string
          description: >-
            A truncated, best-effort guess at what this run is about,
            derived AT READ TIME from a request/instruction/task-ish
            top-level string field of the run's own input — never
            persisted, and present only when `name` is absent. A client
            MUST treat this as distinct from `name`: it is a guess, not
            something an operator actually said, and must never be
            presented to a user as if it were the given name.
        actor_affinity:
          type: object
          description: >-
            The routing this run's workflow declared and resolved at
            creation (task t33, issue #107, migrations/0033), keyed by node
            id — e.g. `{"fix": {"actor": "actor://company/developer",
            "rule": "security-findings"}}`. Absent when the run resolved
            none, which is the case both for a workflow that declares no
            `spec.affinity` and for a run created by an operator rather
            than by an event trigger (affinity conditions are evaluated
            against the triggering event, so a run with no event has
            nothing to evaluate them against).


            `rule` is the declared affinity rule's name, and it is carried
            rather than dropped because it is what the per-actor
            comparative record slices by: "actor X ran this node" is
            already recoverable from the attempt, but "actor X was chosen
            because the workflow classified this as security-findings
            work" is only recoverable from here.
          additionalProperties:
            type: object
            required: [actor]
            properties:
              actor:
                type: string
                description: The actor reference this node dispatched to.
              rule:
                type: string
                description: The declared affinity rule that chose it, if it was named.

    Schedule:
      type: object
      required:
        [id, name, event_name, emitter, payload, interval_seconds, catch_up,
         enabled, next_fire_at, fire_count, skip_count, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
          description: >-
            Unique per namespace. It is the handle an operator disables by,
            which is why two schedules cannot share one.
        event_name:
          type: string
          description: The signal event this schedule appends on each occurrence.
        emitter:
          type: string
          description: >-
            Free text naming who emitted the fact. Attribution for
            operators, never an authority claim (PRD §10.4).
        payload:
          description: >-
            The event body, verbatim. Plain declared data — a schedule reads
            no external system and holds no credential.
        interval_seconds:
          type: integer
          format: int64
          minimum: 1
        catch_up:
          type: string
          enum: [fire-once, skip]
          description: >-
            What to do about an occurrence that came due while nothing was
            running — the question a cron line never answers.


            `fire-once` (the default) fires late, exactly once, then
            realigns to the next declared boundary; missed occurrences are
            counted, never backfilled, because six queued runs would each
            carry the same freshly-read findings. `skip` declines a MISSED
            occurrence and waits for the next boundary, which is right for
            anything whose value is tied to when it happens — a nightly
            report has no business running at noon. A skip increments
            `skip_count` and emits
            `dev.culture.nodes.schedule.skipped`, so "chose not to run" and
            "never came due" stay distinguishable.


            The two differ ONLY for a missed occurrence. One that is merely
            LATE — overdue by less than one whole interval, which a tick
            interval and a busy loop produce normally — fires under both.
        enabled:
          type: boolean
        next_fire_at:
          type: string
          format: date-time
          description: >-
            The next instant this schedule is due, and the whole durable
            state of the loop: it is advanced only inside the transaction
            that also appends the event, which is what makes a restart
            unable to double-start or lose an occurrence.
        last_fired_at:
          type: string
          format: date-time
          description: Absent until the first fire.
        last_event_id:
          type: string
          description: >-
            The `signal_events` fact the last fire appended — the audit
            trail in one field, since the runs it triggered are reachable
            from it.
        fire_count:
          type: integer
          format: int64
        skip_count:
          type: integer
          format: int64
          description: Occurrences declined under a `skip` catch-up policy.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ScheduleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'

    CreateScheduleRequest:
      type: object
      required: [name, event_name, interval_seconds]
      properties:
        name:
          type: string
          minLength: 1
        event_name:
          type: string
          minLength: 1
        emitter:
          type: string
          description: Defaults to `schedule:<name>` when omitted.
        payload:
          description: Defaults to `{}`.
        interval_seconds:
          type: integer
          format: int64
          minimum: 1
        catch_up:
          type: string
          enum: [fire-once, skip]
          description: Defaults to `fire-once`.
        enabled:
          type: boolean
          description: >-
            Defaults to true. An operator who declared a cadence and did not
            say otherwise meant it to run.
        first_fire_at:
          type: string
          format: date-time
          description: >-
            The first instant this schedule is due, and the phase every
            later occurrence aligns to. Omitted means one interval from now:
            creating a schedule is not the same act as starting a run.

    PatchScheduleRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    Usage:
      type: object
      description: >-
        The §13.2 usage/cost rollup task t2 aggregates from attempts (see
        migrations/0012_attempt_usage.sql) attempt→node-run→run, over
        EVERY attempt in scope regardless of technical outcome — a failed
        or cancelled attempt that still burned tokens before ending still
        counts ("retry burn"). Cost is summed only over attempts that
        reported one, and never across differing currencies: `cost` +
        `currency` are set together only when every cost-reporting
        attempt in scope agreed on one currency; `cost_by_currency` is set
        instead, as a list, whenever more than one currency was seen.
      required:
        [
          input_tokens,
          output_tokens,
          cached_input_tokens,
          reasoning_tokens,
          attempts_reported,
          attempts_not_reported,
        ]
      properties:
        input_tokens:
          type: integer
          description: >-
            Summed over attempts that reported usage at all
            (attempts_reported below). An attempt that reported none
            contributes nothing here — never folded in as zero.
        output_tokens:
          type: integer
        cached_input_tokens:
          type: integer
          description: >-
            docs/adr/0009-usage-telemetry-extension.md: summed over
            attempts that reported this field specifically. An attempt
            that reported input/output tokens but no cache telemetry at
            all (its contract exposes none) contributes nothing here —
            never a fabricated zero standing in for "unmeasurable". This
            is not gated by its own reported/not-reported count;
            attempts_reported/attempts_not_reported below remains the one
            coverage signal for the whole usage block.
        reasoning_tokens:
          type: integer
          description: >-
            docs/adr/0009-usage-telemetry-extension.md. Same aggregation
            rule as cached_input_tokens.
        cache_ratio:
          type: number
          description: >-
            cached_input_tokens / input_tokens, present only when
            input_tokens > 0. Never computed as a fabricated 0 when no
            attempt in scope reported any input tokens (0/0 is undefined,
            not zero) — absent in that case.
        cost:
          type: number
          description: >-
            Set only when every cost-reporting attempt in scope agreed on
            one currency (see `currency`); unset when no attempt reported
            a cost, or when currencies differ (see `cost_by_currency`).
        currency:
          type: string
          description: >-
            Present alongside `cost` when the reporting attempts agreed on
            one currency. May be absent even when `cost` is set, meaning
            the reporting attempt(s) priced their work without naming a
            currency.
        cost_by_currency:
          type: array
          description: >-
            Present instead of `cost`/`currency` when cost-reporting
            attempts in scope used more than one currency — one entry per
            currency actually seen, never summed together.
          items:
            $ref: '#/components/schemas/CurrencyCost'
        attempts_reported:
          type: integer
          description: How many attempts in scope reported a usage block at all.
        attempts_not_reported:
          type: integer
          description: >-
            How many attempts in scope completed with no usage block
            reported. attempts_reported == 0 with attempts_not_reported >
            0 is "no attempt reported usage" — distinct from a reported
            sum that happens to equal zero (attempts_reported > 0,
            input_tokens == 0).

    CurrencyCost:
      type: object
      description: One Usage.cost_by_currency entry.
      required: [cost]
      properties:
        currency:
          type: string
          description: >-
            Omitted when the summarized attempt(s) reported a cost with no
            currency at all.
        cost:
          type: number

    RunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Run'

    Token:
      type: object
      required: [id, node_id, state, created_at]
      properties:
        id:
          type: string
        node_id:
          type: string
        state:
          type: string
          enum: [active, consumed]
        parent_token_id:
          type: string
        origin_event_id:
          type: string
          description: >-
            The signal event that created this token, set only on an event pickup (issue #43). A
            pickup token has no parent token — nothing in the run handed it control, and the
            emitter may be another run entirely — so it names the fact it came from instead. A
            consumer drawing the ancestry tree must tolerate several roots per run and label the
            ones carrying this field.
        created_at:
          type: string
          format: date-time
        consumed_at:
          type: string
          format: date-time

    Attempt:
      type: object
      required: [id, node_run_id, attempt_number, status, started_at]
      properties:
        id:
          type: string
        node_run_id:
          type: string
        attempt_number:
          type: integer
        actor_id:
          type: string
        status:
          type: string
          enum: [succeeded, failed, timed_out, cancelled, policy_denied, contract_rejected]
        fencing_token:
          type: integer
        result:
          description: >-
            The attempt's reported output, as submitted. On a FAILED attempt
            it is the engine's diagnostic instead:
            {"error": {"class", "detail", "actor"?}}. `class` is the control
            plane's own PRD 13.5 classification and `detail` its one-line
            summary; `actor`, present only when the actor's error response
            carried something readable, is the ACTOR's own account of the
            refusal -- `message` (its error text), `class` (its class CLAIM,
            which is not adopted as the engine's), `body` (a snippet of a
            body that declared no error string), and `truncated`. Every
            string in the actor block is length-bounded and stripped of
            control characters at the dispatch seam: it is text an actor
            wrote, so treat it as data and never as markup.
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        usage:
          $ref: '#/components/schemas/AttemptUsage'
        termination_reason:
          type: string
          description: The provider-reported reason this attempt ended.
        continuation_ref:
          type: string
          description: Opaque handle offered by the actor for continuing this session.
        preserve_branch:
          type: string
          description: >-
            The branch name a bridge's preserve-on-failure plumbing commit
            (task t25, issue #49) actually created a ref for. Present only
            on an attempt whose bridge committed one -- most attempts,
            including every successful one, carry no such branch. A minted
            but never-committed name is never reported here.
        preserve_pushed:
          type: boolean
          description: >-
            Whether preserve_branch reached the bridge's configured remote
            (true) or exists only in the bridge host's local object
            database (false, the expected common case today -- bridge-host
            push credentials are unverified). Present only alongside
            preserve_branch.
        preserve_remote:
          type: string
          description: >-
            The remote name (e.g. "origin") the bridge attempted or reached
            the push against. Informational only -- never combined with
            preserve_branch to construct a forge URL; a client-side link
            may only come from configuration the operator actually set.
        supersedes:
          type: string
          description: >-
            The id of the attempt record this one corrects, absent on every
            ordinary dispatch. Set by the late-callback reconciliation: a
            node run's deadline expires, the engine records a timed_out
            attempt, and the actor session it bounded later reports the
            tokens, model, termination reason and preserve branch of work
            that really happened. That report cannot commit workflow state
            (PRD 13.4) and does not rewrite the record it corrects
            (PRD 10.4) -- it is appended as a new attempt naming the old
            one. A node run therefore legitimately lists BOTH: read the
            superseding record as current and the one it names as history.

    AttemptUsage:
      type: object
      required: [input_tokens, output_tokens]
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cost:
          type: number
        currency:
          type: string
        cached_input_tokens:
          type: integer
        reasoning_tokens:
          type: integer
        usage_model:
          type: string
          description: >-
            Model attribution exactly as reported by the bridge. Explicit
            unknown sentinels are rendered verbatim and never collapsed to null.
        thread_id:
          type: string

    NodeRun:
      type: object
      required: [id, node_id, state, visit_count, created_at]
      properties:
        id:
          type: string
        token_id:
          type: string
        node_id:
          type: string
        state:
          type: string
          enum: [ready, leased, running, waiting_external, waiting_human, waiting_join, completed, failed, cancelled]
        outcome:
          type: string
        visit_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/Attempt'

    NodeRunListItem:
      type: object
      description: >-
        One row of GET /v1alpha1/node-runs (task t11) — the same node_runs
        row NodeRun above documents, listed across every run in the
        namespace rather than nested under one, with `run_id` added (the
        parent run is not implied by a URL path here) and `actor_id` added
        (the most recent attempt's actor or runner reference; empty until
        the node run has been dispatched at least once) and `usage` added
        (task t2's §13.2 rollup over this node run's own attempts — always
        present, even a present-but-empty rollup for a node run with zero
        attempts).
      required: [id, run_id, node_id, state, created_at, updated_at, usage]
      properties:
        id:
          type: string
        run_id:
          type: string
        node_id:
          type: string
        actor_id:
          type: string
          description: >-
            The actor or runner reference (attempts.actor_id) of this node
            run's most recently dispatched attempt.
        state:
          type: string
          enum: [ready, leased, running, waiting_external, waiting_human, waiting_join, completed, failed, cancelled]
        outcome:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    NodeRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NodeRunListItem'
        next_cursor:
          type: string
          description: >-
            Opaque keyset pagination cursor. Present only when a further
            page exists; pass it back as the `cursor` query parameter to
            fetch it.

    RunView:
      type: object
      required: [run, tokens, node_runs]
      description: >-
        The Run-view payload (PRD §8.6 Run, §8.7 first visual slice): the
        run itself, every token, and every node run with its attempts
        nested — one round trip for the whole graph position and history.
      properties:
        run:
          $ref: '#/components/schemas/Run'
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/Token'
        node_runs:
          type: array
          items:
            $ref: '#/components/schemas/NodeRun'

    LedgerRecord:
      type: object
      required:
        - id
        - schema_version
        - record_type
        - run_id
        - origin
        - authority
        - data
        - provenance_refs
        - created_at
        - content_digest
      properties:
        id:
          type: string
        schema_version:
          type: string
        record_type:
          type: string
        run_id:
          type: string
        node_run_id:
          type: string
        attempt_id:
          type: string
        origin:
          type: object
          required: [kind, actor_id]
          properties:
            kind:
              type: string
            actor_id:
              type: string
            actor_revision:
              type: string
        authority:
          type: string
          enum: [proposed, confirmed, observed, derived, rejected, superseded]
        subject_ref:
          type: string
        data:
          description: The record's typed payload.
        provenance_refs:
          type: array
          items:
            type: string
        supersedes:
          type: string
        created_at:
          type: string
          format: date-time
        content_digest:
          type: string

    LedgerRecords:
      type: object
      required: [items, ledger_version]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LedgerRecord'
        ledger_version:
          type: integer
          format: int64

    Projection:
      type: object
      required: [kind, subject, items, digest]
      properties:
        kind:
          type: string
        subject:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/LedgerRecord'
        summary:
          description: Populated only by the delivery_summary projection.
        digest:
          type: string

    CreateReviewRequest:
      type: object
      required: [record_ids, ledger_version, reviewer_actor_id]
      properties:
        record_ids:
          type: array
          items:
            type: string
        ledger_version:
          type: integer
          format: int64
          description: The run's ledger version this request was read at.
        reviewer_actor_id:
          type: string
          minLength: 1
          description: >-
            The human actor the review is bound to, and the origin stamped
            on every review record the commit appends. Must be registered
            with kind `human`.

    ReviewRequest:
      type: object
      required: [id, run_id, status, ledger_version, frame_checksum, record_ids, created_at]
      properties:
        id:
          type: string
        run_id:
          type: string
        reviewer_actor_id:
          type: string
        status:
          type: string
          enum: [requested, committed]
        ledger_version:
          type: integer
          format: int64
        frame_checksum:
          type: string
        record_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    CommitReviewRequest:
      type: object
      required: [decisions, expected_ledger_version, rationale]
      properties:
        decisions:
          type: object
          description: Map of record id to verdict.
          additionalProperties:
            type: string
            enum: [confirm, reject]
        expected_ledger_version:
          type: integer
          format: int64
          description: The ledger version the caller expects to still hold. A mismatch is refused with 409, nothing written.
        rationale:
          type: string
          minLength: 1
          description: >-
            Why the reviewer decided this way — what they read, ran, or
            checked. Recorded on every review record the commit appends. A
            confirmation with no stated reason cannot be told apart from an
            unread one, so an empty rationale is refused with 400.

    PendingDecisionRecord:
      type: object
      required: [id, record_type, origin_kind, created_at, data]
      properties:
        id:
          type: string
        record_type:
          type: string
        origin_kind:
          type: string
        origin_actor_id:
          type: string
        node_run_id:
          type: string
        created_at:
          type: string
          format: date-time
        data:
          type: object
          description: The record's payload, verbatim — what the decider actually reads.

    PendingDecisionRun:
      type: object
      required: [run_id, ledger_version, records]
      properties:
        run_id:
          type: string
        ledger_version:
          type: integer
          format: int64
          description: >-
            The run's current ledger version, read in this same request —
            what POST /v1alpha1/runs/{id}/reviews wants as `ledger_version`.
        records:
          type: array
          items:
            $ref: '#/components/schemas/PendingDecisionRecord'

    PendingDecisionList:
      type: object
      required: [items, record_count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PendingDecisionRun'
        record_count:
          type: integer
          description: >-
            Undecided records across every listed run — the number a stage
            exit gate compares against zero.

    ReviewCommitResult:
      type: object
      required: [review_id, records, ledger_version]
      properties:
        review_id:
          type: string
        records:
          type: array
          items:
            $ref: '#/components/schemas/LedgerRecord'
        ledger_version:
          type: integer
          format: int64

    CreateGradeRequest:
      type: object
      required: [rating, rationale, evaluated_actor_id, grading_actor_id]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: The evaluator's opinion score on a fixed 1-5 scale.
        rationale:
          type: string
          minLength: 1
          description: Free-text justification for the rating.
        evaluated_actor_id:
          type: string
          description: >-
            The actor being evaluated. Must not equal grading_actor_id — a
            grade where the two are equal is refused (no actor grades its
            own work).
        grading_actor_id:
          type: string
          description: >-
            The actor recording the grade. Its registered actor kind (human
            or agent) decides the record's origin, and therefore whether it
            lands confirmed (human) or proposed (agent).
        node_run_ref:
          type: string
          description: Narrows the grade to one node run, when it is not about the whole run.
        attempt_ref:
          type: string
          description: Narrows the grade to one attempt, when it is not about the whole node run.
        category:
          type: string
          description: >-
            Optional flat tag carried onto the grade record itself
            (documentary — see grade.schema.json). Per-actor stats
            (GET /v1alpha1/actors/{id}/stats) slice by the graded run's own
            category, not this field.

    CreateSuiteVerdictRequest:
      type: object
      required: [suite, exit_code, commit_sha, validator_actor_id]
      properties:
        suite:
          type: string
          minLength: 1
          description: >-
            What ran, in the spelling a reader could re-run it with
            ("go test ./...", "uv run pytest -n auto", a CI job name). An
            unnamed suite cannot be re-run, so an empty one is refused.
        command:
          type: array
          items:
            type: string
          description: >-
            The argv the gate actually executed, when it executed one itself.
            Absent when the verdict came from a suite run elsewhere.
        exit_code:
          type: integer
          description: >-
            The number the suite exited with. Required and never defaulted —
            an omitted exit code reading as 0 would make every malformed
            request a pass. Zero records verdict `confirm`; anything else
            records `reject`. The label is computed here, never supplied.
        commit_sha:
          type: string
          pattern: '^[0-9a-f]{40}$'
          description: >-
            The commit the suite ran against, full 40-character lowercase
            hex. `HEAD`, a branch name, and an abbreviated sha are all
            refused: each means something different tomorrow, and a verdict
            that does not name what it tested is not evidence.
        ref:
          type: string
          description: >-
            The handover ref that carried the commit, when one did. Validated
            against the same `refs/culture-nodes/` fence a control-plane fetch
            is, so a verdict cannot name a ref the collector was never
            allowed to fetch.
        validator_actor_id:
          type: string
          description: >-
            The registered actor identifying the deterministic producer. Must
            not be an actor registered as `human` — a person reporting a
            suite result is making a claim about it, not producing it.
        node_run_ref:
          type: string
          description: Narrows the verdict to one node run.
        attempt_ref:
          type: string
          description: Narrows the verdict to one attempt.
        requires_grants:
          type: array
          items:
            type: string
          description: >-
            The dispatch grants the SUITE needs beyond running its own binary
            (`network-egress`, `home-write`, ...), in the vocabulary the
            bridges' capability surface uses. Only a routing input, never part
            of the verdict record. The gate is the only party that knows its
            suite talks to a database, and a repair lane whose posture grants
            no egress cannot verify one — so declaring it here is what turns
            #119 into a routing decision rather than a wasted session.
        implicated_paths:
          type: array
          items:
            type: string
          description: >-
            Repo-relative paths the gate knows this failure involves, added to
            the ones the control plane already measured for the run's
            handover. A failure implicating `.github/` routes to a human: a
            repair attempt is a dispatch, and a dispatch may not modify CI
            configuration.
        repair_actor_id:
          type: string
          description: >-
            Overrides which lane a repair would be routed to. Omit it to use
            the actor that authored this run's claims — the party that has the
            checkout the failure is in.

    SuiteVerdictResult:
      type: object
      required: [verdict]
      description: >-
        What the gate produced: the suite's verdict, and — for a REJECTING
        gate — where that failure was routed (task t32, issue #102).


        Two records rather than one because a rejecting gate produces two
        facts, and splitting them across two round trips would put the
        operator back in the loop the routing exists to take them out of.


        `routing` is absent for a passing gate: there is nothing to route, and
        a ledger row per green gate saying so is noise. `routing_error` is
        present, with `routing` still absent, when a routing was computed but
        could not be recorded — the verdict is the primary record and is never
        failed to protect its derivation, but the failure is stated rather
        than left as a silence.
      properties:
        verdict:
          $ref: '#/components/schemas/LedgerRecord'
        routing:
          $ref: '#/components/schemas/LedgerRecord'
        routing_error:
          type: string
          description: >-
            Why the gate failure was not recorded as routed. Overwhelmingly
            this is a repair-router producer identity nobody registered —
            `ledger_records.origin_actor_id` has a foreign key to
            `actors(id)`.

    Version:
      type: object
      required: [version, staleness]
      description: >-
        The control plane's own build identity (task t32, issue #104).
      properties:
        version:
          type: string
          description: The binary's declared version.
        revision:
          type: string
          pattern: '^[0-9a-f]{40}$'
          description: >-
            The commit this binary was built from. ABSENT when nothing
            established one — never an empty string, and never an
            abbreviation or a branch name.
        revision_source:
          type: string
          enum: [build_flag, go_vcs_stamp]
          description: >-
            How the revision was learned. `build_flag` is what the deploy said
            it was building (`-ldflags -X main.revision`), which is the only
            thing that can answer inside a container built from a `git
            archive` with no .git in it. `go_vcs_stamp` is what the build
            machine observed, available only for a build that ran inside a
            checkout — and it is the only one that can also report
            `revision_is_dirty`.
        revision_is_dirty:
          type: boolean
          description: >-
            True when the Go toolchain stamped this build from a checkout with
            uncommitted changes, so the revision names the last commit and not
            the code that is running. Absent for a `build_flag` revision,
            which cannot know it — its absence is not a claim that the tree
            was clean.
        staleness:
          type: string
          description: >-
            One sentence on what this answer does and does not establish,
            including the case where the revision cannot be established at
            all.

    HumanTask:
      type: object
      required: [id, run_id, kind, status, request, created_at]
      description: >-
        One human_tasks row (PRD §9.9): what an approval node's dispatch
        wrote instead of enqueuing work. `request` carries every field the
        PRD says the task must contain that is not already one of this
        object's own properties — decision_schema_ref, approver_ref,
        deadline, allowed_outcomes, context_refs, audit — exactly as the
        engine stored it, so a reader sees precisely what the human was
        shown.
      properties:
        id:
          type: string
        run_id:
          type: string
        node_run_id:
          type: string
          description: The paused node run this task belongs to.
        kind:
          type: string
        assigned_owner_id:
          type: string
        status:
          type: string
          enum: [pending, decided]
        request:
          type: object
          description: The PRD §9.9 task payload (decision_schema_ref, approver_ref, deadline, allowed_outcomes, context_refs, audit).
        response:
          type: object
          description: Set once the task is decided — outcome, decider_actor_id, response, decided_at.
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time

    HumanTaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HumanTask'

    DeliverEventRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The signal name until.signal subscriptions match on.
        payload:
          type: object
          description: The emitter's free-form event body. Folded into the resumed wait node's output so downstream bindings can read it. Defaults to `{}`.
        run_id:
          type: string
          description: Optional scope. Set, the event resumes only that run's matching subscriptions; unset, it resumes every matching subscription in the namespace.
        emitter:
          type: string
          description: Free text naming who emitted the fact (an actor ref, a node id, an external system). Attribution for operators, never an authority claim (PRD §10.4) — an inbound event is actor-reported information, not observed evidence. Defaults to `external`.
        source_key:
          type: string
          description: Stable emitter-owned identity whose watermark suppresses duplicate deliveries. Must be supplied with watermark.
        watermark:
          type: object
          description: Opaque per-source position. An exact repeat for source_key returns the original event without delivering it again.

    SignalEvent:
      type: object
      required: [id, name, payload, emitter, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        run_id:
          type: string
          description: Present only when the event was run-scoped.
        payload:
          type: object
        emitter:
          type: string
        created_at:
          type: string
          format: date-time

    EventDeliveryResult:
      type: object
      required: [event, resumed, picked_up, triggered]
      properties:
        event:
          $ref: '#/components/schemas/SignalEvent'
        resumed:
          type: array
          description: Every waiting subscription this delivery fired. Empty is a normal answer — the event was recorded and nothing was waiting.
          items:
            type: object
            required: [subscription_id, run_id, node_run_id]
            properties:
              subscription_id:
                type: string
              run_id:
                type: string
              node_run_id:
                type: string
        picked_up:
          type: array
          description: >-
            Every event route this delivery reached (issue #43). An admitted entry created a token
            and a node run at the route's target; a refused entry created nothing and says why —
            its guard declined, or the pickup would have taken the run past one of its spec.limits
            bounds. A refused pickup is deliberately NOT a run failure: an external event must not
            kill a healthy run because it arrived at a busy moment.
          items:
            type: object
            required: [route_id, run_id, node_id, admitted]
            properties:
              route_id:
                type: string
              run_id:
                type: string
              node_id:
                type: string
              admitted:
                type: boolean
              token_id:
                type: string
              node_run_id:
                type: string
              refusal:
                type: string
                description: '"guard", "run_terminal", or the loop bound that had no headroom (max_parallel_tokens, max_visits_per_node, max_transitions).'
              detail:
                type: string
        triggered:
          type: array
          description: Matching workflow-level handlers that created runs from this event. Empty means no newest published workflow version matched; the event is still recorded.
          items:
            type: object
            required: [workflow_digest, run_id]
            properties:
              workflow_digest:
                type: string
              run_id:
                type: string
        duplicate:
          type: boolean
          description: True when source_key and watermark already named a recorded event; resumed, picked_up, and triggered are then empty.

    DecideHumanTaskRequest:
      type: object
      required: [outcome, decider_actor_id, expected_ledger_version]
      properties:
        outcome:
          type: string
          description: The domain outcome selected. Must be one of the task's allowed_outcomes.
        decider_actor_id:
          type: string
          description: The human actor this decision is attributed to. Recorded as the ledger decision record's origin and the confirming review's reviewer_actor_id.
        response:
          description: The decision payload — notes, the decision schema's filled-in fields, whatever the presenting surface collected. Also the CEL "output" activation for a guarded edge leaving this node.
        expected_ledger_version:
          type: integer
          format: int64
          description: The run's ledger version the decider last read. A mismatch is refused with 409, nothing written.
        record_ids:
          type: array
          items:
            type: string
          description: Other ledger records the decider is confirming alongside this decision (e.g. records the task's context_refs pointed at). Ordinarily empty.

    HumanTaskDecisionResult:
      type: object
      required: [human_task_id, run_id, node_run_id, outcome, ledger_records, run_state]
      properties:
        human_task_id:
          type: string
        run_id:
          type: string
        node_run_id:
          type: string
          description: The node run the decision resolved.
        outcome:
          type: string
        ledger_records:
          type: array
          items:
            $ref: '#/components/schemas/LedgerRecord'
          description: The proposed decision record and the confirming review record the review transaction appended.
        next_node_id:
          type: string
        next_node_run_id:
          type: string
        next_human_task_id:
          type: string
          description: Set instead of a claimable work item when the routed edge itself reaches another approval node.
        run_state:
          type: string
        run_output:
          description: Set only when the routed edge ended the run.

    Actor:
      type: object
      description: >-
        One `actors` table row (task t15). Actor identity is append-only:
        a capability or endpoint change is a new row (a new `revision`),
        never an update to an existing one. `capabilities` and `metadata`
        are rendered verbatim — neither column ever holds a credential
        (`metadata.auth_token_env`, when set, names the environment
        variable a worker reads a token from, never the token value
        itself), so there is nothing to redact.
      required: [id, actor_key, revision, kind, protocol, created_at]
      properties:
        id:
          type: string
        actor_key:
          type: string
        revision:
          type: integer
        kind:
          type: string
        protocol:
          type: string
        endpoint_ref:
          type: string
        capabilities:
          description: Declared capabilities, as the row's own JSON value.
        metadata:
          description: Open metadata, as the row's own JSON value.
        created_at:
          type: string
          format: date-time
        availability:
          $ref: '#/components/schemas/ActorAvailability'
        dispatch_rate:
          $ref: '#/components/schemas/DispatchRate'

    ActorAvailability:
      type: object
      description: >-
        The capacity circuit breaker's state for this actor (task t9,
        migration 0020's `actor_availability` table). Absent entirely when
        the actor has never been paused — which is a different fact from a
        pause that has lapsed, and the two are deliberately distinguishable:
        a lapsed or cleared pause still renders, with `paused: false`.

        Keyed by `actor_key`, so every revision of one identity reports the
        same availability: provider capacity belongs to the identity, not to
        one append-only registration revision. The pause is a DEADLINE, not
        a flag — `paused` is computed server-side against the database's own
        clock, so horizontally-scaled workers and API readers cannot
        disagree about it.
      required: [paused, paused_until, reason, tripped_at]
      properties:
        paused:
          type: boolean
          description: >-
            Whether the pause is still in force right now. False means the
            deadline passed or an operator cleared it; the rest of this
            block is then the history of the pause that ended.
        paused_until:
          type: string
          format: date-time
          description: When the actor becomes (or became) dispatchable again.
        reason:
          type: string
          description: >-
            The §13.5 error class that tripped the breaker —
            `capacity_exhausted` today.
        retry_after_seconds:
          type: integer
          description: >-
            The provider's own Retry-After hint, in seconds. Absent when it
            named none — never `0`, which would read as "retry immediately".
            The worker caps how long a hint may actually pause an actor; this
            is the unclamped value the provider sent.
        detail:
          type: string
          description: One human line naming what happened.
        tripped_at:
          type: string
          format: date-time
        tripped_by_run_id:
          type: string
          description: >-
            The dispatch that discovered the exhaustion, so "why is this
            paused" is answerable from the actor surface alone rather than
            by correlating timestamps against the event log.
        tripped_by_node_run_id:
          type: string
        tripped_by_attempt_id:
          type: string
        cleared_at:
          type: string
          format: date-time
          description: >-
            Present only when an operator ended the pause early (POST
            /v1alpha1/actors/{id}/resume), which is what keeps "it expired"
            and "a human let it back in" distinguishable afterwards.
        cleared_by:
          type: string

    Preflight:
      type: object
      description: >-
        One clarify-then-commit briefing (task t14, issue #67; migration
        0026's `dispatch_preflights`). `expired` is computed against the
        server clock at read time, because the window — not the row's
        existence — is the predicate everywhere in this feature.
      required:
        [id, run_id, node_run_id, node_id, actor_key, record_id, record_digest,
         issued_at, expires_at, expired, acknowledged, consumed]
      properties:
        id:
          type: string
        run_id:
          type: string
        node_run_id:
          type: string
        node_id:
          type: string
        actor_key:
          type: string
          description: The actor identity this dispatch is addressed to.
        actor_id:
          type: string
          description: >-
            The actors-table row id, present only when the registry could
            resolve one. Absent means unattributed, never a fabricated id.
        record_id:
          type: string
          description: The `dispatch_preflight` ledger record stating the briefing.
        record_digest:
          type: string
          description: >-
            That record's content digest. An acknowledgement names it, so
            "the actor acknowledged this briefing" cannot later be true of a
            briefing whose content the reader never saw.
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        expired:
          type: boolean
        acknowledged:
          type: boolean
        acknowledged_at:
          type: string
          format: date-time
        acknowledged_by:
          type: string
        acknowledgement_record_id:
          type: string
          description: The proposed `dispatch_acknowledgement` record carrying the claim.
        consumed:
          type: boolean
          description: >-
            True once a dispatch has ridden this briefing. Single-use: the
            next dispatch of that node needs its own.
        consumed_at:
          type: string
          format: date-time
        consumed_by_attempt_id:
          type: string
        document:
          type: object
          description: >-
            The briefing itself, as the derived ledger record carries it.
            Present on the detail and acknowledge responses; omitted from
            list items.

    PreflightList:
      type: object
      description: GET /v1alpha1/preflights' payload (task t14).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Preflight'

    AcknowledgePreflightRequest:
      type: object
      description: POST /v1alpha1/preflights/{id}/acknowledge's body (task t14).
      required: [actor_id]
      properties:
        actor_id:
          type: string
          description: >-
            The registered actor this acknowledgement is recorded for. An
            acknowledgement nobody is attributable for is a record of nobody
            having understood anything, so it is required.
        verdict:
          type: string
          enum: [proceed]
          description: >-
            Optional, and only `proceed` is admitted. An actor that cannot
            proceed does not acknowledge; its dispatch is refused when the
            window closes and routes under `preflight_unacknowledged`.
        note:
          type: string
          description: Free text from the acknowledging party. Documentary.

    DispatchRateList:
      type: object
      description: GET /v1alpha1/dispatch-rates' payload (task t10).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DispatchRate'

    DispatchRate:
      type: object
      description: >-
        One dispatch-rate scope's declared rate and its standing in the
        CURRENT session window (task t10, migration 0022's
        `dispatch_rate_state`). On an actor payload it is that actor's own
        rate, resolved by `actor_key` the way `availability` is, and absent
        when no declared rate has ever admitted a dispatch to it.


        `window_started_at`, `window_ends_at`, `dispatched` and `remaining`
        are computed against the moment of the read, not read raw from the
        row: session windows reset on a fixed clock, so a stored counter
        belonging to a window that has already ended reports zero
        consumption rather than showing last window's spending as though it
        still constrained anything. `last_dispatch_at` and `updated_at` stay
        raw row provenance, so that history is not lost either.
      required:
        [scope, limit_per_window, window_seconds, window_anchor,
         window_started_at, window_ends_at, dispatched, remaining, updated_at]
      properties:
        scope:
          type: string
          description: >-
            `global` (the whole installation's session rate) or `actor` (one
            actor key's own).
        scope_key:
          type: string
          description: The actor key for scope `actor`; absent for `global`.
        limit_per_window:
          type: integer
          description: >-
            Dispatches one window may admit, as the last worker to consume a
            slot enforced it. Workers that disagree about the configured
            rate show up here rather than being averaged away.
        window_seconds:
          type: integer
          description: The session window's length.
        window_anchor:
          type: string
          format: date-time
          description: >-
            The reset clock: an instant at which a window boundary falls.
            Every boundary is this instant plus or minus a whole number of
            windows, which is how horizontally-scaled workers agree on which
            window they are in without exchanging a message.
        window_started_at:
          type: string
          format: date-time
          description: The start of the window this rate is in right now.
        window_ends_at:
          type: string
          format: date-time
          description: When that window resets and the budget returns.
        dispatched:
          type: integer
          description: Dispatches admitted in the current window.
        remaining:
          type: integer
          description: >-
            How many more dispatches this scope may admit before the window
            ends: the remaining-window capacity capped by the remaining
            budget. It shrinks as the window runs out even when nothing has
            been consumed, because the control spreads sessions across the
            REMAINING window rather than at a rate that ignores when the
            window ends (spec claim c43).
        next_dispatch_at:
          type: string
          format: date-time
          description: >-
            The pace, made durable: the earliest instant the next dispatch
            in this scope may go. Absent when nothing has dispatched yet.
        last_dispatch_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PlanImportRequest:
      type: object
      description: >-
        POST /v1alpha1/plan-imports' body (task t22). `plan_show` is the
        exact object `devague plan show --json` prints (or an equivalent
        document from another source system — this surface is
        domain-agnostic, task t24 exercises a non-code one). `deviations`,
        when present, is the exact object `.devague/deliveries/<slug>.json`
        holds on disk, and its `plan_slug` must equal `plan_show.slug`.
      required: [plan_show]
      properties:
        plan_show:
          type: object
          description: >-
            The faithful per-task plan view: per-task status and REAL
            dependency edges, never a wave approximation.
        deviations:
          type: object
          description: >-
            Execution-time deviations from the confirmed plan, each carrying
            its origin (`user` or `llm` — the issue #45 "system knows" vs
            "user reports" split).

    PlanImportTask:
      type: object
      description: One task of an imported plan snapshot.
      required:
        [task_ref, summary, origin_kind, source_status, depends_on,
         acceptance_criteria, covers]
      properties:
        task_ref:
          type: string
          description: The source system's own task id, e.g. devague's `t3`.
        summary:
          type: string
        instruction:
          type: string
        origin_kind:
          type: string
          enum: [human, agent]
          description: >-
            The ledger producer kind the source's own origin maps to
            (devague `user` -> `human`, `llm` -> `agent`).
        source_status:
          type: string
          description: >-
            The source system's own per-task decision status verbatim
            (devague: `proposed` | `confirmed` | `rejected`) — never
            translated into a ledger authority value.
        depends_on:
          type: array
          items:
            type: string
          description: >-
            REAL per-task dependency edges: other tasks' `task_ref` values
            in this same plan import, exactly as the source recorded them —
            never widened to "everything in the previous wave".
        wave:
          type: integer
          description: >-
            Computed LOCALLY at import time via topological layering over
            depends_on — the source system does not emit this field itself.
            Absent for a rejected task, which occupies no wave.
        acceptance_criteria:
          type: array
          items:
            type: string
        covers:
          type: array
          items:
            type: string

    PlanImportDeviation:
      type: object
      description: One execution-time deviation of an imported plan snapshot.
      required:
        [deviation_ref, what, task_ref, reason, affects, origin_kind, source_status]
      properties:
        deviation_ref:
          type: string
          description: The source system's own deviation id, e.g. devague's `d1`.
        what:
          type: string
        task_ref:
          type: string
          description: The plan task this deviation relates to.
        reason:
          type: string
        affects:
          type: array
          items:
            type: string
        origin_kind:
          type: string
          enum: [human, agent]
          description: >-
            The issue #45 "system knows" (llm -> agent) vs "user reports"
            (user -> human) split, preserved verbatim from the source.
        source_status:
          type: string
          description: >-
            The source system's own deviation status verbatim (devague:
            `proposed` | `approved` | `rejected` — note `approved`, not
            `confirmed`) — never translated into a ledger authority value.
        classification:
          type: string
          description: Optional source-recorded classification, when present.

    PlanImport:
      type: object
      description: >-
        GET /v1alpha1/plan-imports/{id}' and the 201 body of POST
        /v1alpha1/plan-imports (task t22): one immutable import snapshot.
        Deliberately not a work-ledger record — see
        migrations/0024_plan_imports.sql.
      required:
        [id, slug, title, source_slug, source_status, source_digest,
         imported_at, tasks, deviations]
      properties:
        id:
          type: string
        slug:
          type: string
          description: >-
            The source plan's own slug. NOT unique: re-importing the same
            slug creates a new, independent snapshot row.
        title:
          type: string
        source_slug:
          type: string
          description: >-
            The source document/frame this plan was decomposed from
            (devague `frame_slug`).
        source_status:
          type: string
          description: The source system's own plan-level status verbatim.
        source_digest:
          type: string
          description: sha256 digest of the raw imported bytes.
        imported_at:
          type: string
          format: date-time
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/PlanImportTask'
        deviations:
          type: array
          items:
            $ref: '#/components/schemas/PlanImportDeviation'

    PlanImportSummary:
      type: object
      description: >-
        One row of GET /v1alpha1/plan-imports?slug= (task t23): the same
        plan-level fields PlanImport carries, without `tasks`/`deviations`
        — those are read one snapshot at a time via GET
        /v1alpha1/plan-imports/{id}.
      required:
        [id, slug, title, source_slug, source_status, source_digest, imported_at]
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        source_slug:
          type: string
        source_status:
          type: string
        source_digest:
          type: string
        imported_at:
          type: string
          format: date-time

    PlanImportSummaryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlanImportSummary'
          description: Most recent `imported_at` first.

    ResumeActorRequest:
      type: object
      description: >-
        POST /v1alpha1/actors/{id}/resume' body (task t9). Entirely
        optional: no body, an empty body, and `{}` all mean "an operator did
        this and did not say who", recorded as `cleared_by: operator` rather
        than as an empty attribution.
      properties:
        cleared_by:
          type: string
          description: >-
            Who is clearing the pause, recorded on the availability row.
            Defaults to `operator`.

    ActorList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Actor'

    RegisterActorRequest:
      type: object
      description: >-
        POST /v1alpha1/actors' body (task t13). The row's `id` and
        `revision` are never the caller's to choose: the id is minted
        server-side and the revision is always the next one for
        `actor_key`. `capabilities` and `metadata` follow the Actor
        schema's credential rule — `metadata.auth_token_env`, when set,
        names the environment variable a worker reads a token from, never
        the token value itself.
      required: [actor_key, kind, protocol]
      properties:
        namespace:
          type: string
          description: >-
            Optional. This server is bound to one namespace at
            construction; when present, this may only name that
            namespace's id — anything else is refused with 400 rather
            than silently rerouted.
        actor_key:
          type: string
        kind:
          type: string
          description: The actor kind (e.g. agent, human, runner).
        protocol:
          type: string
          description: The dispatch protocol (e.g. http).
        endpoint_ref:
          type: string
        capabilities:
          description: Declared capabilities, stored as the row's JSON value ('{}' when omitted).
        metadata:
          description: Open metadata, stored as the row's JSON value ('{}' when omitted).

    ActorNodeRunOutcome:
      type: object
      description: >-
        One node-run participation bucket. `status` is `node_runs.status`
        (the engine's technical lifecycle state); `outcome` is
        `node_runs.outcome` (the PRD's domain outcome, e.g.
        "changes_required" — set only on a succeeded transition). The two
        are reported side by side, never conflated: a domain outcome is not
        a technical status. `outcome` is absent when the node run has none
        recorded yet (in progress, failed, cancelled, or contract-rejected).
      required: [status, count]
      properties:
        status:
          type: string
        outcome:
          type: string
        count:
          type: integer

    ActorLedgerAuthorityCount:
      type: object
      description: >-
        How many ledger records this actor originated (`origin.actor_id`)
        at a given authority — every record_type, not only `claim`; PRD
        §10.4 uses "claim" generically for anything an agent asserts.
      required: [authority, count]
      properties:
        authority:
          type: string
          enum: [proposed, confirmed, observed, derived, rejected, superseded]
        count:
          type: integer

    ActorRetryBurn:
      type: object
      description: >-
        "Attempts per completion": how many dispatch attempts this actor
        made in scope, against how many of the node runs it attempted
        actually reached `completed`.
      required: [attempts, completed_node_runs]
      properties:
        attempts:
          type: integer
        completed_node_runs:
          type: integer
        attempts_per_completion:
          type: number
          description: >-
            attempts / completed_node_runs. Absent — never a fabricated
            division — when completed_node_runs is 0.

    ActorDurationPercentiles:
      type: object
      description: >-
        p50/p90/p99 (linear interpolation) over this actor's attempt
        durations (completed_at - started_at, in seconds), computed only
        over attempts that have actually completed.
      required: [p50_seconds, p90_seconds, p99_seconds, count]
      properties:
        p50_seconds:
          type: number
        p90_seconds:
          type: number
        p99_seconds:
          type: number
        count:
          type: integer

    ActorGradeAgg:
      type: object
      description: >-
        One grades.proposed/grades.confirmed bucket: how many
        grade.schema.json records and their mean rating.
      required: [count]
      properties:
        count:
          type: integer
        mean_rating:
          type: number
          description: >-
            Absent — never a fabricated 0 — when count is 0: an average of
            zero opinions is undefined, not zero.

    ActorGrades:
      type: object
      description: >-
        Proposed (agent-origin opinion) and confirmed (a human's own direct
        opinion) grade aggregates evaluating this actor, kept as two
        separate numbers — never blended into one.
      required: [proposed, confirmed]
      properties:
        proposed:
          $ref: '#/components/schemas/ActorGradeAgg'
        confirmed:
          $ref: '#/components/schemas/ActorGradeAgg'

    ActorStatsBucket:
      type: object
      description: >-
        One stats slice's numbers — either the all-categories `total` or
        one named `categories` entry (see ActorStats).
      required: [runs_by_outcome, claims_by_authority, retry_burn, usage, grades]
      properties:
        runs_by_outcome:
          type: array
          items:
            $ref: '#/components/schemas/ActorNodeRunOutcome'
        claims_by_authority:
          type: array
          items:
            $ref: '#/components/schemas/ActorLedgerAuthorityCount'
        retry_burn:
          $ref: '#/components/schemas/ActorRetryBurn'
        duration_percentiles:
          allOf:
            - $ref: '#/components/schemas/ActorDurationPercentiles'
          description: Absent when no attempt in this scope has completed yet.
        usage:
          allOf:
            - $ref: '#/components/schemas/Usage'
          description: The §13.2 usage/cost rollup (task t2), scoped to this actor's own attempts.
        grades:
          $ref: '#/components/schemas/ActorGrades'

    ActorCategoryBucket:
      description: One ActorStats.categories entry — an ActorStatsBucket plus the category tag it summarizes.
      allOf:
        - type: object
          required: [category]
          properties:
            category:
              type: string
              description: >-
                The run category tag ("" is the explicit uncategorized
                bucket — never omitted, always present as a real value).
        - $ref: '#/components/schemas/ActorStatsBucket'

    ActorStats:
      type: object
      description: >-
        GET /v1alpha1/actors/{id}/stats' payload (task t15). `total` is the
        all-categories aggregate, computed as its own query scope — never a
        client-side sum of `categories` (a percentile is not additive
        across subgroups).
      required: [actor_id, total, categories]
      properties:
        actor_id:
          type: string
        total:
          $ref: '#/components/schemas/ActorStatsBucket'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ActorCategoryBucket'

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
