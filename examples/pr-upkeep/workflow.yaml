# Event-driven PR upkeep. sweep.py is only a discovery emitter; this workflow
# starts from the durable pr-upkeep.pr fact and therefore needs no parked run.
#
# Deployment configuration: register actor://company/developer at the
# deployment's developer bridge and group/platform-maintainers in its human
# inbox. The event payload supplies repository identity and findings; no
# discovery credentials or sweep process are part of this graph.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: pr-upkeep
  version: 2.1.0
  ownerRef: team/platform-ai

spec:
  entry: fix

  # Publishing a newer pr-upkeep version without this declaration disables
  # future starts. A delivered event remains in signal_events either way.
  triggers:
    - onEvent: pr-upkeep.pr
      when: event.payload.source == "github_pr" && size(event.payload.findings) > 0

  # Which developer actor takes the fix, decided from the finding itself
  # (task t33). First match wins, so the unconditional rule is declared last
  # and the compiler enforces that ordering. The resolved choice is recorded
  # on the run (runs.actor_affinity), which is the point: the per-actor
  # comparative record needs to know what the workflow said this work WAS,
  # not only which actor happened to run it.
  #
  # Deployment configuration, again: both references must resolve in the
  # deployment's registry. Pointing them at the same registered actor is a
  # legitimate way to run this workflow without splitting the fleet — the
  # recorded rule still distinguishes the two kinds of work afterwards.
  affinity:
    - name: security-findings
      node: fix
      actor: actor://company/security-developer
      when: event.payload.findings.exists(f, f.kind == "security")
    - name: general-findings
      node: fix
      actor: actor://company/developer

  contract:
    # Triggered runs receive the event payload verbatim. This replaces the
    # former sweep report: repository, PR identity, and prioritized findings
    # are now durable event data and are queryable even when the condition
    # above declines the handler.
    input:
      schema:
        type: object
        required: [source, repository, number, head_sha, findings]
        additionalProperties: false
        properties:
          source: {const: github_pr}
          repository: {type: string, minLength: 1}
          number: {type: integer, minimum: 1}
          head_sha: {type: string, minLength: 1}
          findings: {type: array, minItems: 1}
    output:
      schema: {type: object}

  limits:
    maxDuration: 168h
    maxTransitions: 8
    maxVisitsPerNode: 1
    maxParallelTokens: 1

  nodes:
    fix:
      kind: agent
      ownerRef: team/developer-experience
      uses: actor://company/developer@sha256:3333333333333333333333333333333333333333333333333333333333333333
      # A trigger-created run's input IS the event payload, which carries the
      # findings and nothing else — no instruction, no checkout path. Passing
      # it through with `from: /run/input` is what made every triggered run
      # fail on `input.instruction is required` (issue #125).
      #
      # `instruction` is a LITERAL because it is graph authoring, not
      # deployment configuration: it says what this node does, it is the same
      # in every deployment, and it is fixed at publish time and addressed by
      # the workflow's content digest like everything else here.
      #
      # `repo` is deliberately NOT bound. It is the one genuinely
      # deployment-specific value, so a literal here would break the rule this
      # example holds to — loading it into another deployment must never mean
      # editing workflow.yaml. The bridge resolves it from its own allowlist
      # when that names exactly one repository, and refuses when the choice is
      # ambiguous.
      #
      # `finding` carries the event payload. Every non-transport key arrives
      # in the session as a verbatim "Bound inputs" block, so the findings are
      # read by the actor without this graph reformatting them.
      input:
        bindings:
          instruction:
            literal: |
              Take the HIGHEST-PRIORITY item from the prioritised `findings`
              list bound below and work only that one item.

              The list is already ordered across three vocabularies —
              SonarCloud severities, Qodo severities, and failed CI checks —
              so the first entry is the item to work. Do not re-rank it, and
              do not batch several items into one change.

              Implement the fix on a branch and open or update a pull request
              for it. NEVER merge anything: this graph's merge step is a
              separate human-approval node, and an agent merging here would
              bypass it.

              If the item is not actually a defect — a false positive, a
              finding already fixed, or one whose fix would be wrong — say so
              plainly and submit `no_change` with the reason. A stated
              non-fix is a better outcome than a manufactured one.

              Report which finding you took, what you changed, and the PR you
              opened or updated.
          finding: /run/input
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [summary]
              properties:
                summary: {type: string}
          no_change:
            schema: {type: object}
      # A real bridge completion proposes a claim (PRD §10.4); a node that
      # declares no propose types rejects every honest actor completion as
      # contract_rejected. That is bug #202, measured twice: four failed fix
      # runs on PR #201 (2026-08-19) and again on PR #208 — the work landed
      # each time, then the run died on this missing block. jira-intake
      # documented the same trap from the t17 round trip.
      ledger:
        propose: [claim]

    human-merges-pr:
      kind: approval
      ownerRef: team/platform-ai
      approverRef: group/platform-maintainers
      decisionSchemaRef: schema://pr-upkeep/merge-decision/v1
      deadline: 168h
      input:
        bindings:
          finding: /run/input
          fix: /nodes/fix/output

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /run/input

  edges:
    - from: fix.completed
      to: human-merges-pr
    - from: fix.no_change
      to: finish
    - from: human-merges-pr.approved
      to: finish
    - from: human-merges-pr.rejected
      to: finish
    # `expired` is the third outcome the compiler implies for every approval
    # node, and until task t11 this graph declared no edge for it -- so an
    # expiring approval would have failed the run with "no edge matched"
    # instead of ending it. It has an edge now because the engine can reach
    # that outcome on its own: when the sweep's pr.merged fact says the pull
    # request this approval is FOR has already been merged, there is nothing
    # left to approve, and the control plane expires the task with reason
    # `pr_merged` (internal/engine/humantaskexpiry.go). 26 approvals on prod
    # sat pending for exactly this reason with nothing able to close them.
    #
    # It routes to `finish`, the same end node an approval and a rejection
    # reach: the run is over either way, and the DIFFERENCE is recorded on the
    # human task (status `expired`, expiry_reason `pr_merged`) and in the
    # run's ledger as a derived record -- not by inventing a second end node
    # whose only job is to say which of three ways the run stopped.
    - from: human-merges-pr.expired
      to: finish
