# The maxParallelTokens fixture (parallel-tokens design D8, test T5): the same
# graph as parallel.workflow.yaml with the cap set BELOW the fan-out a
# three-way split would produce. A split that would cross the cap is refused
# WHOLE — never a partial fan-out, because which branches existed would then
# depend on runtime token counts — and refusal follows the ordinary §9.7 bound
# path: BoundExceeded{max_parallel_tokens}, run.bounded, run failed.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: engine-parallel-cap
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: fan

  contract:
    input:
      schema:
        type: object
        properties:
          slow:
            type: boolean
    output:
      schema:
        type: object

  limits:
    maxDuration: 1h
    maxTransitions: 32
    maxVisitsPerNode: 8
    maxParallelTokens: 2

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    fan:
      kind: parallel
      ownerRef: team/platform-ai

    lint:
      kind: agent
      ownerRef: team/quality-platform
      uses: actor://company/linter@sha256:111111
      input:
        from: /run/input
      contract:
        outcomes:
          clean:
            schema:
              type: object

    test:
      kind: agent
      ownerRef: team/quality-platform
      uses: actor://company/tester@sha256:222222
      input:
        from: /run/input
      contract:
        outcomes:
          passed:
            schema:
              type: object

    slow:
      kind: agent
      ownerRef: team/quality-platform
      uses: actor://company/slowpoke@sha256:333333
      input:
        from: /run/input
      contract:
        outcomes:
          done:
            schema:
              type: object

    gather:
      kind: join
      ownerRef: team/platform-ai
      join:
        policy: all

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/gather/output

  edges:
    - from: fan.split
      to: lint

    - from: fan.split
      to: slow
      when: has(input.slow) && input.slow

    - from: fan.split
      to: test

    - from: lint.clean
      to: gather

    - from: test.passed
      to: gather

    - from: slow.done
      to: gather

    - from: gather.joined
      to: finish
