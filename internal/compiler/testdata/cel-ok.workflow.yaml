apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: cel-ok
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: start

  contract:
    input:
      schemaRef: ./contracts/in.schema.json
    output:
      schemaRef: ./contracts/out.schema.json

  nodes:
    start:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/start@sha256:aaaaaa
      contract:
        outcomes:
          completed:
            schemaRef: ./contracts/start.schema.json
      input:
        from: /run/input

    route:
      kind: decision
      ownerRef: team/platform-ai
      select:
        - outcome: proceed
          when: outcome == 'completed'

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/start/output

  edges:
    - from: start.completed
      to: route
      when: has(input.priority) && input.priority > 0
    - from: route.proceed
      to: finish
