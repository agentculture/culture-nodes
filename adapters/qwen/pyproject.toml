[project]
name = "culture-nodes-qwen-bridge"
version = "0.1.0"
description = "Reference actor-protocol bridge: dispatches Culture Nodes invocations to Qwen Code over ACP (qwen --acp, stdio JSON-RPC). Runs OUTSIDE the culture-nodes deployment, beside a qwen install."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
# Stdlib-only runtime deps (mirrors the sibling adapters' own
# reference-adapter constraint): the bridge talks HTTP via
# http.server/urllib and drives the `qwen` binary (one `qwen --acp`
# process per invocation, stdio JSON-RPC) via subprocess — nothing here
# may grow a PyPI dependency graph the bridge's host has to reconcile
# with qwen's own install.
dependencies = []

[project.urls]
Homepage = "https://github.com/agentculture/culture-nodes"
Issues = "https://github.com/agentculture/culture-nodes/issues"

[project.scripts]
qwen-bridge = "qwen_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_bridge"]

# The deploy's revision stamp must reach the WHEEL (task t32, issue #120
# item 4). `_revision.json` is VCS-ignored — it is generated per install, not
# committed — and hatchling excludes VCS-ignored files by default, so without
# this the stamp would be written by deploy.sh, silently dropped at build
# time, and every `uv tool install`ed copy would report a revision it could
# not establish. That is the same class of silent no-op the whole fact exists
# to close, which is why tests/deploy/revisionstamp_test.go builds a wheel and
# asserts the file is inside it rather than trusting this line.
artifacts = ["src/qwen_bridge/_revision.json"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
