{{- if .Values.postgresql.enabled -}}
# A small, self-contained postgres:17 StatefulSet — deliberately not a
# Bitnami (or any other external) chart dependency; see values.yaml's
# postgresql comment for why that boundary matters here. Suitable for a
# kind-cluster smoke or a small non-production install; a real production
# deployment should generally set postgresql.enabled: false and point
# postgresql.external.url at a managed instance instead.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "culture-nodes.fullname" . }}-postgres
  labels:
    {{- include "culture-nodes.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # See ../secret-database.yaml's comment: same tier ("-5"), same reason (the migration Job, weight "0", needs Postgres reachable before it runs).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
spec:
  serviceName: {{ include "culture-nodes.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "culture-nodes.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "culture-nodes.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            # A dedicated subdirectory, not the volume mount root: the
            # official postgres image's own documented workaround for the
            # mount root sometimes carrying a lost+found directory that
            # trips its "is this directory empty" first-boot check.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # Read from the -db Secret (templates/secret-database.yaml),
            # not a separate postgres-only Secret: that Secret computes
            # this password exactly once and reuses it for both this key
            # and NODES_DATABASE_URL's embedded password, which is the
            # only way the two are guaranteed to match — see that file's
            # own comment.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "culture-nodes.fullname" . }}-db
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      {{- if not .Values.postgresql.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgresql.persistence.storageClassName }}
        storageClassName: {{ .Values.postgresql.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
  {{- end }}
{{- end -}}
