# The smallest workflow that can be waiting on an asynchronous actor: one
# agent node that answers 202 and reports later, and an end node that turns
# its output into the run result.
#
# The worker's async test drives this end to end: dispatch, park, worker goes
# idle holding nothing, actor calls back, run completes. Two nodes is enough
# because the thing under test is the §12.6 handover, not the graph.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: worker-async-slice
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: work

  contract:
    input:
      schema:
        type: object
        required: [subject]
        properties:
          subject:
            type: string
    output:
      schema:
        type: object
        required: [summary]
        properties:
          summary:
            type: string

  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 4
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    work:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/long-runner@sha256:bbbbbb
      input:
        from: /run/input
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [summary]
              properties:
                summary:
                  type: string
      ledger:
        propose: [claim, result]
      policy:
        timeout: 30m
        retry:
          maxAttempts: 1
          backoff: none

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/work/output

  edges:
    - from: work.completed
      to: finish
