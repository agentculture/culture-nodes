{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "culture-nodes.fullname" . }}-api
  labels:
    {{- include "culture-nodes.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    # c42: this Ingress is the callback surface an external (outside-the-
    # cluster) actor uses — POST /v1/attempts/{id}/events, authenticated
    # by a short-lived attempt-scoped bearer token
    # (internal/actors/token.go), never by network identity or an
    # ingress-level auth annotation. It fronts the same api Service every
    # other nodes.culture.dev/v1alpha1 operation uses. Phase 1 puts
    # nothing else in front of it — see the trust-boundary WARNING in
    # NOTES.txt and README.md.
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "culture-nodes.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
{{- end -}}
