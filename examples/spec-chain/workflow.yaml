          backoff: exponential

    # The barrier. `all` because a challenge pass with three of four lenses
    # reported is not a challenge pass — it is a partial sweep wearing one's
    # clothes, and the adjudicating human would be deciding on an unstated
    # subset. A join node carries no contract; its `joined` outcome is
    # implied by the kind.
    challenge-join:
      kind: join
      ownerRef: team/platform-ai
      join:
        policy: all

    # -------------------------------------------------------------------
    # 9. RECORD THE FINDINGS. Deterministic again: the findings are captured
    # back onto the frame as PROPOSED content. This is the move that makes
    # the challenge pass part of the frame rather than a conversation about
    # it, and it is a code node for the same reason every other move here is.
    # -------------------------------------------------------------------
    record-findings:
      kind: code
      ownerRef: team/platform-ai
      uses: runner://headspace/devague-moves@sha256:5555555555555555555555555555555555555555555555555555555555555555
      input:
        bindings:
          frame: /nodes/converge-export/output
          run: /run/input
      operation:
        image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        environmentRefs:
          - SPEC_CHAIN_MOVE_URL
          - SPEC_CHAIN_MOVE_SHA256
        argv:
          - python3
          - -c
          - |
            import hashlib, os, sys, urllib.request
            names = ("SPEC_CHAIN_MOVE_URL", "SPEC_CHAIN_MOVE_SHA256")
            src, want = (os.environ.get(name, "").strip() for name in names)
            missing = [n for n, v in zip(names, (src, want)) if not v]
            if missing:
                sys.exit("spec-chain move: %s unset. The deployment grants the move "
                         "program's source and its sha256 -- see this workflow's "
                         "Deployment configuration block." % ", ".join(missing))
            body = urllib.request.urlopen(src, timeout=60).read()
            got = hashlib.sha256(body).hexdigest()
            if got != want.lower():
                sys.exit("spec-chain move: the configured source serves sha256:%s, not the "
                         "configured sha256:%s. Refusing to execute unverified code."
                         % (got, want.lower()))
            sys.argv = ["spec_chain_move.py"] + sys.argv[1:]
            exec(compile(body.decode(), "spec_chain_move.py", "exec"))
          - '{"moves": ["capture", "scope"], "origin": "llm", "export": "/workspace/frame.json"}'
        network: full
        allowedOutputPaths:
          - /workspace/frame.json
      contract:
        outcomes:
          passed:
            schema:
              type: object
              required: [operation_id, state, artifacts]
              properties:
                state:
                  type: string
                exit_code:
                  type: integer
                artifacts:
                  type: object
                  minProperties: 1
                  additionalProperties:
                    type: string
          failed:
            schema:
              type: object
              required: [operation_id, state]
              properties:
                state:
                  type: string
                exit_code:
                  type: integer
      ledger:
        read: [current_scope, confirmed_claims, open_questions]
        observe: [evidence]
      acceptance:
        requires:
          - kind: process_exit
            equals: 0
      policy:
        timeout: 10m
        retry:
          maxAttempts: 1

    # -------------------------------------------------------------------
    # 10. THE SECOND HUMAN GATE. A finding is a proposal about the spec, and
    # adopting one changes what the spec commits to — which is a judgement,
    # and the §10.4 authority model puts judgement here rather than in the
    # lens that produced the finding. It is a SEPARATE approval node from the
    # first with its own decision schema on purpose: confirming a proposed
    # claim set and adjudicating what a challenge pass turned up are
    # different acts, and the ledger has to be able to tell them apart
    # afterwards.
    # -------------------------------------------------------------------
    adjudicate-findings:
      kind: approval
      ownerRef: team/platform-ai
      approverRef: group/spec-approvers
      decisionSchemaRef: schema://spec-chain/challenge-adjudication/v1
      deadline: 168h
      input:
        bindings:
          frame: /nodes/record-findings/output
          adjacentSystems: /nodes/lens-adjacent-systems/output
          feedbackLoops: /nodes/lens-feedback-loops/output
          lifecycle: /nodes/lens-lifecycle/output
          security: /nodes/lens-security/output
          openQuestions: /ledger/projections/open_questions

    # -------------------------------------------------------------------
    # 11. RECONVERGE AND RE-EXPORT. A challenge pass reopens a converged
    # frame, so the frame has to converge again — against the same dated
    # file, with the adjudicated findings in it. Same exit-status contract as
    # converge-export, same three-answer decision node below it.
    # -------------------------------------------------------------------
    reconverge:
      kind: code
      ownerRef: team/platform-ai
      uses: runner://headspace/devague-moves@sha256:5555555555555555555555555555555555555555555555555555555555555555
      input:
        bindings:
          frame: /nodes/record-findings/output
          adjudication: /nodes/adjudicate-findings/output
          run: /run/input
      operation:
        image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        environmentRefs:
          - SPEC_CHAIN_MOVE_URL
          - SPEC_CHAIN_MOVE_SHA256
        argv:
          - python3
          - -c
          - |
            import hashlib, os, sys, urllib.request
            names = ("SPEC_CHAIN_MOVE_URL", "SPEC_CHAIN_MOVE_SHA256")
            src, want = (os.environ.get(name, "").strip() for name in names)
            missing = [n for n, v in zip(names, (src, want)) if not v]
            if missing:
                sys.exit("spec-chain move: %s unset. The deployment grants the move "
                         "program's source and its sha256 -- see this workflow's "
                         "Deployment configuration block." % ", ".join(missing))
            body = urllib.request.urlopen(src, timeout=60).read()
            got = hashlib.sha256(body).hexdigest()
            if got != want.lower():
                sys.exit("spec-chain move: the configured source serves sha256:%s, not the "
                         "configured sha256:%s. Refusing to execute unverified code."
                         % (got, want.lower()))
            sys.argv = ["spec_chain_move.py"] + sys.argv[1:]
            exec(compile(body.decode(), "spec_chain_move.py", "exec"))
          - '{"moves": ["converge", "export"], "export": "/workspace/frame.json"}'
        network: full
        allowedOutputPaths:
          - /workspace/frame.json
      contract:
        outcomes:
          passed:
            schema:
              type: object
              required: [operation_id, state, artifacts]
              properties:
                state:
                  type: string
                exit_code:
                  type: integer
                artifacts:
                  type: object
                  minProperties: 1
                  additionalProperties:
                    type: string
          failed:
            schema:
              type: object
              required: [operation_id, state]
              properties:
                state:
                  type: string
                exit_code:
                  type: integer
      ledger:
        read: [current_scope, confirmed_claims, open_assumptions, open_questions]
        observe: [evidence]
      acceptance:
        requires:
          - kind: process_exit
            equals: 0
      policy:
        timeout: 10m
        retry:
          maxAttempts: 1

    reconverge-verdict:
      kind: decision
      ownerRef: team/platform-ai
      input:
        from: /nodes/reconverge/output
      select:
        - outcome: converged
          when: "output.state == 'completed' && output.exit_code == 0"
        - outcome: not_converged
          when: "output.state == 'completed' && output.exit_code == 10"
        - outcome: move_unavailable
          when: "output.state == 'completed' && output.exit_code == 11"
        - outcome: move_broken
          when: "true"

    # -------------------------------------------------------------------
    # 12. THE THREE ENDINGS. Named separately because they are different
    # answers, and a reader of a finished run should not have to reconstruct
    # which one happened from a payload.
    # -------------------------------------------------------------------

    # The spec exported, after the challenge pass, with both gates passed.
    spec-exported:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/reconverge/output

    # A person declined — either the proposed set or the adjudication. The
    # output is the run input rather than a node's output because this node
    # is reachable from two different gates, and binding one of them would
    # fail to resolve on the other path.
    not-adopted:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /run/input

    # The chain could not run: a sweep with no surfaces, a move that could
    # not be applied, or a move program that broke. Distinct from
    # `not-adopted` because "nobody decided this was wrong" and "nobody could
    # decide at all" are different facts, and folding them together is the
    # same mistake `measurement_incomplete` exists to prevent one node down.
    chain-blocked:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /run/input

  edges:
    # --- scope -----------------------------------------------------------
    - from: scope-sweep.surveyed
      to: record-scope
    - from: scope-sweep.insufficient_context
      to: chain-blocked

    - from: record-scope.passed
      to: think-frame
    - from: record-scope.failed
      to: chain-blocked

    # --- think -----------------------------------------------------------
    - from: think-frame.framed
      to: interrogate

    - from: interrogate.interrogated
      to: record-frame

    - from: record-frame.passed
      to: confirm-proposed-set
    - from: record-frame.failed
      to: chain-blocked

    # --- the first human gate --------------------------------------------
    # `converge-export` is reachable from HERE AND NOWHERE ELSE, which is
    # what makes "the proposed set cannot converge without a person" a
    # compiler-checked property of the edges rather than a habit.
    - from: confirm-proposed-set.approved
      to: converge-export
    - from: confirm-proposed-set.rejected
      to: not-adopted

    # --- converge --------------------------------------------------------
    # Both of the code node's exit-status ports feed the verdict: `failed`
    # here is a DOMAIN answer, and the verdict tells "did not converge" from
    # "could not run" from "the program broke" by exit code.
    - from: converge-export.passed
      to: converge-verdict
    - from: converge-export.failed
      to: converge-verdict

    - from: converge-verdict.converged
      to: challenge-fan
    # A frame that did not converge is not a failure; it is the method
    # working. It loops back to interrogation, bounded by
    # spec.limits.maxVisitsPerNode rather than by anyone's judgement.
    - from: converge-verdict.not_converged
      to: interrogate
    - from: converge-verdict.move_unavailable
      to: chain-blocked
    - from: converge-verdict.move_broken
      to: chain-blocked

    # --- challenge -------------------------------------------------------
    # Four split edges, four branches, one barrier. The compiler refuses a
    # parallel node with no split edge, a join nothing reaches, and an end
    # node reachable from inside the split without passing the join.
    - from: challenge-fan.split
      to: lens-adjacent-systems
    - from: challenge-fan.split
      to: lens-feedback-loops
    - from: challenge-fan.split
      to: lens-lifecycle
    - from: challenge-fan.split
      to: lens-security

    # Both ports of every lens reach the barrier. A clean pass is an ANSWER,
    # not an absence: it carries the examined surfaces and the residual
    # uncertainty, and the adjudicating human needs it.
    - from: lens-adjacent-systems.findings
      to: challenge-join
    - from: lens-adjacent-systems.clean_pass
      to: challenge-join
    - from: lens-feedback-loops.findings
      to: challenge-join
    - from: lens-feedback-loops.clean_pass
      to: challenge-join
    - from: lens-lifecycle.findings
      to: challenge-join
    - from: lens-lifecycle.clean_pass
      to: challenge-join
    - from: lens-security.findings
      to: challenge-join
    - from: lens-security.clean_pass
      to: challenge-join

    - from: challenge-join.joined
      to: record-findings

    - from: record-findings.passed
      to: adjudicate-findings
    - from: record-findings.failed
      to: chain-blocked

    # --- the second human gate -------------------------------------------
    - from: adjudicate-findings.approved
      to: reconverge
    - from: adjudicate-findings.rejected
      to: not-adopted

    # --- reconverge ------------------------------------------------------
    - from: reconverge.passed
      to: reconverge-verdict
    - from: reconverge.failed
      to: reconverge-verdict

    - from: reconverge-verdict.converged
      to: spec-exported
    - from: reconverge-verdict.not_converged
      to: interrogate
    - from: reconverge-verdict.move_unavailable
      to: chain-blocked
    - from: reconverge-verdict.move_broken
      to: chain-blocked
