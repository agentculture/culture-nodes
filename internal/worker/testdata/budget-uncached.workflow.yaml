# Two agent turns under an uncached-input ceiling (task t11, spec claim c6).
#
# The budget bounds the input tokens a run sends that the provider did NOT
# demonstrably serve from cache. What makes the fixture interesting is that
# the SAME reported input can be affordable or unaffordable depending on the
# cache telemetry beside it: a turn that reports 200 input with 190 cached
# spends 10, and a turn that reports 200 input with no cached figure at all
# spends the whole 200, because a backend reporting no cache telemetry is not
# a backend with a 0% hit rate and the budget refuses to assume a discount it
# cannot see.
#
# No session bound is declared here: an unstated axis is unbounded, which is
# what keeps this fixture about one thing.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: worker-budget-uncached-slice
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: first

  contract:
    input:
      schema:
        type: object
        required: [subject]
        properties:
          subject:
            type: string
    output:
      schema:
        type: object
        required: [summary]
        properties:
          summary:
            type: string

  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 4
    maxParallelTokens: 1

  budget:
    maxUncachedInput: 150

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    first:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/analyzer@sha256:aaaaaa
      input:
        from: /run/input
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [summary]
              properties:
                summary:
                  type: string
      ledger:
        propose: [claim, result]
      policy:
        timeout: 2m
        retry:
          maxAttempts: 1
          backoff: none

    second:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/analyzer@sha256:aaaaaa
      input:
        from: /nodes/first/output
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [summary]
              properties:
                summary:
                  type: string
      ledger:
        propose: [claim, result]
      policy:
        timeout: 2m
        retry:
          maxAttempts: 1
          backoff: none

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/second/output

    stopped:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/first/output

  edges:
    - from: first.completed
      to: second

    - from: second.completed
      to: finish

    - from: second.budget_exhausted
      to: stopped
