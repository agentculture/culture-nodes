# A minimal trigger-bearing workflow (task t15, spec c31/h16): one agent
# entry node that dispatches a work item and stays open, so a test can
# deliver a second matching event while the run it created is still active
# without having to complete it first.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: engine-trigger-subject
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: work

  contract:
    input:
      schema:
        type: object
    output:
      schema:
        type: object

  triggers:
    - onEvent: test.subject-event

  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 4
    maxParallelTokens: 1

  nodes:
    work:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/worker@sha256:111111
      input:
        from: /run/input
      contract:
        outcomes:
          completed:
            schema:
              type: object
      policy:
        timeout: 1m
        retry:
          maxAttempts: 1
          backoff: none

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/work/output

  edges:
    - from: work.completed
      to: finish
