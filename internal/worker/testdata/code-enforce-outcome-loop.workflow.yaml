# Task t17 (issue #37): acceptance.enforce = route_outcome:<name> with a
# loop-back edge. The node pre-announces `workspace_diff complete: true`; when
# the measured diff says otherwise, the completion is re-routed to the
# declared `needs_fix` domain outcome — whose edge loops straight back to the
# node — and NOT retried by the engine (a domain answer is not an engine
# failure, PRD §3.4), even though a retry budget (maxAttempts: 2) is sitting
# right there to be wrongly used. The compiler guaranteed `needs_fix` is
# declared, so the transition follows a real edge; maxVisitsPerNode bounds
# the loop.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: worker-code-enforce-outcome-loop
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: test

  contract:
    input:
      schema:
        type: object
    output:
      schema:
        type: object

  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 3
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    test:
      kind: code
      ownerRef: team/developer-experience
      uses: runner://headspace/docker@sha256:5555555555555555555555555555555555555555555555555555555555555555
      operation:
        image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        argv: [python3, -c, "raise SystemExit(0)"]
        network: none
        allowedOutputPaths: []
      contract:
        outcomes:
          passed:
            schema:
              type: object
          needs_fix:
            schema:
              type: object
      ledger:
        observe: [evidence]
      acceptance:
        enforce: route_outcome:needs_fix
        requires:
          - kind: workspace_diff
            complete: true
      policy:
        timeout: 5m
        retry:
          maxAttempts: 2
          backoff: none

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/test/output

  edges:
    - from: test.passed
      to: finish
    - from: test.needs_fix
      to: test
