apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: edge-order
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: start

  contract:
    input:
      schemaRef: ./contracts/in.schema.json
    output:
      schemaRef: ./contracts/out.schema.json

  nodes:
    start:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/start@sha256:aaaaaa
      contract:
        outcomes:
          completed:
            schemaRef: ./contracts/start.schema.json
      input:
        from: /run/input

    middle:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/middle@sha256:bbbbbb
      contract:
        outcomes:
          completed:
            schemaRef: ./contracts/middle.schema.json
      input:
        from: /nodes/start/output

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/middle/output

  edges:
    - from: start.completed
      to: middle
    - from: start.failed
      to: finish
    - from: middle.completed
      to: finish
