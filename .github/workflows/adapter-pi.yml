name: Adapter / pi

# Tests adapters/pi — the pi-bridge, the sixth actor-protocol adapter
# (issue #294, task t8). Like adapter-claude-code.yml this is a NEW, dedicated
# workflow: adapters/pi is its own uv project (its own pyproject.toml +
# uv.lock), separate from the root culture-nodes package tests.yml covers.
#
# Every step here runs against the FAKE pi CLI
# (adapters/pi/tests/fake_pi.py) — never a real, billed, network-dependent
# `pi` install, and never the thor/orin gateway model. The pi harness has no
# offline mock mode of its own, so the fake replays recorded event fixtures
# exactly the way adapter-claude-code.yml drives tests/fake_claude.py.

on:
  pull_request:
    branches: [main]
    paths:
      - "adapters/pi/**"
      - "tests/conformance/**"
      - "internal/actors/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/adapter-pi.yml"
  push:
    branches: [main]
    paths:
      - "adapters/pi/**"
      - "tests/conformance/**"
      - "internal/actors/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/adapter-pi.yml"

defaults:
  run:
    working-directory: adapters/pi

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync

      - run: uv run pytest -v

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync

      # Issue #123 / #294 (frame decision c33). The in-adapter-directory form,
      # like adapter-claude-code.yml: run from THIS adapter's directory so its
      # own black/isort/flake8 config applies (`src tests`, not adapter-prefixed
      # paths). scripts/lint-all.sh carries both forms verbatim and cd's itself,
      # so this step opts out of the job's defaults.run.working-directory rather
      # than reaching up with `../..`.
      - name: lint (adapters/pi) — scripts/lint-all.sh adapter-pi
        working-directory: ${{ github.workspace }}
        run: scripts/lint-all.sh adapter-pi

  conformance:
    # The PRD §13 conformance kit (tests/conformance) is a Go module rooted at
    # the repo top, so this job needs the Go toolchain and does not inherit the
    # `defaults.run.working-directory` above.
    #
    # Two checks run here (task t3, issue #297):
    #   1. the kit's always-on reference check (no -endpoint: an in-process
    #      §13-correct reference actor, installing NO pi binary and making no
    #      network call) — proves the kit itself compiles and the protocol
    #      reference holds, independent of this adapter.
    #   2. the LIVE fake-backed run, via
    #      adapters/pi/scripts/run_conformance_kit.sh: a real pi-bridge process
    #      started in-process (start_background) on an ephemeral port, with
    #      `pi_bin` pointed at the FAKE pi CLI (adapters/pi/tests/fake_pi.py,
    #      replaying one static event fixture), driven over real HTTP with the
    #      SAME -input/-async-input/-bad-input JSON adapter-qwen.yml's live run
    #      uses (modulo the scratch repo path) — the deterministic harness-swap
    #      proof (was DEFERRED here pending this task; see the script's own
    #      docstring for why one static fixture is enough for every check the
    #      kit runs).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - name: conformance reference check (no real pi, no network)
        working-directory: ${{ github.workspace }}
        run: go test ./tests/conformance

      - name: conformance kit against the live fake-backed pi-bridge
        working-directory: ${{ github.workspace }}
        run: ./adapters/pi/scripts/run_conformance_kit.sh
