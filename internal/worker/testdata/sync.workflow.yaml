# The three-node slice the worker's end-to-end test drives: a synchronous
# agent, an in-process decision, and an end node that produces the run result.
#
# It is the smallest workflow that exercises every dispatch path this task
# owns — an actor invocation over real HTTP, an input binding that reads a
# previous node's output, a decision evaluated in the worker process, and a
# transition into an end node the engine completes itself.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: worker-sync-slice
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: analyze

  contract:
    input:
      schema:
        type: object
        required: [subject]
        properties:
          subject:
            type: string
    output:
      schema:
        type: object
        required: [score]
        properties:
          score:
            type: number
          summary:
            type: string

  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 4
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    analyze:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/analyzer@sha256:aaaaaa
      input:
        from: /run/input
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: number
                summary:
                  type: string
      ledger:
        propose: [claim, result]
      policy:
        timeout: 2m
        retry:
          maxAttempts: 1
          backoff: none

    # A decision node routes on data the run already holds. Its ports are
    # evaluated in order and the first match wins; `output` is the payload the
    # node's own input binding resolved to (see internal/worker/decision.go).
    route:
      kind: decision
      ownerRef: team/platform-ai
      input:
        from: /nodes/analyze/output
      select:
        - outcome: ship
          when: output.score >= 0.8
        - outcome: hold
          when: "true"

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/analyze/output

  edges:
    - from: analyze.completed
      to: route

    - from: route.ship
      to: finish

    - from: route.hold
      to: finish
