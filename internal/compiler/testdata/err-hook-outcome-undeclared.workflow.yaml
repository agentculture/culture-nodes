apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: hook-outcome-undeclared
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: work

  contract:
    input:
      schemaRef: ./contracts/in.schema.json
    output:
      schemaRef: ./contracts/out.schema.json

  nodes:
    work:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/worker@sha256:aaaaaa
      contract:
        outcomes:
          completed:
            schemaRef: ./contracts/start.schema.json
      input:
        from: /run/input
      post_run:
        operation:
          image: registry.example/verify@sha256:888888
          argv: [verify]
        on_failure:
          outcome: changes_required

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/work/output

  edges:
    - from: work.completed
      to: finish
