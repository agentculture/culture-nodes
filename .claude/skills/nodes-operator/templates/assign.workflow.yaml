# Single-node assignment workflow, rendered by the nodes-operator skill's
# `assign` verb. Placeholders (__NAME__, __ACTOR_REF__, __TIMEOUT__,
# __MAX_ATTEMPTS__) are substituted at render time; everything else mirrors
# the proven examples/codex-smoke-pair/smoke.workflow.yaml shape — actor
# digest suffixes are revision markers, not resolvable content
# (internal/worker/registry.go strips them at lookup).
#
# The instruction, repo, sandbox, and success outcome all arrive as run
# input, so ONE published digest serves every assignment to the same actor
# with the same timeout — the engine pins the workflow by digest, and
# re-publishing an identical render is a no-op returning the same digest.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: __NAME__
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: task

  contract:
    input:
      schema:
        type: object
        required: [instruction, sandbox, success_outcome, repo]
        properties:
          instruction:
            type: string
          sandbox:
            type: string
          success_outcome:
            type: string
          repo:
            type: string
    output:
      schema:
        type: object

  limits:
    maxDuration: 2h
    maxTransitions: 6
    maxVisitsPerNode: 2
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    task:
      kind: agent
      ownerRef: team/platform-ai
      uses: __ACTOR_REF__
      input:
        bindings:
          instruction: /run/input/instruction
          repo: /run/input/repo
          sandbox: /run/input/sandbox
          success_outcome: /run/input/success_outcome
      contract:
        input:
          schema:
            type: object
            required: [instruction, repo]
        outcomes:
          __OUTCOME__:
            schema:
              type: object
              required: [summary]
              properties:
                summary:
                  type: string
      ledger:
        propose: [claim]
      policy:
        timeout: __TIMEOUT__
        retry:
          # Assignments are billable agent sessions: a silent retry doubles
          # real spend, so the default is one attempt — investigated, not
          # auto-retried. `assign --retries N` raises it deliberately.
          maxAttempts: __MAX_ATTEMPTS__
          backoff: none

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/task/output

  edges:
    - from: task.__OUTCOME__
      to: finish
