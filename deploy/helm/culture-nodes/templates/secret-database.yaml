{{- /*
The in-chart Postgres password is computed exactly ONCE here, as a plain
Go-template variable, and threaded into both keys below. This is
deliberate, not incidental: culture-nodes.postgresPassword's random
fallback (templates/_helpers.tpl) calls Sprig's randAlphaNum, which is
freshly re-evaluated on every `include` -- calling that helper from two
separate template files (this one, and a separate postgres-only Secret)
would silently mint two DIFFERENT passwords in the same install, so
Postgres would come up with one password while NODES_DATABASE_URL carried
the other. This chart used to do exactly that, and it was only caught by
actually running `helm install` against a live kind cluster (the migration
Job failed every retry with an auth error) -- `helm template`/`helm lint`
alone render both independently-random values as syntactically valid
strings and cannot catch the mismatch. One Secret, one computed value,
used twice, is the fix.
*/ -}}
{{- $postgresPassword := "" -}}
{{- if .Values.postgresql.enabled -}}
{{- $postgresPassword = include "culture-nodes.postgresPassword" . -}}
{{- end -}}
# The Secret-ref env pattern (PRD-aligned "Secret-ref env config"): every
# Deployment and the migration Job read NODES_DATABASE_URL out of this one
# Secret via env.valueFrom.secretKeyRef, whether it points at the in-chart
# Postgres StatefulSet or an externally supplied instance
# (values.postgresql.external.url) — the pod specs never carry a database
# URL, or a password, in plaintext. When postgresql.enabled, this Secret
# also carries POSTGRES_PASSWORD, which templates/postgres/statefulset.yaml
# reads back from here (not a second, separately-generated Secret) — see
# the comment above for why that matters.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "culture-nodes.fullname" . }}-db
  labels:
    {{- include "culture-nodes.labels" . | nindent 4 }}
  annotations:
    # Same tier as templates/postgres/*.yaml (weight "-5"): the migration
    # Job (a pre-install/pre-upgrade hook itself, weight "0") mounts this
    # Secret, and a pre-install hook only sees resources that are
    # themselves hooks at an earlier weight — a plain resource is not
    # created until every hook has already succeeded. See
    # migration-job.yaml's doc comment for the full ordering argument.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  NODES_DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgresql.auth.username $postgresPassword (include "culture-nodes.fullname" .) .Values.postgresql.auth.database | quote }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  {{- else }}
  NODES_DATABASE_URL: {{ required "postgresql.external.url is required when postgresql.enabled is false" .Values.postgresql.external.url | quote }}
  {{- end }}
