name: Adapter / qwen

# Tests adapters/qwen — the qwen-bridge, Qwen Code over ACP (qwen --acp,
# stdio JSON-RPC). This is the dedicated workflow qwen's own t6 (Dockerfile +
# CI + conformance) left undelivered, landing now alongside the pi adapter
# (issue #294, task t8). Like adapter-claude-code.yml and adapter-pi.yml,
# adapters/qwen is its own uv project (its own pyproject.toml + uv.lock),
# separate from the root culture-nodes package tests.yml covers.
#
# Every step here runs against the FAKE qwen engine
# (adapters/qwen/tests/_fakes.py) — never a real, billed, network-dependent
# `qwen` install, and never the thor/orin gateway model.

on:
  pull_request:
    branches: [main]
    paths:
      - "adapters/qwen/**"
      - "tests/conformance/**"
      - "internal/actors/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/adapter-qwen.yml"
  push:
    branches: [main]
    paths:
      - "adapters/qwen/**"
      - "tests/conformance/**"
      - "internal/actors/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/adapter-qwen.yml"

defaults:
  run:
    working-directory: adapters/qwen

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync

      - run: uv run pytest -v

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync

      # Issue #123 / #294 (frame decision c33). The in-adapter-directory form,
      # like adapter-claude-code.yml: run from THIS adapter's directory so its
      # own black/isort/flake8 config applies (`src tests`, not adapter-prefixed
      # paths). scripts/lint-all.sh carries both forms verbatim and cd's itself,
      # so this step opts out of the job's defaults.run.working-directory rather
      # than reaching up with `../..`.
      - name: lint (adapters/qwen) — scripts/lint-all.sh adapter-qwen
        working-directory: ${{ github.workspace }}
        run: scripts/lint-all.sh adapter-qwen

  conformance:
    # The PRD §13 conformance kit (tests/conformance) is a Go module rooted at
    # the repo top, so this job needs the Go toolchain and does not inherit the
    # `defaults.run.working-directory` above.
    #
    # Two checks run here (task t3, issue #297):
    #   1. the kit's always-on reference check (no -endpoint: an in-process
    #      §13-correct reference actor, installing NO qwen binary and making no
    #      network call) — proves the kit itself compiles and the protocol
    #      reference holds, independent of this adapter.
    #   2. the LIVE fake-backed run, via
    #      adapters/qwen/scripts/run_conformance_kit.sh: a real qwen-bridge
    #      process started in-process (start_background) on an ephemeral port,
    #      with `qwen_bin` pointed at the FAKE ACP agent
    #      (adapters/qwen/tests/fixtures/acp/fake_acp_agent.py,
    #      FAKE_ACP_BEHAVIOR=ok), driven over real HTTP with the SAME
    #      -input/-async-input/-bad-input JSON adapter-pi.yml's live run uses
    #      (modulo the scratch repo path, and this bridge's own required
    #      `mode` field, which the pi bridge tolerates as a harmless extra) —
    #      the deterministic harness-swap proof (was DEFERRED here pending
    #      this task; see the script's own docstring for why one static
    #      fixture is enough for every check the kit runs).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - name: conformance reference check (no real qwen, no network)
        working-directory: ${{ github.workspace }}
        run: go test ./tests/conformance

      - name: conformance kit against the live fake-backed qwen-bridge
        working-directory: ${{ github.workspace }}
        run: ./adapters/qwen/scripts/run_conformance_kit.sh
