# Culture Nodes reference workflow — the delivery loop.
#
# This is PRD §11.1's authoring example, made executable: intake → plan →
# build → test → verify, with `test.failed` and `verify.changes_required` both
# looping back to build and `verify.blocked` routing to a human-review
# approval node. It is the workflow tests/e2e/slice_test.go and
# tests/e2e/humanreview_test.go drive end to end against a real PostgreSQL, a
# real engine, a real worker, and a real runner, and it is the workflow
# `nodes validate` is expected to compile with zero diagnostics.
#
# The human-review branch was absent from this file for one cycle. While the
# human-task surface was deferred (deviation d1, github issue #3) a run
# reaching an approval node would have failed with a `not_implemented`
# diagnostic, so `verify` declared only `passed` and `changes_required` and
# this comment's first recorded difference read "NO APPROVAL NODE". That
# surface shipped — the engine parks an approval node's token by writing a
# human_tasks row and never enqueuing work, the decision endpoint resumes it
# under human authority, and the worker provably never observes approval work
# — so `blocked`, the `human-review` node, and its two decision edges are
# restored here as §11.1 authored them, and tests/e2e/humanreview_test.go
# walks the branch end to end.
#
# Three deliberate differences from the PRD's §11.1 listing, each recorded
# rather than quietly absorbed:
#
#  1. The `human-review` node binds `/nodes/verify/output` as its input, which
#     §11.1's listing leaves off. PRD §9.9 requires a human task to carry
#     "exact context and artifact references", and an approver handed a task
#     with no pointer to the blocker they are ruling on has been given a
#     decision without its subject. The binding is carried into the task as a
#     reference, not resolved into a payload (see internal/engine's
#     humanTaskContext), so this adds context without adding engine work.
#
#  2. The `verify` node binds `/ledger/projections/evidence` where §11.1 binds
#     `/nodes/test/evidence`. The per-node evidence surface is not resolvable
#     by internal/worker's binding resolver (see its doc comment); the ledger
#     projection is, and it selects exactly the run's evidence records —
#     including the runner-observed record the `test` node just appended.
#
#  3. Contracts are inline JSON Schema rather than `schemaRef` files. A
#     schemaRef is left unresolved by the compiler (resolving one needs a
#     source root, PRD §11.4), so an inline schema is the version that
#     actually gets enforced at runtime — which is the point of a reference.
#
# The `test` node is a real code node: its operation is a pinned, digest-
# addressed image and an argv array, dispatched through the runner boundary
# (PRD §13.7). The default e2e run executes it through a scripted fake Runner;
# the `e2elive` variant executes this same operation through the real
# headspace-cli Docker bridge.
#
# Deployment configuration (task t16) — what this graph needs from outside
# it, and where each value comes from:
#
#   RUN INPUT (the run's input document; examples/delivery-loop/input.json
#   is a complete one):
#     request      the work to deliver, authored per run.
#     repository   which repository it concerns. A plain identifier the
#                  actors interpret, not a path on any particular host.
#
#   ACTOR / RUNNER REGISTRY (an id in `uses:`, resolved by
#   internal/worker/registry.go against this deployment's actors table with
#   the @sha256 revision suffix stripped -- register the SAME ids against
#   your own endpoints):
#     actor://company/intake       the intake node.
#     actor://company/planner      the planning node.
#     actor://company/developer    the build node.
#     actor://company/verifier     the verification node.
#     runner://headspace/docker    the runner boundary the `test` code node
#                                  dispatches through; WHERE that runner is
#                                  lives in the deployment's runner services
#                                  file (see examples/placement-proof).
#
#   The `human-review` approval node places on no actor at all: the engine
#   parks its token by writing a human_tasks row, and a person resumes it
#   through the decision endpoint. There is nothing to register for it.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: delivery-loop
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: intake

  contract:
    input:
      schema:
        type: object
        required: [request]
        additionalProperties: false
        properties:
          request:
            type: string
            minLength: 1
          repository:
            type: string
    output:
      schema:
        type: object
        required: [verdict]
        properties:
          verdict:
            type: string

  # PRD §9.7: every loop is bounded by the engine, not by an agent deciding
  # when to stop. maxVisitsPerNode is 4 so `build` can legitimately be revisited
  # by both loop edges (test.failed and verify.changes_required) before the
  # bound stops the run.
  limits:
    maxDuration: 2h
    maxTransitions: 32
    maxVisitsPerNode: 4
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 100

  nodes:
    # Intake proposes scope, claims, assumptions, and questions. Everything it
    # writes is `proposed`: an agent may not confirm its own work (PRD §10.4).
    intake:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/intake@sha256:1111111111111111111111111111111111111111111111111111111111111111
      input:
        from: /run/input
      contract:
        input:
          schema:
            type: object
            required: [request]
        outcomes:
          completed:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  type: string
      ledger:
        read: [current_scope]
        propose: [announcement, claim, assumption, question]
      policy:
        timeout: 5m
        retry:
          maxAttempts: 2
          backoff: exponential

    # Plan proposes tasks and the mechanical success signals that will decide
    # whether they are done.
    plan:
      kind: agent
      ownerRef: team/architecture
      uses: actor://company/planner@sha256:2222222222222222222222222222222222222222222222222222222222222222
      input:
        from: /nodes/intake/output
      contract:
        input:
          schema:
            type: object
            required: [scope]
        outcomes:
          completed:
            schema:
              type: object
              required: [tasks]
              properties:
                tasks:
                  type: array
                  items:
                    type: object
      ledger:
        read: [current_scope, confirmed_claims, open_assumptions]
        propose: [task, decision, success_signal]
      policy:
        timeout: 15m
        retry:
          maxAttempts: 2

    # Build claims a task and proposes a result. On the second pass it reads
    # the verification queue, which is how it learns what the verifier asked
    # for — the loop carries state through the ledger, not through a variable.
    build:
      kind: agent
      ownerRef: team/developer-experience
      uses: actor://company/developer@sha256:3333333333333333333333333333333333333333333333333333333333333333
      input:
        bindings:
          request: /run/input
          readyTasks: /ledger/projections/ready_tasks
          priorVerification: /ledger/projections/verification_queue
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [changeSet]
              properties:
                changeSet:
                  type: object
      ledger:
        read: [current_scope, confirmed_claims, ready_tasks, decision_history]
        propose: [claim, result]
      policy:
        timeout: 45m
        retry:
          maxAttempts: 2

    # The code node. Exit 0 routes `passed`; a nonzero exit routes `failed` —
    # a DOMAIN outcome that follows the loop edge back to build, never an
    # engine failure (PRD §3.4). `ledger.observe: [evidence]` is what lets the
    # runner's own measured observations be appended with `observed` authority
    # inside the same transaction as the transition they justify; only a code
    # node may declare it (PRD §10.4).
    test:
      kind: code
      ownerRef: team/developer-experience
      uses: runner://headspace/docker@sha256:5555555555555555555555555555555555555555555555555555555555555555
      operation:
        image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        argv: [python3, -c, "import sys; print('delivery-loop test suite'); sys.exit(0)"]
        network: none
        allowedOutputPaths: []
      contract:
        outcomes:
          passed:
            schema:
              type: object
              required: [operation_id, state]
              properties:
                state:
                  type: string
          failed:
            schema:
              type: object
              required: [operation_id, state]
              properties:
                state:
                  type: string
      ledger:
        read: [active_tasks]
        observe: [evidence]
      acceptance:
        requires:
          - kind: process_exit
            equals: 0
      policy:
        timeout: 15m
        retry:
          maxAttempts: 1

    # Verify reads the change set and the run's evidence and returns a domain
    # verdict. `changes_required` is an answer, not a fault: it follows an edge
    # back to build with the verifier's own record left in the ledger.
    verify:
      kind: agent
      ownerRef: team/quality-platform
      uses: actor://company/verifier@sha256:4444444444444444444444444444444444444444444444444444444444444444
      input:
        bindings:
          changeSet: /nodes/build/output
          testEvidence: /ledger/projections/evidence
          queue: /ledger/projections/verification_queue
      contract:
        outcomes:
          passed:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict:
                  type: string
          changes_required:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict:
                  type: string
          # A blocker is a third domain answer, and the only one the verifier
          # is not entitled to act on alone: it routes to a person.
          blocked:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict:
                  type: string
      ledger:
        read: [current_scope, active_tasks, verification_queue]
        propose: [claim, result, question]
      policy:
        timeout: 20m
        retry:
          maxAttempts: 2

    # The approval node (PRD §9.9). A token arriving here creates a human task
    # — decision schema, approver group, deadline, context references, audit
    # identity, allowed outcomes — and the run PAUSES: no work item is
    # enqueued for it, so no worker can claim it and no lease or transaction is
    # held while it waits. It resumes only when a person answers through
    # POST /v1alpha1/human-tasks/{id}/decision, and the outcome they select
    # routes the edge: `approved` sends the work back to build, `rejected`
    # ends the run. `expired` is the third implied port (PRD §9.2) and, as in
    # §11.1's own listing, is left unrouted: a decision nobody made has no
    # edge to follow, and a run that reaches it stops with a diagnostic rather
    # than picking a branch on the approver's behalf.
    human-review:
      kind: approval
      ownerRef: team/platform-ai
      decisionSchemaRef: ./contracts/review-decision.schema.json
      approverRef: group/platform-ai-approvers
      deadline: 24h
      input:
        from: /nodes/verify/output

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/verify/output

  edges:
    - from: intake.completed
      to: plan

    - from: plan.completed
      to: build

    - from: build.completed
      to: test

    - from: test.passed
      to: verify

    # A failing test suite is a domain answer that loops, bounded by
    # spec.limits.maxVisitsPerNode.
    - from: test.failed
      to: build

    - from: verify.passed
      to: finish

    - from: verify.changes_required
      to: build

    # A blocker is a domain answer too — it just is not the verifier's to
    # resolve. The token parks on the approval node until a person decides.
    - from: verify.blocked
      to: human-review

    - from: human-review.approved
      to: build

    - from: human-review.rejected
      to: finish
