# The placement-free proof workflow (plan t22, honesty condition h11).
#
# One code node, pinned to the real headspace python3.12 image digest. The
# SAME published digest runs twice in production: once with the registry
# entry "placement-proof/probe" pointing at spark's runner service, once at
# thor's — zero changes to this file between the runs. Placement lives in
# the deployment's NODES_RUNNER_SERVICES_FILE, never in the workflow.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: placement-proof
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: probe

  contract:
    input:
      schema:
        type: object
    output:
      schema:
        type: object

  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 3
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    probe:
      kind: code
      ownerRef: team/developer-experience
      uses: runner://headspace/docker@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
      operation:
        image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        argv: [python3, -c, "import platform; print('placement-proof ran on', platform.node()); raise SystemExit(0)"]
        network: none
        allowedOutputPaths: []
      contract:
        outcomes:
          passed:
            schema:
              type: object
          failed:
            schema:
              type: object
      ledger:
        observe: [evidence]
      acceptance:
        requires:
          - kind: process_exit
            equals: 0
      policy:
        timeout: 5m
        retry:
          maxAttempts: 1

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/probe/output

    giveup:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/probe/output

  edges:
    - from: probe.passed
      to: finish
    - from: probe.failed
      to: giveup
