[project]
name = "culture-nodes-claude-code-bridge"
version = "0.1.0"
description = "Reference actor-protocol bridge: dispatches Culture Nodes invocations to a headless `claude` (Claude Code CLI) subprocess. Runs OUTSIDE the culture-nodes deployment, beside a claude-code install."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
# Stdlib-only runtime deps (mirrors adapters/colleague's h13/c15 reference
# constraint): the bridge talks HTTP via http.server/urllib and shells out to
# the `claude` binary via subprocess — nothing here may grow a PyPI
# dependency graph a bridge host has to reconcile with its own claude-code
# install (npm/native binary, not a Python package).
dependencies = []

[project.urls]
Homepage = "https://github.com/agentculture/culture-nodes"
Issues = "https://github.com/agentculture/culture-nodes/issues"

[project.scripts]
claude-code-bridge = "claude_code_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_code_bridge"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["claude_code_bridge"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
