[project]
name = "culture-nodes-human-inbox-bridge"
version = "0.2.0"
description = "Reference actor-protocol bridge for kind=human actors: parks Culture Nodes invocations as durable inbox tasks and completes them through the standard authenticated callback when a human submits a result. Runs OUTSIDE the culture-nodes deployment."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
# Stdlib-only runtime deps (mirrors adapters/colleague and
# adapters/claude-code's h13/c15 reference constraint): the bridge talks
# HTTP via http.server/urllib and persists tasks as JSON files — nothing
# here may grow a PyPI dependency graph.
dependencies = []

[project.urls]
Homepage = "https://github.com/agentculture/culture-nodes"
Issues = "https://github.com/agentculture/culture-nodes/issues"

[project.scripts]
human-inbox-bridge = "human_inbox_bridge.__main__:main"
# The tracker gets a console script for the same reason the bridge has one:
# `uv tool install` can then copy both into a standalone venv, so the systemd
# units do not exec out of a git checkout whose branch nobody controls.
human-inbox-tracker = "human_inbox_bridge.tracker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/human_inbox_bridge"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["human_inbox_bridge"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
