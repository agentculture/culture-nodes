# The async+post_run refusal slice (task t14): an agent node that declares
# post_run but whose actor answers asynchronously (202). This build has no
# way to run a post-run hook against a result that arrives later through the
# callback path (see internal/worker/hooks.go's package doc), so the async
# acceptance must be refused outright rather than silently skipping the
# hook.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: worker-hooks-async-postrun
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: work

  contract:
    input:
      schema:
        type: object
        required: [subject]
        properties:
          subject:
            type: string
    output:
      schema:
        type: object

  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 4
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    work:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/hookworker@sha256:cccccc
      input:
        from: /run/input
      contract:
        outcomes:
          completed:
            schema:
              type: object
      ledger:
        propose: [claim, result]
      policy:
        timeout: 2m
        retry:
          maxAttempts: 1
          backoff: none
      post_run:
        operation:
          image: registry.example/verify@sha256:4444444444444444444444444444444444444444444444444444444444444444
          argv: [verify]
        on_failure:
          outcome: completed

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/work/output

  edges:
    - from: work.completed
      to: finish
