# Two agent turns under a one-session budget with NOWHERE to land (task t11).
#
# The author declared a budget and no route for being refused by it. The run
# ends failed, naming the budget in the attempt's diagnostic -- which is the
# honest outcome: money not spent, and a record of the decision. What must
# never happen is the silent alternative the dispatch budget's own header
# warns about (internal/worker/budget.go): a work item stranded 'ready'
# forever with nothing anywhere recording why.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: worker-budget-unrouted-slice
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: first

  contract:
    input:
      schema:
        type: object
        required: [subject]
        properties:
          subject:
            type: string
    output:
      schema:
        type: object
        required: [summary]
        properties:
          summary:
            type: string

  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 4
    maxParallelTokens: 1

  budget:
    maxSessions: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    first:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/analyzer@sha256:aaaaaa
      input:
        from: /run/input
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [summary]
              properties:
                summary:
                  type: string
      ledger:
        propose: [claim, result]
      policy:
        timeout: 2m
        retry:
          maxAttempts: 1
          backoff: none

    second:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/analyzer@sha256:aaaaaa
      input:
        from: /nodes/first/output
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [summary]
              properties:
                summary:
                  type: string
      ledger:
        propose: [claim, result]
      policy:
        timeout: 2m
        retry:
          maxAttempts: 1
          backoff: none

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/second/output

  edges:
    - from: first.completed
      to: second

    - from: second.completed
      to: finish
