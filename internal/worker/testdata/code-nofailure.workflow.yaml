# code.workflow.yaml's other half: a code node that declares NO domain
# outcome for a failing run. PRD §3.4's rule cuts both ways — a node with no
# domain answer for a nonzero exit gets one technical failure, governed by the
# engine's retry policy, rather than a fabricated outcome nobody declared.
#
# maxAttempts is 2 so the retry path is exercised before the run fails.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: worker-code-nofailure-slice
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: test

  contract:
    input:
      schema:
        type: object
    output:
      schema:
        type: object

  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 3
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    test:
      kind: code
      ownerRef: team/developer-experience
      uses: runner://headspace/docker@sha256:5555555555555555555555555555555555555555555555555555555555555555
      operation:
        image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        argv: [python3, -c, "raise SystemExit(0)"]
        network: none
        allowedOutputPaths: []
      contract:
        outcomes:
          passed:
            schema:
              type: object
      ledger:
        observe: [evidence]
      policy:
        timeout: 5m
        retry:
          maxAttempts: 2
          backoff: none

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/test/output

  edges:
    - from: test.passed
      to: finish
