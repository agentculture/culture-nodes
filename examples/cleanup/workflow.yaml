# The CLEANUP node (plan loop-closure t13; spec c6/c15/c37, honesty h15/h9/
# h24): the smallest possible graph -- one code node through the runner
# boundary -- that closes a work item's loose ends once its pull request is
# merged (`pr.merged`) or closed without merge (`pr.closed`).
#
# Measured before this existed (spec "Before", 2026-09-05/07): PR #307 left 8
# review-fix branches and 26 parked approval runs behind after its merge, all
# removed by hand. This node is the removal, keyed by the work item so the
# record of what it removed joins the item's other records.
#
# What the node does, and what it deliberately does not:
#
#   * lists `refs/heads/review-fix/*` and `refs/culture-nodes/*` refs on the
#     remote and attributes them to the item through its run ids (GET
#     /v1alpha1/runs?work_item=KEY, task t1): a preserve branch is minted from
#     the run id and a handover ref lives under refs/culture-nodes/<run-id>/;
#   * deletes ONLY refs whose commits are reachable from the default branch
#     (`git merge-base --is-ancestor`). An unreachable ref is the only copy of
#     that work; it is reported as `declined: unreachable` and never deleted.
#     On a pr.closed fact nothing was merged, so every ref is declined -- the
#     record still lists them (h24);
#   * cancels the item's runs still parked at the approval node through
#     POST /v1alpha1/runs/{id}/cancel with a machine-readable reason
#     (`pr_merged` | `pr_closed`, internal/api/cancelreason.go), so the
#     run.cancelled event names the fact rather than an operator;
#   * drops per-item sweep state -- there is none outside the control plane's
#     signal watermark rows, and the record says so instead of claiming a drop;
#   * writes ONE derived-shaped record as a single JSON line on stdout,
#     listing every deletion, declined ref, cancelled run and failure. The
#     runner stores the stdout as the attempt's artifact and references it
#     from the observed evidence record it appends (`ledger.observe`).
#
# Two triggers, one graph: trigger matching is exact per event name
# (internal/engine/trigger.go), so `pr.merged` and `pr.closed` each need their
# own handler, and both route to the same node. The payload is the run input
# verbatim; the input contract admits both shapes (pr.merged carries
# `merged_at` + `issue_key`, pr.closed carries `closed_at` + `work_item`).
# The node derives the reason from which timestamp is present.
#
# Operator worktrees under a laptop's ../.worktrees.culture-nodes are OUT of
# scope: not a control-plane host, not this node's to touch.
#
# ---------------------------------------------------------------------------
# STAGE WRITE-BACK (issue #311, decision c9; plan loop-closure task t17)
# ---------------------------------------------------------------------------
# This graph writes the last two stages of the loop's stage vocabulary
# ({intake, spec, dispatch, pr-open, merged, cleanup}, defined once in
# examples/pr-upkeep/pr_upkeep_jira.py `STAGES`) to the ticket, through the
# jira actor's post_comment verb -- never from the sweep, which has no Jira
# write path by design. Each comment's first line is machine-readable
# (`culture-nodes:stage=<stage>`) and the sweep reads the newest such line on
# a ticket as its stage WATERMARK: a tick whose lifecycle fact is already
# recorded there emits nothing for it (pr_upkeep_jira.stage_already_recorded).
#
#   `merged`  posted BEFORE the cleanup node, on a pr.merged fact only: the
#             work item's pull request landed. Nothing is claimed about the
#             loose ends yet, because they have not been touched.
#   `cleanup` posted AFTER the code node passed, on both facts: the refs,
#             parked runs and per-item state are settled and the derived
#             record lists exactly what happened to each.
#
# Two nodes post `cleanup` and not one, because a binding is a pointer and the
# two facts name the work item in DIFFERENT fields: pr.merged carries the
# correlated Jira key as `issue_key` (a merged PR with no ticket produces no
# fact at all, pr_upkeep_emit.merged_pr_fact), while pr.closed carries
# `work_item`, which may be the transient `gh:` form. `has(input.issue_key)`
# is therefore exactly "this is the merged fact", and a `gh:`-shaped work item
# has no ticket to comment on, so its run ends silently at `cleaned` -- the
# cleanup still happened and its record still says so.
#
# ---------------------------------------------------------------------------
# Deployment configuration — WHAT THIS GRAPH NEEDS FROM OUTSIDE THE FILE
# ---------------------------------------------------------------------------
#
#   RUNNER REGISTRY (id in `uses:`):
#     runner://headspace/cleanup         a runner service on a host whose
#                                        image profile carries git and whose
#                                        env carries the grants below.
#
#   ACTOR REGISTRY (id in `uses:`):
#     actor://company/jira-comment       the same narrow Jira bridge
#                                        examples/jira-intake and
#                                        examples/pr-upkeep drive. Only its
#                                        post_comment verb is used here; the
#                                        stage comments need no widening of
#                                        its allowlist.
#
#   CLEANUP_SOURCE_URL                   where cleanup.py is fetched from
#                                        (deploy.sh stamps it, as it does the
#                                        sweep's).
#   CLEANUP_SOURCE_SHA256                the digest the bootstrap refuses to
#                                        run without.
#   CLEANUP_REMOTE                       the git remote whose refs are cleaned;
#                                        empty means https://github.com/<repository>.git
#                                        built from the fact. Never taken from
#                                        the fact itself beyond the repository
#                                        slug (internal/handover's rule: a
#                                        session must not choose the remote).
#   CLEANUP_DEFAULT_BRANCH               the reachability root (default main).
#   CLEANUP_PARKED_NODE                  the approval node id whose parked
#                                        runs are cancelled (default
#                                        human-merges-pr, examples/pr-upkeep).
#   GITHUB_TOKEN_WORKER                  the push credential from the
#                                        culture-land account's bridge-push.env
#                                        (t5); environment only, read by a
#                                        temporary GIT_ASKPASS with the
#                                        configured helpers reset on push.
#   NODES_API_URL                        the control plane the runs live in.
#   NODES_API_TOKEN                      the runner principal's bearer for the
#                                        list/view/cancel calls. Honest note:
#                                        POST .../cancel is an
#                                        administrator-role route on an
#                                        Access-fronted listener
#                                        (internal/api/principal.go
#                                        principalPolicy); admitting an agent
#                                        bearer to it is a policy decision
#                                        this graph does not make.
#   NODES_API_COOKIE                     optional Cookie header for an
#                                        Access-fronted listener (the same
#                                        grant the operator's dispatch uses).
#
# The run identity (NODES_RUN_ID, NODES_NODE_RUN_ID, NODES_ATTEMPT_ID) and the
# resolved input (NODES_INPUT_JSON) are NOT granted by the deployment: the
# runner boundary forwards them from the operation's own context
# (internal/runners.ContextEnvironment).
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: cleanup
  version: 1.1.0
  ownerRef: team/platform-ai

spec:
  entry: route

  triggers:
    - onEvent: pr.merged
      when: event.payload.source == "github_pr"
    - onEvent: pr.closed
      when: event.payload.source == "github_pr"

  contract:
    # The triggering fact, verbatim. Both lifecycle facts share source,
    # repository and number; the rest is per fact, so it is optional here and
    # the node refuses a fact carrying neither timestamp.
    input:
      schema:
        type: object
        required: [source, repository, number]
        properties:
          source: {const: github_pr}
          repository: {type: string, minLength: 1}
          number: {type: integer, minimum: 1}
          url: {type: string}
          head_sha: {type: string}
          merged_at: {type: string, minLength: 1}
          closed_at: {type: string, minLength: 1}
          issue_key: {type: string, minLength: 1}
          work_item: {type: string, minLength: 1}
    output:
      schema: {type: object}

  # Longest path: route -> stage-merged -> cleanup -> stage-cleanup -> cleaned
  # (5 transitions); 8 leaves headroom without hiding a loop, and there is
  # none -- every node id is distinct and visited at most once by
  # construction.
  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 1
    maxParallelTokens: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 20

  nodes:
    # Which of the two lifecycle facts started this run, and therefore whether
    # there is a `merged` stage to record. A decision node computes nothing:
    # its output IS its resolved input, so the port reads `output.fact`. The
    # whole input is bound rather than one field because a pointer to a key
    # the fact does not carry has nothing to resolve -- pr.closed has no
    # `issue_key` at all. First match wins; the unconditional port is last.
    route:
      kind: decision
      ownerRef: team/platform-ai
      input:
        bindings:
          fact: /run/input
      select:
        - outcome: merged
          when: has(output.fact.issue_key)
        - outcome: closed
          when: "true"

    # Stage `merged`, the pr.merged path only (the `merged` route is what
    # reaches it, and it selected on the presence of the correlated key this
    # node binds). Exact-key input for adapters/jira post_comment.parse:
    # {verb, issue, comment} plus an optional question_id a stage comment has
    # no use for. The bridge appends its own jira-actor marker to what it
    # posts; this graph must never write one itself.
    stage-merged:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/jira-comment@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ledger:
        propose: [claim]
      input:
        bindings:
          verb:
            literal: post_comment
          issue: /run/input/issue_key
          comment:
            literal: |-
              culture-nodes:stage=merged
              The pull request for this work item was merged; the culture-nodes cleanup node is now closing its loose ends -- landed branches, handover refs and any run still parked on the merge decision.
      contract:
        outcomes:
          comment_posted:
            schema:
              type: object
              required: [issue, comment_id]
      policy:
        timeout: 10m
        retry:
          maxAttempts: 2

    cleanup:
      kind: code
      ownerRef: team/platform-ai
      uses: runner://headspace/cleanup@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      operation:
        image: python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
        # `full` for the same three reasons the sweep and combining-loop give:
        # the granted origin the program is fetched from, the git remote, and
        # the control plane. An egress allowlist is not yet expressible (#50).
        network: full
        environmentRefs:
          - CLEANUP_SOURCE_URL
          - CLEANUP_SOURCE_SHA256
          - CLEANUP_REMOTE
          - CLEANUP_DEFAULT_BRANCH
          - CLEANUP_PARKED_NODE
          - GITHUB_TOKEN_WORKER
          - NODES_API_URL
          - NODES_API_TOKEN
          - NODES_API_COOKIE
        argv:
          - python3
          - -c
          - |
            import hashlib, os, subprocess, sys, tempfile, urllib.request
            want = os.environ["CLEANUP_SOURCE_SHA256"]
            body = urllib.request.urlopen(os.environ["CLEANUP_SOURCE_URL"], timeout=60).read()
            if hashlib.sha256(body).hexdigest() != want:
                sys.exit("cleanup: fetched bytes do not match the granted digest; refusing to run unverified code")
            path = os.path.join(tempfile.mkdtemp(), "cleanup.py")
            open(path, "wb").write(body)
            sys.exit(subprocess.run([sys.executable, path]).returncode)
      input:
        bindings:
          fact: /run/input
      contract:
        # Exit 0 -> passed: every step succeeded, declined refs and skipped
        # runs included (they are the honest answer, not a failure). A
        # nonzero exit -> failed: an environment step failed and the record
        # names it by step.
        outcomes:
          passed:
            schema: {type: object}
          failed:
            schema: {type: object}
      ledger:
        observe: [evidence]
      policy:
        timeout: 15m
        retry:
          maxAttempts: 1

    # Stage `cleanup` on the merged path, bound to the same `issue_key` the
    # `merged` comment used.
    stage-cleanup:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/jira-comment@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ledger:
        propose: [claim]
      input:
        bindings:
          verb:
            literal: post_comment
          issue: /run/input/issue_key
          comment:
            literal: |-
              culture-nodes:stage=cleanup
              The culture-nodes cleanup node finished for this work item: reachable branches and handover refs were deleted, unreachable ones were kept and reported, and any run parked on the merge decision was cancelled with a machine-readable reason. The one derived record listing every removal is the node's attempt artifact in the culture-nodes control plane.
      contract:
        outcomes:
          comment_posted:
            schema:
              type: object
              required: [issue, comment_id]
      policy:
        timeout: 10m
        retry:
          maxAttempts: 2

    # Stage `cleanup` on the pr.closed path. Same stage, same words about the
    # record, different pointer: a pr.closed fact names the work item in
    # `work_item`, and its declined-everything outcome is worth saying in
    # its own sentence rather than leaving a reader to infer it.
    stage-cleanup-declined:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/jira-comment@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ledger:
        propose: [claim]
      input:
        bindings:
          verb:
            literal: post_comment
          issue: /run/input/work_item
          comment:
            literal: |-
              culture-nodes:stage=cleanup
              The pull request for this work item was closed without merging, so the culture-nodes cleanup node deleted nothing: every branch and handover ref it found is unreachable from the default branch and is the only copy of that work, so all of them were kept and reported. Any run parked on the merge decision was cancelled with a machine-readable reason. The one derived record listing each ref it declined is the node's attempt artifact in the culture-nodes control plane.
      contract:
        outcomes:
          comment_posted:
            schema:
              type: object
              required: [issue, comment_id]
      policy:
        timeout: 10m
        retry:
          maxAttempts: 2

    cleaned:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/cleanup/output

    cleanup-failed:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/cleanup/output

  edges:
    - from: route.merged
      to: stage-merged
    - from: stage-merged.comment_posted
      to: cleanup
    # A pr.closed fact has no `merged` stage to record: nothing landed.
    - from: route.closed
      to: cleanup
    # Every `cleanup.passed` edge carries a guard, and that is not redundancy.
    # The engine selects the first eligible edge in the COMPILER's normalized
    # order -- source, outcome, TARGET, guard text (normalizeEdges) -- not in
    # the order this document lists them, and `cleaned` sorts before both
    # stage nodes. An unguarded `cleaned` edge would therefore win before any
    # stage guard was evaluated and no ticket would ever see `cleanup`.
    #
    # The three guards are exhaustive and mutually exclusive: `issue_key` is
    # present on exactly the merged fact, and the remaining closed fact either
    # names a Jira-shaped work item or does not.
    - from: cleanup.passed
      to: stage-cleanup
      when: has(input.issue_key)
    - from: cleanup.passed
      to: stage-cleanup-declined
      when: '!has(input.issue_key) && has(input.work_item) && !input.work_item.startsWith("gh:")'
    - from: cleanup.passed
      to: cleaned
      when: '!has(input.issue_key) && (!has(input.work_item) || input.work_item.startsWith("gh:"))'
    - from: stage-cleanup.comment_posted
      to: cleaned
    - from: stage-cleanup-declined.comment_posted
      to: cleaned
    # A failed cleanup posts no stage: the loose ends are NOT closed, and a
    # comment saying they were would be the false record this graph exists to
    # avoid. The failure is in the run and in the node's own record.
    - from: cleanup.failed
      to: cleanup-failed
