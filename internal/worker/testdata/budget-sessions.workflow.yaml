# Three agent turns against ONE actor under a one-session budget (task t11,
# spec claims c6/c46).
#
# The same graph proves both halves of the session-counting rule, and which
# half it proves depends only on whether the actor offers a continuation
# handle:
#
#   * an actor that offers one -> turns two and three are WARM resumes of a
#     session already paid for, they charge nothing, and all three turns run
#     under maxSessions: 1;
#   * an actor that offers none -> every turn is a COLD START, the second one
#     cannot be funded, and it is refused before anything is invoked and
#     routed down `budget_exhausted`.
#
# The refusal target is an END node on purpose. Once the session budget is
# spent every further agent dispatch is refused too, so routing a refusal to
# another agent would only be refused again; a workflow that declares a
# budget needs somewhere to LAND. It binds its output to the first node,
# which did run, because an end node bound to a node that never produced
# output is a contract failure rather than an empty result.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: worker-budget-sessions-slice
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: first

  contract:
    input:
      schema:
        type: object
        required: [subject]
        properties:
          subject:
            type: string
    output:
      schema:
        type: object
        required: [summary]
        properties:
          summary:
            type: string

  limits:
    maxDuration: 1h
    maxTransitions: 8
    maxVisitsPerNode: 4
    maxParallelTokens: 1

  budget:
    maxSessions: 1

  ledger:
    schemaVersion: nodes.culture.dev/ledger/v1alpha1
    maxRecordsPerNode: 10

  nodes:
    first:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/analyzer@sha256:aaaaaa
      input:
        from: /run/input
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [summary]
              properties:
                summary:
                  type: string
      ledger:
        propose: [claim, result]
      policy:
        timeout: 2m
        retry:
          maxAttempts: 1
          backoff: none

    second:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/analyzer@sha256:aaaaaa
      input:
        from: /nodes/first/output
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [summary]
              properties:
                summary:
                  type: string
      ledger:
        propose: [claim, result]
      policy:
        timeout: 2m
        retry:
          maxAttempts: 1
          backoff: none

    third:
      kind: agent
      ownerRef: team/platform-ai
      uses: actor://company/analyzer@sha256:aaaaaa
      input:
        from: /nodes/second/output
      contract:
        outcomes:
          completed:
            schema:
              type: object
              required: [summary]
              properties:
                summary:
                  type: string
      ledger:
        propose: [claim, result]
      policy:
        timeout: 2m
        retry:
          maxAttempts: 1
          backoff: none

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/third/output

    stopped:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/first/output

  edges:
    - from: first.completed
      to: second

    - from: second.completed
      to: third

    - from: third.completed
      to: finish

    - from: second.budget_exhausted
      to: stopped

    - from: third.budget_exhausted
      to: stopped
