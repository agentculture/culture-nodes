# A clean split/join workflow (issue #43, parallel-tokens design §8): a
# `parallel` router fans out per eligible `fan.split` edge, two branches run
# concurrently, and a `join` barrier with policy `all` reconvenes them before
# the end node. It compiles with no errors and no warnings — the positive
# control for the checkParallelJoin structural checks and the proof that the
# kind-implied outcomes (`split`, `joined`) route like any other outcome.
apiVersion: nodes.culture.dev/v1alpha1
kind: Workflow

metadata:
  name: parallel-join-ok
  version: 1.0.0
  ownerRef: team/platform-ai

spec:
  entry: fan

  contract:
    input:
      schema:
        type: object
    output:
      schema:
        type: object

  limits:
    maxDuration: 1h
    maxTransitions: 16
    maxVisitsPerNode: 4
    maxParallelTokens: 4

  nodes:
    fan:
      kind: parallel
      ownerRef: team/platform-ai

    lint:
      kind: agent
      ownerRef: team/quality-platform
      uses: actor://company/linter@sha256:aaaaaa
      input:
        from: /run/input
      contract:
        outcomes:
          clean:
            schema:
              type: object

    test:
      kind: agent
      ownerRef: team/quality-platform
      uses: actor://company/tester@sha256:bbbbbb
      input:
        from: /run/input
      contract:
        outcomes:
          passed:
            schema:
              type: object

    gather:
      kind: join
      ownerRef: team/platform-ai
      join:
        policy: all

    finish:
      kind: end
      ownerRef: team/platform-ai
      output:
        from: /nodes/gather/output

  edges:
    - from: fan.split
      to: lint

    - from: fan.split
      to: test

    - from: lint.clean
      to: gather

    - from: test.passed
      to: gather

    - from: gather.joined
      to: finish
