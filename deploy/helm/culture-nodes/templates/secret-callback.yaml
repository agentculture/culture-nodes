{{- if .Values.callback.enabled -}}
# Shared between api (verifies) and worker (mints) — see
# values.yaml's callback.tokenSecret comment. Mounted into api via
# NODES_CALLBACK_TOKEN_SECRET (internal/api/server.go's
# WithCallbackSigner, wired in cmd/nodes/serve.go) and into worker via the
# same env var (cmd/nodes/worker.go's callbackConfig).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "culture-nodes.fullname" . }}-callback
  labels:
    {{- include "culture-nodes.labels" . | nindent 4 }}
type: Opaque
stringData:
  NODES_CALLBACK_TOKEN_SECRET: {{ include "culture-nodes.callbackTokenSecret" . | quote }}
{{- end -}}
